<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Front Line</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#14202b;--panel:#1b2a38;--line:#2e4256;--txt:#e8eef4;--mut:#8fa3b5;--acc:#ffd23f;
--free:#29b6f6;--occ:#e53935;--fight:#9e9e9e;--font:"Trebuchet MS","Segoe UI",system-ui,sans-serif;--btn:#223445;--btnh:#2a4156;--btnon:#33485c;--accT:#1a1a1a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:var(--font);color:var(--txt);background:var(--bg)}
#map{position:absolute;inset:0;background:#e9e5dc;user-select:none;-webkit-user-select:none}
#map.draw,#map.paint,#map.erase{cursor:crosshair}
#map.pan{cursor:grab}
.leaflet-overlay-pane path:not(.leaflet-interactive){pointer-events:none}

/* Головне меню */
#menu{position:fixed;inset:0;z-index:2000;display:flex;align-items:center;justify-content:center;
background:#0b1118;overflow:hidden}
#menu .card{background:var(--bg);padding:40px 44px;border-radius:6px;max-width:440px;margin:16px;text-align:center;box-shadow:0 20px 60px #0008}
#menuBg{position:absolute;inset:0;z-index:0;pointer-events:none;background:#0b1118}
#menuShade{position:absolute;inset:0;z-index:1;pointer-events:none;
background:linear-gradient(90deg,#000e 0%,#000a 14%,#0004 32%,#0000 45%,#0000 55%,#0004 68%,#000a 86%,#000e 100%),radial-gradient(ellipse at center,#0000 35%,#0007 100%),#0003}
#menu .card{position:relative;z-index:2;border:1px solid var(--line)}
#mapsel{justify-content:center;margin:0 0 16px}
#credit{font-size:11px;color:var(--mut);margin-top:12px;line-height:1.4}
#menu h1{margin:0 0 10px;font-size:40px;letter-spacing:.5px}
#menu p{color:var(--mut);line-height:1.5;margin:0 0 26px}
.big{font:inherit;font-size:20px;font-weight:700;padding:14px 38px;border:0;border-radius:4px;background:var(--acc);color:var(--accT);cursor:pointer}
.big:hover{filter:brightness(1.08)}
.big.sec{display:block;margin:12px auto 0;font-size:16px;padding:11px 28px;background:var(--btn);color:var(--txt);border:1px solid var(--line)}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--txt);margin-top:8px;cursor:pointer}
.chk input{accent-color:var(--acc)}
.leaflet-control-layers-list{max-height:72vh;overflow:auto}
#drop{position:fixed;inset:0;z-index:3000;display:flex;align-items:center;justify-content:center;background:#000a;color:#fff;font-size:26px;font-weight:700;pointer-events:none}

/* Панель керування */
#panel{position:absolute;z-index:1000;top:12px;left:12px;width:262px;max-height:calc(100% - 24px);overflow:auto;
background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px;box-shadow:0 8px 24px #0006}
.grp{margin-bottom:12px}
.grp>b{display:block;font-size:13px;color:var(--mut);margin-bottom:6px;font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:6px}
button.t{font:inherit;font-size:13px;padding:7px 9px;border-radius:4px;border:1px solid var(--line);
background:var(--btn);color:var(--txt);cursor:pointer;display:flex;align-items:center;gap:6px}
button.t:hover{background:var(--btnh)}
button.t.on{border-color:var(--acc);background:var(--btnon);box-shadow:inset 0 0 0 1px var(--acc)}
button.t:focus-visible,.big:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;border:1px solid #fff8}
.mini{width:16px;height:11px;display:inline-block;border:1px solid #0008}
input[type=range]{width:100%;accent-color:var(--acc)}
#stats{font-size:12px;color:var(--mut);border-top:1px solid var(--line);padding-top:8px;line-height:1.6}
#stats i{font-style:normal;color:var(--txt)}
.danger{border-color:#7a3030}
#hint{position:absolute;z-index:1000;bottom:12px;left:50%;transform:translateX(-50%);background:var(--panel);
border:1px solid var(--line);border-radius:4px;padding:8px 14px;font-size:13px;max-width:92%;text-align:center}
#toast{position:absolute;z-index:1500;top:14px;left:50%;transform:translateX(-50%);background:var(--acc);color:var(--accT);
font-weight:700;font-size:14px;padding:9px 16px;border-radius:4px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
[hidden]{display:none!important}

@media(max-width:560px){#panel{width:calc(100% - 24px)}#hint{bottom:8px}}
#map{touch-action:none}
#map.ruler{cursor:crosshair}
button.t:disabled{opacity:.4;cursor:default}
#phead{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;background:var(--panel);margin:-12px -12px 8px;padding:10px 12px}
#phead b{font-size:14px}
#phead .hb{display:flex;gap:6px}
#set{position:fixed;inset:0;z-index:2500;display:flex;align-items:center;justify-content:center;background:#000a}
#set .card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;width:min(540px,calc(100% - 24px));max-height:90vh;overflow:auto;box-shadow:0 20px 60px #0008}
.shead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-size:17px}
.swp{width:18px;height:18px;border-radius:50%;border:1px solid #fff9;flex:none}
#panel.collapsed{padding-bottom:0}
#panel.collapsed>:not(#phead){display:none}
#panel.collapsed #phead{margin-bottom:0}
.rlab span{display:inline-block;transform:translate(-50%,-135%);background:var(--acc);color:var(--accT);font:700 12px/1 "Trebuchet MS","Segoe UI",sans-serif;padding:4px 7px;border-radius:3px;white-space:nowrap;box-shadow:0 1px 4px #0006}
@media(pointer:coarse){button.t{padding:10px 11px;font-size:14px}.big{padding:14px 30px}}
@media(max-width:560px){
#panel{top:auto;bottom:0;left:0;right:0;width:auto;max-height:46vh;border-radius:12px 12px 0 0;border-width:1px 0 0 0}
#hint{top:8px;bottom:auto;left:8px;transform:none;max-width:calc(100% - 64px);font-size:12px;padding:6px 10px;text-align:left}
.leaflet-control-zoom{display:none}
}
</style>
</head>
<body>

<div id="menu">
  <div id="menuBg"></div><div id="menuShade"></div>
  <div class="card">
    <h1 data-i="title"></h1>
    <p data-i="menuTxt"></p>
    <div class="row" id="mapsel">
      <button class="t on" data-map="empty"><span data-i="map_empty"></span></button>
      <button class="t" data-map="real"><span data-i="map_real"></span></button>
    </div>
    <button class="big" id="menuResume" hidden style="display:block;margin:0 auto 12px"></button>
    <button class="big" id="start" data-i="start"></button>
    <button class="big sec" id="menuLoad" data-i="loadsave"></button>
    <button class="big sec" id="menuSet" data-i="settings"></button>
    <div id="credit" data-i="credit" hidden></div>
  </div>
</div>

<div id="map"></div>

<div id="set" hidden>
  <div class="card">
    <div class="shead"><b data-i="settingsT"></b><button class="t" id="setClose">✕</button></div>
    <div class="grp"><b data-i="lang"></b><div class="row" id="langs"></div></div>
    <div class="grp"><b data-i="themeF"></b><div class="row" id="thF"></div></div>
    <div class="grp"><b data-i="themeP"></b><div class="row" id="thP"></div></div>
  </div>
</div>

<div id="panel" hidden>
  <div id="phead"><b data-i="ctrl"></b><div class="hb"><button class="t" id="pset" data-tt="settingsT">⚙️</button><button class="t" id="ptoggle" data-tt="collapse">▾</button></div></div>
  <div class="grp row"><button class="t" id="hundo" data-i="undo"></button><button class="t" id="hredo" data-i="redo"></button></div>
  <div class="grp"><b data-i="mode"></b>
    <div class="row" id="modes">
      <button class="t" data-mode="pan"><span data-i="m_pan"></span></button>
      <button class="t" data-mode="draw"><span data-i="m_draw"></span></button>
      <button class="t" data-mode="paint"><span data-i="m_paint"></span></button>
      <button class="t" data-mode="erase"><span data-i="m_erase"></span></button>
      <button class="t" data-mode="ruler"><span data-i="m_ruler"></span></button>
    </div>
  </div>
  <div class="grp"><b data-i="zonecol"></b>
    <div class="row" id="sts">
      <button class="t" data-st="free"><span class="dot" style="background:var(--free)"></span><span data-i="st_free"></span></button>
      <button class="t" data-st="occ"><span class="dot" style="background:var(--occ)"></span><span data-i="st_occ"></span></button>
      <button class="t" data-st="fight"><span class="dot" style="background:var(--fight)"></span><span data-i="st_fight"></span></button>
    </div>
  </div>
  <div class="grp"><b data-i="buf"></b>
    <label class="chk"><input type="checkbox" id="bufOn" checked> <span><span data-i="bufOn"></span>: <span id="bufV"></span></span></label>
    <input type="range" id="bufW" min="0.5" max="10" step="0.5" value="2">
    <div class="row" style="margin-top:6px"><button class="t" id="bufNow" data-i="bufNow"></button></div>
  </div>
  <div class="grp" id="drawBox" hidden><b data-i="curshape"></b>
    <div class="row">
      <button class="t" id="fin" data-i="finish"></button>
      <button class="t" id="undo" data-i="stepback"></button>
      <button class="t" id="cancel" data-i="cancel"></button>
    </div>
    <label class="chk"><input type="checkbox" id="anOn" checked> <span><span data-i="anim"></span>: <span id="anv"></span></span></label>
    <input type="range" id="anT" min="0.5" max="5" step="0.5" value="1.5">
  </div>
  <div class="grp" id="brushBox" hidden><b><span data-i="brush"></span>: <span id="bv"></span></b>
    <input type="range" id="brush" min="0" max="100" step="5" value="20">
  </div>
  <div class="grp" id="eraseBox" hidden><b><span data-i="eraser"></span>: <span id="ev"></span></b>
    <input type="range" id="esize" min="1" max="300" step="1" value="40">
    <label class="chk"><input type="checkbox" id="eonly"> <span data-i="eonly"></span></label>
  </div>
  <div class="grp row">
    <button class="t" id="save" data-i="save"></button>
    <button class="t" id="load" data-i="load"></button>
    <button class="t danger" id="clear" data-i="clear"></button>
  </div>
  <div id="stats"></div>
</div>

<input type="file" id="file" accept=".json,application/json" hidden>
<div id="drop" hidden data-i="dropT"></div>
<div id="hint" hidden></div>
<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Turf.js/6.5.0/turf.min.js"></script>
<script>
// ---------- Дані та налаштування ----------
const ST = { free: { color: '#29b6f6' }, occ: { color: '#e53935' }, fight: { color: '#9e9e9e' } };
let mode = 'draw', status = 'free';
const COARSE = !!(window.matchMedia && matchMedia('(pointer:coarse)').matches);
let zones = [];   // {status, f (GeoJSON Feature), layer}
let pts = [], tmp = null, tmpM = [], ghost = null, eGhost = null;

const $ = id => document.getElementById(id);

// ---------- Мови та теми ----------
const D = {
title:["Front Line","Линия фронта"],
menuTxt:["Draw zones on the map and repaint areas inside existing polygons. Grey combat zones build themselves along the front as you draw.","Рисуй зоны на карте и перекрашивай участки в пределах существующих полигонов. Серые зоны боёв строятся сами вдоль фронта."],
start:["Start playing","Начать играть"],
newgame:["New game","Новая игра"],
resume:["▶ Continue","▶ Продолжить"],
loadsave:["📂 Load a save","📂 Загрузить сохранение"],

m_paint:["🖌️ Paint","🖌️ Покраска"],
m_erase:["🧽 Eraser","🧽 Ластик"],
m_ruler:["📏 Ruler","📏 Линейка"],
zonecol:["Zone / colour","Зона / цвет"],
st_free:["Liberated","Освобождено"],
st_occ:["Occupied","Оккупация"],
st_fight:["Fighting","Идут бои"],
curshape:["Current shape","Текущая фигура"],

cancel:["Cancel","Отмена"],
anim:["🎞 Advance animation","🎞 Анимация продвижения"],
brush:["Brush","Кисть"],
brush_r:["radius {0} km","радиус {0} км"],
brush_all:["whole zone","вся зона"],
eraser:["Eraser","Ластик"],
eonly:["Erase only the selected zone colour","Стирать только выбранный цвет зоны"],
save:["💾 Save to file","💾 Сохранить в файл"],
load:["📂 Load from file","📂 Загрузить из файла"],
clear:["Clear all","Очистить всё"],
km:["km","км"],
m:["m","м"],
km2:["km²","км²"],
sec:["s","с"],
dropT:["Drop the save file","Отпусти файл сохранения"],
t_esri:["Esri failed to load, switching to OpenStreetMap","Esri не загрузился, переключаю на OpenStreetMap"],
t_layer:["Layer \"{0}\" fails to load, pick another in the layers menu","Слой «{0}» не загружается — выбери другой в меню слоёв"],
t_noas:["Autosave unavailable (blocked by the browser or no space)","Автосохранение недоступно (браузер блокирует или нет места)"],
t_nou:["Nothing to undo","Нечего отменять"],
t_u:["Undone","Отменено"],
t_nor:["Nothing to redo","Нечего возвращать"],
t_r:["Redone","Возвращено"],
t_3:["At least 3 points are needed","Нужно минимум 3 точки"],
t_fonly:["Liberated zones can only be drawn over occupied or grey territory","Освобождённую зону можно рисовать только на оккупированной или серой территории"],
t_inz:["Click inside a drawn zone","Кликни внутри нарисованной зоны"],
t_same:["This area already has that status","Этот участок уже имеет такой статус"],
t_cut:["Could not clip the shape","Не удалось обрезать форму"],
t_saved:["Saved: {0}","Сохранено: {0}"],
t_dl:["File saved (Downloads folder)","Файл сохранён (папка «Загрузки»)"],
t_nosave:["Could not save the file","Не удалось сохранить файл"],
t_savedesc:["Game save","Сохранение игры"],
t_notsave:["This is not a game save file","Это не файл сохранения игры"],
t_bad:["The file is corrupted","Файл повреждён"],
t_loaded:["Loaded: {0}","Загружено: {0}"],
t_restored:["Autosave restored","Автосохранение восстановлено"],
c_new:["The saved map will be replaced by a new game. Continue?","Сохранённая карта будет заменена новой игрой. Продолжить?"],
c_load:["The current map will be replaced by the save from the file. Continue?","Текущая карта будет заменена сохранением из файла. Продолжить?"],
c_clear:["Remove all shapes from the map?","Удалить все фигуры с карты?"],
map_empty:["🗺 Empty map","🗺 Пустая карта"],
map_real:["🛰 Real front line","🛰 Реальная линия фронта"],
loading:["Loading…","Загрузка…"],
credit:["Front line data: DeepStateMap.Live (via the cyterat/deepstate-map-data GitHub mirror). Internet required.","Данные линии фронта: DeepStateMap.Live (через GitHub-зеркало cyterat/deepstate-map-data). Нужен интернет."],
t_front:["Front line loaded {0}","Линия фронта загружена {0}"],
t_frontfail:["Could not load the front line, starting with an empty map","Не удалось загрузить линию фронта — начата пустая карта"],
buf:["Grey zone between fronts","Серая зона между фронтами"],
bufOn:["Auto combat strip","Авто-полоса боёв"],
bufNow:["Build now","Построить сейчас"],
t_bufok:["Grey zone built","Серая зона построена"],
t_bufno:["No occupied territory to build a combat strip on","Нет оккупированной территории для полосы боёв"],
h_draw:["Click to add points, or hold the mouse button and drag: the shape closes on release. \"Liberated\" can only be drawn over occupied or grey zones (the excess is clipped). Pan the map: Shift + drag or middle mouse button.","Кликай, чтобы ставить точки, или зажми кнопку мыши и веди — фигура замкнётся при отпускании. «Освобождено» рисуется только на оккупированной или серой зоне (лишнее обрезается). Движение карты: Shift + перетаскивание или средняя кнопка мыши."],
h_erase:["Hold and drag: the eraser removes a piece of the zone under the cursor (size in screen pixels). Pan the map: Shift + drag or middle mouse button.","Зажми и води: ластик стирает кусочек зоны под курсором (размер — в пикселях экрана). Движение карты: Shift + перетаскивание или средняя кнопка мыши."],
h_paint:["Click, or hold and drag: the colour changes only within the zone under the cursor. Adjacent areas of the same colour merge. Pan the map: Shift + drag or middle mouse button.","Кликни или зажми и води: цвет меняется только в пределах зоны под курсором. Смежные участки одного цвета сливаются. Движение карты: Shift + перетаскивание или средняя кнопка мыши."],
h_pan:["Drag the map with the mouse. Wheel to zoom.","Тяни карту мышью. Колесо — масштаб."],
h_ruler:["Click the first point, then the second to see the straight-line distance. The next click starts a new measurement. Esc clears it.","Кликни первую точку, затем вторую — увидишь расстояние по прямой. Следующий клик начинает новое измерение. Esc — убрать."],
ht_draw:["One finger: tap adds a point, dragging draws a free line (closes on release). Two fingers pan and zoom the map.","Один палец: тап — точка, ведение — свободная линия (замкнётся при отпускании). Два пальца — движение и масштаб карты."],
ht_paint:["Touch or drag: the colour changes only within the zone. Two fingers pan and zoom the map.","Коснись или веди пальцем — цвет меняется только в пределах зоны. Два пальца — движение и масштаб карты."],
ht_erase:["Drag a finger: the eraser removes the zone under it. Two fingers pan and zoom the map.","Веди пальцем — ластик стирает зону под ним. Два пальца — движение и масштаб карты."]
};
const LOC = { en: 'en-US', ru: 'ru-RU' }, LIDX = { en: 0, ru: 1 };
const SET_KEY = 'frontline-settings';
const cfg = { lang: 'en', theme: 'blue' };
try { Object.assign(cfg, JSON.parse(localStorage.getItem(SET_KEY) || '{}')); } catch (e) {}
if (!(cfg.lang in LIDX)) cfg.lang = 'en';
function saveCfg() { try { localStorage.setItem(SET_KEY, JSON.stringify(cfg)); } catch (e) {} }
const t = (k, ...a) => { const e = D[k]; let s = e ? e[LIDX[cfg.lang]] : k; a.forEach((v, i) => { s = s.split('{' + i + '}').join(v); }); return s; };
const decSep = () => cfg.lang === 'en' ? '.' : ',';
// map layer names (English source; translated via LN)
const LN = [["Terrain","Рельеф местности"],["Shaded relief","Теневой рельеф"],["French style","Французский стиль"],["German style","Немецкий стиль"],["Topographic","Топографическая"],["Physical","Физическая карта"],["Hillshade","Тени рельефа"],["Railways","Железные дороги"],["Sea marks","Морские знаки"],["Bike roads","Велодороги"],["Relief","Рельеф"],["Map","Схема"],["Light","Светлая"],["Dark","Тёмная"],["Oceans","Океаны"],["Satellite","Спутник"],["Labels","Подписи"],["Roads","Дороги"]];
const LNre = new RegExp(LN.map(x => x[0]).join('|'), 'g');
const ln = s => LNre ? s.replace(LNre, w => LN.find(x => x[0] === w)[LIDX[cfg.lang]]) : s;
// Themes: [id, group (f - themed, p - plain), 'en|ru', 'bg panel line txt mut acc accT btn btnh btnon', font]
const THEMES = [
['nightops','f','Night Ops|Ночной дозор','#0b140d #101d12 #24402a #d6f5d9 #7fa886 #5dff7a #04140a #16281a #1d3623 #23422b'],
['cyber','f','Cyberpunk|Киберпанк','#120a24 #1a1033 #43276e #f1e6ff #a28dc9 #ff2e97 #1a0614 #261548 #321d5c #3d2270'],
['desert','f','Desert|Пустыня','#efe3c8 #f7eed9 #cdb98c #3b2c18 #7d6a48 #c2561b #ffffff #eadbb8 #e0cd9f #d9c28f'],

function toast(t) {

const zStyle = s => ({ color: ST[s].color, weight: 2, opacity: 1, fillColor: ST[s].color, fillOpacity: 0.4, lineJoin: 'miter', lineCap: 'butt' });

function addZone(s, geometry) {
  const f = { type: 'Feature', properties: {}, geometry };
  const z = { status: s, f };
  z.layer = L.geoJSON(f, { style: () => zStyle(z.status), interactive: false, pane: 'zones' }).addTo(zoneLayer);
  zones.push(z);
  return z;
}
// Об'єднує зону з дотичними зонами того ж статусу, щоб не було «швів» між шматками
function mergeSame(z) {
  try {
    let cur = z, found = true;
    while (found) {
      found = false;
      for (const o of zones) {
        if (o === cur || o.status !== cur.status || !turf.booleanIntersects(cur.f, o.f)) continue;
        const u = turf.union(cur.f, o.f);
        if (!u) continue;
        const st = cur.status;
        delZone(cur); delZone(o);
        cur = addZone(st, u.geometry);
        found = true; break;
      }
    }
    return cur;
  } catch (err) { console.error(err); return z; }
}
function refreshZone(z) { z.layer.clearLayers(); z.layer.addData(z.f); }
function delZone(z) { zoneLayer.removeLayer(z.layer); zones = zones.filter(x => x !== z); }

// ---------- Реальна лінія фронту (DeepStateMap через відкрите GitHub-дзеркало, завантажується при старті) ----------
const FRONT_TOL = 0.002;                               // спрощення геометрії, ° (~200 м): менше вершин — швидша гра
async function loadFront() {
  const RAW = 'https://raw.githubusercontent.com/cyterat/deepstate-map-data/main/data/';
  const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 30000);
  const get = async url => { const r = await fetch(url, { signal: ctl.signal }); if (!r.ok) throw new Error(r.status); return r.json(); };
  try {
    let name = null, data = null;
    try {                                              // найновіший файл із папки data
      const list = await get('https://api.github.com/repos/cyterat/deepstate-map-data/contents/data');
      name = list.map(x => x.name).filter(n => /\.geojson$/.test(n)).sort().pop();
      if (name) data = await get(RAW + name);
    } catch (e) { data = null; }
    for (let i = 0; !data && i < 8; i++) {             // запасний шлях: перебираємо останні дні
      const d = new Date(Date.now() - i * 864e5), y = d.getUTCFullYear(), m = String(d.getUTCMonth() + 1).padStart(2, '0'), dd = String(d.getUTCDate()).padStart(2, '0');
      for (const x of [y + m + dd, y + '-' + m + '-' + dd]) {
        try { name = 'deepstatemap_data_' + x + '.geojson'; data = await get(RAW + name); break; } catch (e) { data = null; }
      }
    }
    if (!data) return null;
    const polys = [];
    (data.features || [data]).forEach(f => {
      const g = f.type === 'Feature' ? f.geometry : f;
      if (!g) return;
      if (g.type === 'Polygon') polys.push(g.coordinates); else if (g.type === 'MultiPolygon') g.coordinates.forEach(p => polys.push(p));
    });
    if (!polys.length) return null;
    let mp = turf.multiPolygon(polys);
    try { mp = turf.simplify(mp, { tolerance: FRONT_TOL, highQuality: true }); } catch (e) { console.error(e); }
    try { const u = turf.union(mp, mp); if (u) mp = u; } catch (e) { console.error(e); }   // прибираємо самоперетини після спрощення
    const keep = [];
    turf.flatten(mp).features.forEach(p => { if (turf.area(p) > 3e5) keep.push(p.geometry.coordinates); });   // відкидаємо дрібні острівці
    if (!keep.length) return null;
    const m = (name || '').match(/(\d{4})-?(\d{2})-?(\d{2})/);
    return { geometry: { type: 'MultiPolygon', coordinates: keep }, date: m ? m[1] + '-' + m[2] + '-' + m[3] : '' };
  } catch (e) { console.error(e); return null; } finally { clearTimeout(to); }
}

function redrawTmp(light) {
  if (tmp) map.removeLayer(tmp);
  tmpM.forEach(m => map.removeLayer(m)); tmpM = []; tmp = null;
  if (!pts.length) return;
  const c = ST[status].color;
  tmp = (pts.length > 2 ? L.polygon : L.polyline)(pts, { color: c, weight: 2, dashArray: '6 4', fillOpacity: 0.2, interactive: false }).addTo(map);
  if (!light) tmpM = pts.map((p, i) => L.circleMarker(p, { radius: i ? 4 : 6, color: '#fff', weight: 2, fillColor: c, fillOpacity: 1, interactive: false }).addTo(map));
}
function cancelDraw() { pts = []; redrawTmp(); }
function finish() {
  if (pts.length < 3) return toast(t('t_3'));
  const ring = pts.map(p => [p.lng, p.lat]); ring.push(ring[0]);
  let geom = { type: 'Polygon', coordinates: [ring] };
  try {                                              // прибираємо самоперетини від малювання від руки
    const f = { type: 'Feature', properties: {}, geometry: geom }, u = turf.union(f, f);
    if (u) geom = u.geometry;
  } catch (err) { console.error(err); }
  const job = { st: status, geom, first: pts[0] };
  cancelDraw();
  startShape(job);
}

// ---------- Анімація просування фронту ----------
// Дані змінюються одразу. Поки йде анімація, справжній шар зон прихований, а на екрані — «візуальний» стан:
// початкова карта, на яку по черзі накладено вже відкриті частини кожної фігури. Тому кілька анімацій можуть іти одночасно.
let anims = [], base = null, aRaf = 0, aLast = 0, aStatic = null, aDyn = null, aDynZ = [];
function startShape(j) {
  let geom = j.geom;
  if (j.st === 'free') {                             // «Звільнено» можна малювати лише поверх «Окупації» та «Йдуть бої»
    geom = clipToEnemy(geom);
    if (!geom) return toast(t('t_fonly'));
  }
  const idle = !anims.length;
  if (idle) base = zones.map(z => ({ status: z.status, f: z.f }));      // стан ДО змін
  const A = $('anOn').checked ? prepAnim(j.st, geom, j.first) : null;
  const z = addZone(j.st, geom); carve(z); mergeSame(z); const S = autoBuffer(false, turf.bbox(geom)); stats();
  const mk = (g, extra) => {                         // одна анімація = фігура + сіра смуга, що відкриваються разом
    const parts = [{ st: j.st, g }];
    if (S) parts.push({ st: 'fight', g: S });
    return Object.assign({ parts, AG: turf.featureCollection(parts.map(p => p.g)) }, extra);
  };
  if (A) {
    anims.push(mk(A.AG, { c: A.c, r0: A.r0, r1: Math.max(A.r1, farthest(A.c, S)), t0: performance.now(), T: +$('anT').value * 1000, done: false }));
    if (idle) beginAnim(); else { rebuildStatic(); renderAnim(performance.now()); }
  } else if (!idle) {                                // анімацію вимкнено, але інші ще йдуть — ця фігура з'являється миттєво
    anims.push(mk({ type: 'Feature', properties: {}, geometry: geom }, { done: true }));
    rebuildStatic(); renderAnim(performance.now());
  } else base = null;
}
const flatC = (c, out) => { if (typeof c[0] === 'number') out.push(c); else c.forEach(x => flatC(x, out)); return out; };
function farthest(c, G) {
  let m = 0;
  if (G) flatC(G.geometry.coordinates, []).forEach(p => { const d = turf.distance(c, p, { units: 'kilometers' }); if (d > m) m = d; });
  return m;
}
// Анімація розходиться колом від ПЕРШОЇ точки, з якої почато малювання фігури, у бік наступу
function prepAnim(st, geom, first) {
  try {
    const G = { type: 'Feature', properties: {}, geometry: geom };
    const same = zones.filter(z => z.status === st);
    let AG = G, S = null;
    for (const z of same) { S = S ? turf.union(S, z.f) : z.f; if (!S) break; }
    if (S) { AG = turf.difference(G, S); if (!AG) return null; }
    const c = first ? [first.lng, first.lat] : turf.centroid(AG).geometry.coordinates, pc = turf.point(c);
    let r0 = 0;
    if (!turf.booleanPointInPolygon(pc, AG)) {         // стартова точка поза новою ділянкою — рахуємо від її краю
      r0 = Infinity;
      turf.flatten(AG).features.forEach(pl => {
        const np = turf.nearestPointOnLine(turf.polygonToLine(pl), pc, { units: 'kilometers' });
        if (np.properties.dist < r0) r0 = np.properties.dist;

async function saveFile() {

  const dt = new Date(), p = n => String(n).padStart(2, '0');
  const name = 'frontline-save-' + dt.getFullYear() + '-' + p(dt.getMonth() + 1) + '-' + p(dt.getDate()) + '_' + p(dt.getHours()) + p(dt.getMinutes()) + '.json';
  if (window.showSaveFilePicker) {                       // Chrome/Edge на ПК: вікно «Зберегти як…»
    try {
      const h = await window.showSaveFilePicker({ suggestedName: name, types: [{ description: t('t_savedesc'), accept: { 'application/json': ['.json'] } }] });
      const w = await h.createWritable(); await w.write(data); await w.close();
      return toast(t('t_saved', h.name));
    } catch (e) { if (e && e.name === 'AbortError') return; }   // інакше — звичайне завантаження
  }
  try {
    const url = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
    const a = document.createElement('a'); a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    toast(t('t_dl'));
  } catch (e) { toast(t('t_nosave')); }
}
function parseSave(txt) {
  const d = JSON.parse(txt);
  if (!d || !Array.isArray(d.zones)) throw new Error('format');
  const zs = d.zones.filter(z => z && ST[z.s] && z.g && (z.g.type === 'Polygon' || z.g.type === 'MultiPolygon') && Array.isArray(z.g.coordinates));
  const v = d.view, view = v && v.c && isFinite(v.c.lat) && isFinite(v.c.lng) && isFinite(v.z) ? v : null;
  return { zs, view, layers: d.layers };
}
async function loadFile(file) {
  if (!file) return;
  let d;
  try { d = parseSave(await file.text()); } catch (e) { return toast(t('t_notsave')); }
  if (zones.length) {
    if (!confirm(t('c_load'))) return;
  }
  if (!$('menu').hidden) startGame();
  try {
    applySave(d);
    toast(t('t_loaded', file.name));
  } catch (e) { console.error(e); toast(t('t_bad')); }
}
$('save').onclick = saveFile;
const pickFile = () => { $('file').value = ''; $('file').click(); };
$('load').onclick = pickFile;
$('menuLoad').onclick = pickFile;
$('file').onchange = e => loadFile(e.target.files[0]);
// Перетягни файл збереження прямо у вікно гри
let dragDepth = 0;
const hasFiles = e => e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files');
window.addEventListener('dragenter', e => { if (hasFiles(e)) { dragDepth++; $('drop').hidden = false; } });
window.addEventListener('dragleave', e => { if (hasFiles(e) && --dragDepth <= 0) { dragDepth = 0; $('drop').hidden = true; } });
window.addEventListener('dragover', e => { if (hasFiles(e)) e.preventDefault(); });
window.addEventListener('drop', e => {
  if (!hasFiles(e)) return;
  e.preventDefault(); dragDepth = 0; $('drop').hidden = true;
  loadFile(e.dataTransfer.files[0]);
});
$('clear').onclick = () => { if (confirm(t('c_clear'))) clearAll(); };

// ---------- Кнопки історії, гарячі клавіші, згортання панелі ----------
$('hundo').onclick = doUndo; $('hredo').onclick = doRedo;
$('ptoggle').onclick = () => { const c = $('panel').classList.toggle('collapsed'); $('ptoggle').textContent = c ? '▴' : '▾'; };
document.addEventListener('keydown', e => {
  if ($('panel').hidden) return;
  if (e.key === 'Escape' && mode === 'ruler') { rClear(); return; }
  if (!(e.ctrlKey || e.metaKey)) return;
  const tg = e.target;
  if (tg && (tg.tagName === 'TEXTAREA' || (tg.tagName === 'INPUT' && /^(text|search)$/.test(tg.type)))) return;
  if (e.code === 'KeyZ' && !e.shiftKey) {
    e.preventDefault();
    if (mode === 'draw' && pts.length) { pts.pop(); redrawTmp(); } else doUndo();   // у фігурі, що малюється, Ctrl+Z знімає останню точку
  } else if (e.code === 'KeyY' || (e.code === 'KeyZ' && e.shiftKey)) { e.preventDefault(); doRedo(); }
});

// ---------- Відновлення автозбереження ----------
function readAuto() {
  try {
    const t = localStorage.getItem(AS_KEY); if (!t) return null;
    const p = parseSave(t); p.at = JSON.parse(t).savedAt;
    return p.zs.length ? p : null;
  } catch (err) { return null; }
}
const auto0 = readAuto();
if (auto0) {
  $('menuResume').hidden = false;
  $('start').dataset.i = 'newgame'; $('start').classList.add('sec');
  $('menuResume').onclick = () => { startGame(); applySave(auto0); resetHist(); toast(t('t_restored')); };
}

function updAn() { $('anv').textContent = (+$('anT').value).toFixed(1).replace('.', decSep()) + ' ' + t('sec'); }
$('anT').oninput = updAn; updAn();
function applyTheme() {
  const th = THEMES.find(x => x[0] === cfg.theme) || THEMES.find(x => x[0] === 'blue'), v = th[3].split(' '), st = document.documentElement.style;
  TKEYS.forEach((k, i) => st.setProperty('--' + k, v[i]));
  st.setProperty('--font', th[4] || DEF_FONT);
}
function renderSettings() {
  const mk = (cls, label, on, fn, sw) => {
    const b = document.createElement('button'); b.className = 't' + (on ? ' on' : '');
    if (sw) { const s = document.createElement('span'); s.className = 'swp'; s.style.background = 'linear-gradient(135deg,' + sw[0] + ' 50%,' + sw[1] + ' 50%)'; b.appendChild(s); }
    b.appendChild(document.createTextNode(label)); b.onclick = fn; return b;
  };
  const L = $('langs'); L.textContent = '';
  [['en', 'English'], ['ru', 'Русский']].forEach(([c, n]) =>
    L.appendChild(mk('', n, cfg.lang === c, () => { cfg.lang = c; saveCfg(); applyLang(); })));
  [[$('thF'), 'f'], [$('thP'), 'p']].forEach(([box, g]) => {
    box.textContent = '';
    THEMES.filter(x => x[1] === g).forEach(x => {
      const v = x[3].split(' ');
      box.appendChild(mk('', x[2].split('|')[LIDX[cfg.lang]], cfg.theme === x[0], () => { cfg.theme = x[0]; saveCfg(); applyTheme(); renderSettings(); }, [v[0], v[5]]));
    });
  });
}
const openSet = () => { renderSettings(); $('set').hidden = false; };
const closeSet = () => { $('set').hidden = true; };
$('menuSet').onclick = openSet; $('pset').onclick = openSet; $('setClose').onclick = closeSet;
$('set').addEventListener('click', e => { if (e.target === $('set')) closeSet(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('set').hidden) closeSet(); });
function updHint() { $('hint').textContent = (COARSE && D['ht_' + mode]) ? t('ht_' + mode) : t('h_' + mode); }
function resumeLabel() {
  if (!auto0) return;
  const dt = auto0.at ? new Date(auto0.at) : null;
  $('menuResume').textContent = t('resume') + (dt && !isNaN(dt) ? ' (' + dt.toLocaleString(LOC[cfg.lang], { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) + ')' : '');
}
function applyLang() {
  document.documentElement.lang = cfg.lang; document.title = t('title');
  document.querySelectorAll('[data-i]').forEach(e => { e.textContent = t(e.dataset.i); });
  document.querySelectorAll('[data-ph]').forEach(e => { e.placeholder = t(e.dataset.ph); });
  document.querySelectorAll('[data-tt]').forEach(e => { e.title = t(e.dataset.tt); });
  buildLayersCtl(); updHint(); updBrush(); updAn(); updBuf(); renderStats(); resumeLabel(); renderSettings();
}

// Фон меню — карта світу (супутник) із затемненням по боках
let menuMap = null;
try {
  const z = Math.min(4, Math.max(2, Math.round(Math.log2(innerWidth / 256))));
  menuMap = L.map('menuBg', { zoomControl: false, attributionControl: false, dragging: false, scrollWheelZoom: false, doubleClickZoom: false,
    boxZoom: false, keyboard: false, touchZoom: false, tap: false, worldCopyJump: true }).setView([38, 22], z);
  esriL('World_Imagery', 18).addTo(menuMap);
} catch (e) { console.error(e); }
applyTheme(); applyLang();
</script>
