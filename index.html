<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>War Map Sandbox</title>

<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
}

#map {
    position: fixed;
    inset: 0;
}


/* =========================================================
   START SCREEN
========================================================= */

#startScreen {
    position: fixed;
    inset: 0;

    z-index: 10000;

    background: #111;
    color: white;

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;
}

#startScreen h1 {
    margin: 0 0 8px;
    font-size: 42px;
}

#startScreen p {
    color: #aaa;
    margin: 0 0 35px;
}

.startButtons {
    display: flex;
    gap: 20px;
}

.startButton {
    width: 270px;
    height: 160px;

    border-radius: 12px;
    border: 1px solid #444;

    background: #1d1d1d;
    color: white;

    cursor: pointer;

    display: flex;
    flex-direction: column;

    justify-content: center;
    align-items: center;

    transition: .15s;
}

.startButton:hover {
    background: #292929;
    border-color: #777;
    transform: translateY(-2px);
}

.startButton .icon {
    font-size: 42px;
    margin-bottom: 13px;
}

.startButton strong {
    font-size: 18px;
}

.startButton small {
    color: #999;
    margin-top: 5px;
}


/* =========================================================
   TOP TOOLBAR
========================================================= */

#topBar {
    position: fixed;

    z-index: 2000;

    top: 12px;
    left: 50%;

    transform: translateX(-50%);

    display: none;

    background: rgba(20,20,20,.95);

    border: 1px solid #444;
    border-radius: 10px;

    padding: 7px;

    gap: 5px;

    box-shadow: 0 5px 20px rgba(0,0,0,.4);
}

.toolButton {
    border: 0;
    border-radius: 6px;

    padding: 9px 12px;

    background: #2b2b2b;
    color: white;

    cursor: pointer;

    font-size: 13px;
}

.toolButton:hover {
    background: #3a3a3a;
}

.toolButton.active {
    background: #555;
}


/* =========================================================
   DRAW BAR
========================================================= */

#drawBar {
    position: fixed;

    z-index: 3000;

    left: 50%;
    bottom: 20px;

    transform: translateX(-50%);

    display: none;

    align-items: center;

    background: rgba(20,20,20,.97);

    border: 1px solid #555;

    border-radius: 10px;

    padding: 7px;

    gap: 5px;

    box-shadow: 0 5px 20px rgba(0,0,0,.4);
}

.finishButton {
    background: #16833c;
}

.finishButton:hover {
    background: #1c9c49;
}

.cancelButton {
    background: #8b2525;
}

.cancelButton:hover {
    background: #a82d2d;
}

#pointCounter {
    color: #aaa;
    padding: 0 9px;
    font-size: 13px;
}


/* =========================================================
   PANELS
========================================================= */

.panel {
    position: fixed;

    z-index: 2000;

    background: rgba(20,20,20,.96);

    color: white;

    border: 1px solid #444;
    border-radius: 10px;

    box-shadow: 0 5px 20px rgba(0,0,0,.4);
}

#layersPanel {
    left: 12px;
    top: 12px;

    width: 220px;

    display: none;

    padding: 14px;
}

#settingsPanel {
    right: 12px;
    top: 12px;

    width: 260px;

    display: none;

    padding: 15px;
}

.panel h3 {
    margin: 0 0 14px;
    font-size: 15px;
}

.layerRow {
    display: flex;
    align-items: center;

    gap: 8px;

    padding: 8px 0;

    border-bottom: 1px solid #333;
}

.setting {
    margin-bottom: 14px;
}

.setting label {
    display: block;

    font-size: 13px;

    color: #aaa;

    margin-bottom: 5px;
}

.setting input {
    width: 100%;
}


/* =========================================================
   UPLOAD PANEL
========================================================= */

#uploadPanel {
    position: fixed;
    inset: 0;

    z-index: 11000;

    display: none;

    background: rgba(0,0,0,.78);

    align-items: center;
    justify-content: center;
}

.uploadBox {
    width: 450px;

    background: #1c1c1c;

    color: white;

    border: 1px solid #444;

    border-radius: 12px;

    padding: 25px;
}

.uploadBox h2 {
    margin-top: 0;
}

.uploadBox p {
    color: #aaa;
    line-height: 1.5;
}

.uploadBox input {
    width: 100%;
    margin: 15px 0;
}

.uploadBox label {
    display: block;

    color: #aaa;

    font-size: 13px;

    margin-top: 10px;
}

.uploadBox select {
    width: 100%;

    padding: 9px;

    background: #292929;
    color: white;

    border: 1px solid #444;

    border-radius: 5px;
}

.uploadActions {
    display: flex;

    gap: 7px;

    margin-top: 18px;
}


/* =========================================================
   VERTEX HANDLES
========================================================= */

.vertex-handle {
    background: transparent !important;
    border: 0 !important;
}

.vertex-dot {
    width: 13px;
    height: 13px;

    background: white;

    border: 2px solid #222;

    border-radius: 50%;

    box-shadow: 0 1px 5px rgba(0,0,0,.8);
}

.midpoint-dot {
    width: 10px;
    height: 10px;

    background: #aaa;

    border: 2px solid #222;

    border-radius: 50%;

    box-shadow: 0 1px 4px rgba(0,0,0,.8);
}


/* =========================================================
   TEXT
========================================================= */

.map-text {
    color: white;

    font-size: 16px;
    font-weight: bold;

    white-space: nowrap;

    text-shadow:
        1px 1px 2px black,
        -1px -1px 2px black,
        1px -1px 2px black,
        -1px 1px 2px black;
}


/* =========================================================
   LEAFLET
========================================================= */

.leaflet-control-attribution {
    font-size: 10px;
}

</style>
</head>


<body>


<!-- =======================================================
     START SCREEN
======================================================= -->

<div id="startScreen">

    <h1>War Map Sandbox</h1>

    <p>Choose the map you want to work with</p>

    <div class="startButtons">

        <button
            class="startButton"
            onclick="startRealMap()"
        >
            <div class="icon">🌍</div>
            <strong>OpenStreetMap</strong>
            <small>Real-world map</small>
        </button>


        <button
            class="startButton"
            onclick="openUpload()"
        >
            <div class="icon">🖼️</div>
            <strong>Upload Map</strong>
            <small>Use your own map</small>
        </button>

    </div>

</div>


<!-- =======================================================
     UPLOAD
======================================================= -->

<div id="uploadPanel">

    <div class="uploadBox">

        <h2>Upload Map</h2>

        <p>
            Upload a PNG, JPG or WebP map. The image will
            remain at its correct proportions.
        </p>

        <input
            id="imageInput"
            type="file"
            accept="image/png,image/jpeg,image/webp"
        >

        <label>Image processing</label>

        <select id="qualitySelect">

            <option value="1">
                Original
            </option>

            <option value="2">
                Enhanced ×2
            </option>

            <option value="3">
                High resolution ×3
            </option>

            <option value="4">
                High resolution ×4
            </option>

        </select>


        <div class="uploadActions">

            <button
                class="toolButton"
                onclick="loadImageMap()"
            >
                Open Map
            </button>

            <button
                class="toolButton"
                onclick="closeUpload()"
            >
                Cancel
            </button>

        </div>

    </div>

</div>


<!-- =======================================================
     MAP
======================================================= -->

<div id="map"></div>


<!-- =======================================================
     TOP BAR
======================================================= -->

<div id="topBar">

    <button
        class="toolButton"
        onclick="setTool('select')"
    >
        Select
    </button>

    <button
        class="toolButton"
        onclick="setTool('polygon')"
    >
        🔺 Polygon
    </button>

    <button
        class="toolButton"
        onclick="setTool('curve')"
    >
        〰 Curved Line
    </button>

    <button
        class="toolButton"
        onclick="setTool('line')"
    >
        ━ Line
    </button>

    <button
        class="toolButton"
        onclick="setTool('marker')"
    >
        📍 Marker
    </button>

    <button
        class="toolButton"
        onclick="setTool('text')"
    >
        T Text
    </button>

    <button
        class="toolButton"
        onclick="setTool('delete')"
    >
        🗑 Delete
    </button>

    <button
        class="toolButton"
        onclick="undo()"
    >
        ↶
    </button>

    <button
        class="toolButton"
        onclick="redo()"
    >
        ↷
    </button>

    <button
        class="toolButton"
        onclick="toggleLayers()"
    >
        Layers
    </button>

    <button
        class="toolButton"
        onclick="toggleSettings()"
    >
        ⚙
    </button>

    <button
        class="toolButton"
        onclick="newMap()"
    >
        New
    </button>

</div>


<!-- =======================================================
     DRAW BAR
======================================================= -->

<div id="drawBar">

    <button
        class="toolButton finishButton"
        onclick="finishDrawing()"
    >
        ✓ Finish
    </button>

    <button
        class="toolButton cancelButton"
        onclick="cancelDrawing()"
    >
        ✕ Cancel
    </button>

    <span id="pointCounter">
        0 points
    </span>

</div>


<!-- =======================================================
     LAYERS
======================================================= -->

<div
    id="layersPanel"
    class="panel"
>

    <h3>Layers</h3>

    <div class="layerRow">
        <input type="checkbox" checked>
        <span>Background</span>
    </div>

    <div class="layerRow">
        <input type="checkbox" checked>
        <span>Territories</span>
    </div>

    <div class="layerRow">
        <input type="checkbox" checked>
        <span>Frontlines</span>
    </div>

    <div class="layerRow">
        <input type="checkbox" checked>
        <span>Markers</span>
    </div>

    <div class="layerRow">
        <input type="checkbox" checked>
        <span>Text</span>
    </div>

</div>


<!-- =======================================================
     SETTINGS
======================================================= -->

<div
    id="settingsPanel"
    class="panel"
>

    <h3>Object Settings</h3>


    <div class="setting">

        <label>Color</label>

        <input
            id="colorPicker"
            type="color"
            value="#ff0000"
        >

    </div>


    <div class="setting">

        <label>Opacity</label>

        <input
            id="opacitySlider"
            type="range"
            min="0"
            max="1"
            step=".05"
            value=".45"
        >

    </div>


    <div class="setting">

        <label>Line Width</label>

        <input
            id="widthSlider"
            type="range"
            min="1"
            max="15"
            value="3"
        >

    </div>


    <button
        class="toolButton"
        onclick="applySettings()"
    >
        Apply
    </button>

</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script>

/* =========================================================
   GLOBAL STATE
========================================================= */

let map = null;

let mapMode = null;

let osmLayer = null;
let satelliteLayer = null;
let imageLayer = null;

let objects = [];

let selectedObject = null;

let currentTool = "select";

let drawing = false;

let currentPoints = [];

let previewLayer = null;

let vertexHandles = [];

let midpointHandles = [];

let undoHistory = [];

let redoHistory = [];

let historyTimer = null;


/* =========================================================
   REAL WORLD MAP
========================================================= */

function startRealMap() {

    document.getElementById(
        "startScreen"
    ).style.display = "none";

    mapMode = "real";

    initializeRealMap();

}


function initializeRealMap() {

    if (map) {
        map.remove();
    }


    map = L.map(
        "map",
        {
            zoomControl: true
        }
    ).setView(
        [48.5, 37.5],
        6
    );


    osmLayer = L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            maxZoom: 19,
            attribution:
                "&copy; OpenStreetMap contributors"
        }
    );


    satelliteLayer = L.tileLayer(
        "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
        {
            maxZoom: 19,
            attribution: "Esri"
        }
    );


    osmLayer.addTo(map);


    L.control.layers(
        {
            "OpenStreetMap": osmLayer,
            "Satellite": satelliteLayer
        }
    ).addTo(map);


    finishMapSetup();

}


/* =========================================================
   UPLOAD
========================================================= */

function openUpload() {

    document.getElementById(
        "uploadPanel"
    ).style.display = "flex";

}


function closeUpload() {

    document.getElementById(
        "uploadPanel"
    ).style.display = "none";

}


/* =========================================================
   LOAD IMAGE
========================================================= */

function loadImageMap() {

    const input =
        document.getElementById(
            "imageInput"
        );


    if (!input.files.length) {

        alert(
            "Please select a map image."
        );

        return;
    }


    const file = input.files[0];

    const reader =
        new FileReader();


    reader.onload = function(event) {

        const img =
            new Image();


        img.onload = function() {

            createImageMap(img);

        };


        img.src =
            event.target.result;

    };


    reader.readAsDataURL(file);

}


/* =========================================================
   CREATE IMAGE MAP
========================================================= */

function createImageMap(img) {

    if (map) {
        map.remove();
    }


    mapMode = "image";


    const scale =
        Number(
            document.getElementById(
                "qualitySelect"
            ).value
        );


    /*
     * Keep exact aspect ratio.
     */

    const width =
        Math.round(
            img.naturalWidth * scale
        );

    const height =
        Math.round(
            img.naturalHeight * scale
        );


    const canvas =
        document.createElement(
            "canvas"
        );


    canvas.width = width;
    canvas.height = height;


    const ctx =
        canvas.getContext(
            "2d"
        );


    ctx.imageSmoothingEnabled = true;

    ctx.imageSmoothingQuality =
        "high";


    ctx.drawImage(
        img,
        0,
        0,
        width,
        height
    );


    const imageData =
        canvas.toDataURL(
            "image/jpeg",
            .96
        );


    /*
     * IMPORTANT:
     *
     * CRS.Simple means that the image itself
     * becomes the coordinate system.
     */

    map =
        L.map(
            "map",
            {
                crs: L.CRS.Simple,

                minZoom: -5,

                maxZoom: 8,

                zoomControl: true,

                attributionControl: false
            }
        );


    const bounds = [
        [0, 0],
        [height, width]
    ];


    imageLayer =
        L.imageOverlay(
            imageData,
            bounds,
            {
                interactive: false
            }
        ).addTo(map);


    map.fitBounds(
        bounds
    );


    finishMapSetup();


    closeUpload();

}


/* =========================================================
   MAP SETUP
========================================================= */

function finishMapSetup() {

    document.getElementById(
        "topBar"
    ).style.display = "flex";


    map.on(
        "click",
        onMapClick
    );


    /*
     * Start with a clean history.
     */

    undoHistory = [];

    redoHistory = [];

    saveHistory();

}


/* =========================================================
   MAP CLICK
========================================================= */

function onMapClick(e) {

    if (currentTool === "polygon") {

        addPoint(e.latlng);

        return;

    }


    if (currentTool === "curve") {

        addPoint(e.latlng);

        return;

    }


    if (currentTool === "line") {

        addPoint(e.latlng);

        return;

    }


    if (currentTool === "marker") {

        createMarker(
            e.latlng
        );

        return;

    }


    if (currentTool === "text") {

        createText(
            e.latlng
        );

        return;

    }


    if (currentTool === "select") {

        clearSelection();

    }

}


/* =========================================================
   SET TOOL
========================================================= */

function setTool(tool) {

    if (drawing) {

        cancelDrawing();

    }


    currentTool = tool;

    currentPoints = [];

    drawing = false;


    document
        .querySelectorAll(
            "#topBar .toolButton"
        )
        .forEach(
            button => {
                button.classList.remove(
                    "active"
                );
            }
        );


    /*
     * Highlight selected tool.
     */

    const buttons =
        document.querySelectorAll(
            "#topBar .toolButton"
        );


    if (
        tool === "polygon"
    ) {
        buttons[1].classList.add(
            "active"
        );
    }

    if (
        tool === "curve"
    ) {
        buttons[2].classList.add(
            "active"
        );
    }

    if (
        tool === "line"
    ) {
        buttons[3].classList.add(
            "active"
        );
    }


    if (
        tool === "delete"
    ) {
        buttons[6].classList.add(
            "active"
        );
    }


    if (
        tool === "polygon" ||
        tool === "curve" ||
        tool === "line"
    ) {

        drawing = true;

        showDrawBar();

    }

}


/* =========================================================
   ADD DRAWING POINT
========================================================= */

function addPoint(latlng) {

    if (!drawing) {
        return;
    }


    currentPoints.push({
        lat: latlng.lat,
        lng: latlng.lng
    });


    updatePreview();

    updatePointCounter();

}


/* =========================================================
   UPDATE PREVIEW
========================================================= */

function updatePreview() {

    if (previewLayer) {

        map.removeLayer(
            previewLayer
        );

        previewLayer = null;

    }


    if (!currentPoints.length) {
        return;
    }


    const color =
        document.getElementById(
            "colorPicker"
        ).value;


    const opacity =
        Number(
            document.getElementById(
                "opacitySlider"
            ).value
        );


    const width =
        Number(
            document.getElementById(
                "widthSlider"
            ).value
        );


    const points =
        currentPoints.map(
            p => [
                p.lat,
                p.lng
            ]
        );


    if (
        currentTool === "polygon"
    ) {

        previewLayer =
            L.polygon(
                points,
                {
                    color,
                    fillColor: color,
                    fillOpacity: opacity,
                    weight: width,
                    dashArray: "6 5"
                }
            ).addTo(map);

        return;

    }


    if (
        currentTool === "line"
    ) {

        previewLayer =
            L.polyline(
                points,
                {
                    color,
                    weight: width,
                    dashArray: "6 5"
                }
            ).addTo(map);

        return;

    }


    if (
        currentTool === "curve"
    ) {

        previewLayer =
            L.polyline(
                makeCurve(points),
                {
                    color,
                    weight: width,
                    dashArray: "6 5"
                }
            ).addTo(map);

    }

}


/* =========================================================
   CURVE GENERATION
========================================================= */

function makeCurve(points) {

    if (points.length < 2) {
        return points;
    }


    if (points.length === 2) {
        return points;
    }


    const result = [];


    /*
     * Catmull-Rom interpolation.
     *
     * The user's actual points remain the control
     * points. The extra points are only generated
     * for drawing the smooth curve.
     */

    for (
        let i = 0;
        i < points.length - 1;
        i++
    ) {

        const p0 =
            points[
                Math.max(
                    0,
                    i - 1
                )
            ];

        const p1 =
            points[i];

        const p2 =
            points[i + 1];

        const p3 =
            points[
                Math.min(
                    points.length - 1,
                    i + 2
                )
            ];


        for (
            let t = 0;
            t < 1;
            t += .04
        ) {

            const t2 =
                t * t;

            const t3 =
                t2 * t;


            const lat =
                .5 *
                (
                    2*p1[0] +
                    (-p0[0] + p2[0])*t +
                    (2*p0[0] -
                     5*p1[0] +
                     4*p2[0] -
                     p3[0])*t2 +
                    (-p0[0] +
                     3*p1[0] -
                     3*p2[0] +
                     p3[0])*t3
                );


            const lng =
                .5 *
                (
                    2*p1[1] +
                    (-p0[1] + p2[1])*t +
                    (2*p0[1] -
                     5*p1[1] +
                     4*p2[1] -
                     p3[1])*t2 +
                    (-p0[1] +
                     3*p1[1] -
                     3*p2[1] +
                     p3[1])*t3
                );


            result.push([
                lat,
                lng
            ]);

        }

    }


    result.push(
        points[
            points.length - 1
        ]
    );


    return result;

}


/* =========================================================
   FINISH DRAWING
========================================================= */

function finishDrawing() {

    if (!drawing) {
        return;
    }


    if (previewLayer) {

        map.removeLayer(
            previewLayer
        );

        previewLayer = null;

    }


    /*
     * Minimum points.
     */

    if (
        currentTool === "polygon" &&
        currentPoints.length < 3
    ) {

        alert(
            "A polygon needs at least 3 points."
        );

        updatePreview();

        return;

    }


    if (
        (
            currentTool === "curve" ||
            currentTool === "line"
        ) &&
        currentPoints.length < 2
    ) {

        alert(
            "You need at least 2 points."
        );

        updatePreview();

        return;

    }


    const color =
        document.getElementById(
            "colorPicker"
        ).value;


    const opacity =
        Number(
            document.getElementById(
                "opacitySlider"
            ).value
        );


    const width =
        Number(
            document.getElementById(
                "widthSlider"
            ).value
        );


    let object = null;


    /*
     * POLYGON
     */

    if (
        currentTool === "polygon"
    ) {

        object =
            L.polygon(
                currentPoints.map(
                    p => [
                        p.lat,
                        p.lng
                    ]
                ),
                {
                    color,
                    fillColor: color,
                    fillOpacity: opacity,
                    weight: width
                }
            ).addTo(map);

    }


    /*
     * STRAIGHT LINE
     */

    if (
        currentTool === "line"
    ) {

        object =
            L.polyline(
                currentPoints.map(
                    p => [
                        p.lat,
                        p.lng
                    ]
                ),
                {
                    color,
                    weight: width
                }
            ).addTo(map);

    }


    /*
     * CURVED LINE
     */

    if (
        currentTool === "curve"
    ) {

        object =
            L.polyline(
                makeCurve(
                    currentPoints.map(
                        p => [
                            p.lat,
                            p.lng
                        ]
                    )
                ),
                {
                    color,
                    weight: width
                }
            ).addTo(map);

    }


    /*
     * Store metadata.
     */

    object._sandboxType =
        currentTool;


    object._controlPoints =
        currentPoints.map(
            p => ({
                lat: p.lat,
                lng: p.lng
            })
        );


    object._style = {
        color,
        fillColor: color,
        fillOpacity: opacity,
        weight
    };


    setupObject(
        object
    );


    objects.push(
        object
    );


    saveHistory();


    currentPoints = [];

    drawing = false;

    currentTool = "select";

    hideDrawBar();

}


/* =========================================================
   CANCEL
========================================================= */

function cancelDrawing() {

    if (previewLayer) {

        map.removeLayer(
            previewLayer
        );

        previewLayer = null;

    }


    currentPoints = [];

    drawing = false;

    currentTool = "select";

    hideDrawBar();

}


/* =========================================================
   DRAW BAR
========================================================= */

function showDrawBar() {

    document.getElementById(
        "drawBar"
    ).style.display = "flex";

}


function hideDrawBar() {

    document.getElementById(
        "drawBar"
    ).style.display = "none";

}


function updatePointCounter() {

    document.getElementById(
        "pointCounter"
    ).textContent =
        currentPoints.length +
        (
            currentPoints.length === 1
                ? " point"
                : " points"
        );

}


/* =========================================================
   OBJECT SETUP
========================================================= */

function setupObject(object) {

    object.on(
        "click",
        function(e) {

            L.DomEvent.stopPropagation();


            if (
                currentTool === "delete"
            ) {

                deleteObject(
                    object
                );

                return;

            }


            selectObject(
                object
            );

        }
    );

}


/* =========================================================
   SELECT OBJECT
========================================================= */

function selectObject(object) {

    clearSelection();


    selectedObject = object;


    /*
     * Make selected object visually obvious.
     */

    if (
        object.setStyle
    ) {

        object.setStyle({
            dashArray: "8 5"
        });

    }


    createEditHandles(
        object
    );

}


/* =========================================================
   CLEAR SELECTION
========================================================= */

function clearSelection() {

    if (
        selectedObject &&
        selectedObject.setStyle
    ) {

        selectedObject.setStyle({
            dashArray: null
        });

    }


    removeEditHandles();


    selectedObject = null;

}


/* =========================================================
   CREATE EDIT HANDLES
========================================================= */

function createEditHandles(object) {

    removeEditHandles();


    /*
     * Only lines/polygons have vertices.
     */

    if (
        !object._controlPoints
    ) {

        return;

    }


    const points =
        object._controlPoints;


    /*
     * Actual vertex handles.
     */

    points.forEach(
        function(point, index) {

            const handle =
                L.marker(
                    [
                        point.lat,
                        point.lng
                    ],
                    {
                        draggable: true,

                        icon:
                            L.divIcon({
                                className:
                                    "vertex-handle",

                                html:
                                    '<div class="vertex-dot"></div>',

                                iconSize:
                                    [13,13],

                                iconAnchor:
                                    [6.5,6.5]
                            }),

                        zIndexOffset: 5000
                    }
                ).addTo(map);


            handle.on(
                "drag",
                function(e) {

                    const p =
                        e.target.getLatLng();


                    object._controlPoints[
                        index
                    ] = {
                        lat: p.lat,
                        lng: p.lng
                    };


                    updateObjectGeometry(
                        object
                    );

                }
            );


            handle.on(
                "dragend",
                function() {

                    saveHistory();

                }
            );


            vertexHandles.push(
                handle
            );

        }
    );


    /*
     * Add midpoint handles.
     *
     * Clicking one creates a new point.
     */

    if (points.length >= 2) {

        for (
            let i = 0;
            i < points.length - 1;
            i++
        ) {

            const a = points[i];

            const b =
                points[i + 1];


            const midpoint = {

                lat:
                    (a.lat + b.lat) / 2,

                lng:
                    (a.lng + b.lng) / 2

            };


            const handle =
                L.marker(
                    [
                        midpoint.lat,
                        midpoint.lng
                    ],
                    {
                        icon:
                            L.divIcon({
                                className:
                                    "vertex-handle",

                                html:
                                    '<div class="midpoint-dot"></div>',

                                iconSize:
                                    [10,10],

                                iconAnchor:
                                    [5,5]
                            }),

                        zIndexOffset: 4999
                    }
                ).addTo(map);


            handle.on(
                "click",
                function(e) {

                    L.DomEvent.stopPropagation();


                    /*
                     * Insert a real point.
                     */

                    object._controlPoints
                        .splice(
                            i + 1,
                            0,
                            {
                                lat:
                                    midpoint.lat,
                                lng:
                                    midpoint.lng
                            }
                        );


                    updateObjectGeometry(
                        object
                    );


                    /*
                     * Rebuild handles so the
                     * new point becomes draggable.
                     */

                    createEditHandles(
                        object
                    );


                    saveHistory();

                }
            );


            midpointHandles.push(
                handle
            );

        }

    }

}


/* =========================================================
   UPDATE OBJECT GEOMETRY
========================================================= */

function updateObjectGeometry(object) {

    if (
        !object._controlPoints
    ) {
        return;
    }


    const points =
        object._controlPoints.map(
            p => [
                p.lat,
                p.lng
            ]
        );


    /*
     * Curved line.
     */

    if (
        object._sandboxType === "curve"
    ) {

        object.setLatLngs(
            makeCurve(
                points
            )
        );

    }


    /*
     * Polygon / normal line.
     */

    else {

        object.setLatLngs(
            points
        );

    }

}


/* =========================================================
   REMOVE EDIT HANDLES
========================================================= */

function removeEditHandles() {

    vertexHandles.forEach(
        handle => {

            if (
                map &&
                map.hasLayer(handle)
            ) {

                map.removeLayer(
                    handle
                );

            }

        }
    );


    midpointHandles.forEach(
        handle => {

            if (
                map &&
                map.hasLayer(handle)
            ) {

                map.removeLayer(
                    handle
                );

            }

        }
    );


    vertexHandles = [];

    midpointHandles = [];

}


/* =========================================================
   DELETE
========================================================= */

function deleteObject(object) {

    if (
        !objects.includes(object)
    ) {

        return;

    }


    if (
        selectedObject === object
    ) {

        clearSelection();

    }


    map.removeLayer(
        object
    );


    objects =
        objects.filter(
            o => o !== object
        );


    saveHistory();

}


/* =========================================================
   MARKER
========================================================= */

function createMarker(latlng) {

    const color =
        document.getElementById(
            "colorPicker"
        ).value;


    const marker =
        L.circleMarker(
            latlng,
            {
                radius: 8,

                color: "white",

                weight: 2,

                fillColor: color,

                fillOpacity: 1
            }
        ).addTo(map);


    marker._sandboxType =
        "marker";


    marker._controlPoints = [
        {
            lat: latlng.lat,
            lng: latlng.lng
        }
    ];


    marker._style = {
        color: "white",
        fillColor: color,
        fillOpacity: 1,
        weight: 2
    };


    setupObject(
        marker
    );


    objects.push(
        marker
    );


    saveHistory();

}


/* =========================================================
   TEXT
========================================================= */

function createText(latlng) {

    const text =
        prompt(
            "Enter text:"
        );


    if (!text) {
        return;
    }


    const marker =
        L.marker(
            latlng,
            {
                icon:
                    L.divIcon({
                        className:
                            "map-text",

                        html:
                            escapeHTML(
                                text
                            ),

                        iconSize:
                            null
                    })
            }
        ).addTo(map);


    marker._sandboxType =
        "text";


    marker._text =
        text;


    marker._controlPoints = [
        {
            lat: latlng.lat,
            lng: latlng.lng
        }
    ];


    setupObject(
        marker
    );


    objects.push(
        marker
    );


    saveHistory();

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(text) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent = text;

    return div.innerHTML;

}


/* =========================================================
   SETTINGS
========================================================= */

function toggleSettings() {

    const panel =
        document.getElementById(
            "settingsPanel"
        );


    panel.style.display =
        panel.style.display === "block"
            ? "none"
            : "block";

}


function applySettings() {

    if (!selectedObject) {

        alert(
            "Click an object first."
        );

        return;

    }


    const color =
        document.getElementById(
            "colorPicker"
        ).value;


    const opacity =
        Number(
            document.getElementById(
                "opacitySlider"
            ).value
        );


    const width =
        Number(
            document.getElementById(
                "widthSlider"
            ).value
        );


    selectedObject._style = {

        color,

        fillColor: color,

        fillOpacity: opacity,

        weight: width

    };


    if (
        selectedObject.setStyle
    ) {

        selectedObject.setStyle(
            selectedObject._style
        );

    }


    saveHistory();

}


/* =========================================================
   LAYERS
========================================================= */

function toggleLayers() {

    const panel =
        document.getElementById(
            "layersPanel"
        );


    panel.style.display =
        panel.style.display === "block"
            ? "none"
            : "block";

}


/* =========================================================
   SERIALIZATION
========================================================= */

function serializeObjects() {

    return objects.map(
        function(object) {

            const data = {

                type:
                    object._sandboxType,

                points:
                    object._controlPoints
                        ? object._controlPoints.map(
                            p => ({
                                lat: p.lat,
                                lng: p.lng
                            })
                        )
                        : [],

                style:
                    object._style || {},

                text:
                    object._text || ""

            };


            return data;

        }
    );

}


/* =========================================================
   HISTORY
========================================================= */

function saveHistory() {

    clearTimeout(
        historyTimer
    );


    /*
     * Avoid recording dozens of states while
     * dragging a vertex.
     */

    historyTimer =
        setTimeout(
            function() {

                undoHistory.push(
                    JSON.stringify(
                        serializeObjects()
                    )
                );


                if (
                    undoHistory.length > 60
                ) {

                    undoHistory.shift();

                }


                redoHistory = [];

            },
            100
        );

}


/* =========================================================
   RESTORE
========================================================= */

function restoreState(serialized) {

    clearSelection();


    objects.forEach(
        object => {

            if (
                map.hasLayer(object)
            ) {

                map.removeLayer(
                    object
                );

            }

        }
    );


    objects = [];


    const data =
        JSON.parse(
            serialized
        );


    data.forEach(
        function(item) {

            let object = null;


            const points =
                item.points.map(
                    p => [
                        p.lat,
                        p.lng
                    ]
                );


            /*
             * POLYGON
             */

            if (
                item.type === "polygon"
            ) {

                object =
                    L.polygon(
                        points,
                        item.style
                    ).addTo(map);

            }


            /*
             * STRAIGHT LINE
             */

            else if (
                item.type === "line"
            ) {

                object =
                    L.polyline(
                        points,
                        item.style
                    ).addTo(map);

            }


            /*
             * CURVED LINE
             */

            else if (
                item.type === "curve"
            ) {

                object =
                    L.polyline(
                        makeCurve(
                            points
                        ),
                        item.style
                    ).addTo(map);

            }


            /*
             * MARKER
             */

            else if (
                item.type === "marker"
            ) {

                object =
                    L.circleMarker(
                        points[0],
                        item.style
                    ).addTo(map);

            }


            /*
             * TEXT
             */

            else if (
                item.type === "text"
            ) {

                object =
                    L.marker(
                        points[0],
                        {
                            icon:
                                L.divIcon({
                                    className:
                                        "map-text",

                                    html:
                                        escapeHTML(
                                            item.text
                                        ),

                                    iconSize:
                                        null
                                })
                        }
                    ).addTo(map);

            }


            if (object) {

                object._sandboxType =
                    item.type;


                object._controlPoints =
                    item.points.map(
                        p => ({
                            lat: p.lat,
                            lng: p.lng
                        })
                    );


                object._style =
                    item.style;


                object._text =
                    item.text || "";


                setupObject(
                    object
                );


                objects.push(
                    object
                );

            }

        }
    );

}


/* =========================================================
   UNDO
========================================================= */

function undo() {

    if (
        undoHistory.length <= 1
    ) {

        return;

    }


    const current =
        undoHistory.pop();


    redoHistory.push(
        current
    );


    const previous =
        undoHistory[
            undoHistory.length - 1
        ];


    restoreState(
        previous
    );

}


/* =========================================================
   REDO
========================================================= */

function redo() {

    if (
        !redoHistory.length
    ) {

        return;

    }


    const state =
        redoHistory.pop();


    undoHistory.push(
        state
    );


    restoreState(
        state
    );

}


/* =========================================================
   NEW MAP
========================================================= */

function newMap() {

    if (
        !confirm(
            "Start a new map?"
        )
    ) {

        return;

    }


    if (map) {
        map.remove();
    }


    map = null;

    objects = [];

    selectedObject = null;

    currentPoints = [];

    undoHistory = [];

    redoHistory = [];

    vertexHandles = [];

    midpointHandles = [];

    imageLayer = null;


    document.getElementById(
        "topBar"
    ).style.display = "none";


    document.getElementById(
        "layersPanel"
    ).style.display = "none";


    document.getElementById(
        "settingsPanel"
    ).style.display = "none";


    hideDrawBar();


    document.getElementById(
        "startScreen"
    ).style.display = "flex";

}


/* =========================================================
   KEYBOARD SHORTCUTS
========================================================= */

document.addEventListener(
    "keydown",
    function(e) {

        /*
         * Escape
         */

        if (
            e.key === "Escape"
        ) {

            if (drawing) {

                cancelDrawing();

            } else {

                clearSelection();

            }

        }


        /*
         * Delete
         */

        if (
            e.key === "Delete"
        ) {

            if (
                selectedObject
            ) {

                deleteObject(
                    selectedObject
                );

            }

        }


        /*
         * CTRL + Z
         */

        if (
            (e.ctrlKey || e.metaKey) &&
            e.key.toLowerCase() === "z"
        ) {

            e.preventDefault();

            undo();

        }


        /*
         * CTRL + Y
         */

        if (
            (e.ctrlKey || e.metaKey) &&
            e.key.toLowerCase() === "y"
        ) {

            e.preventDefault();

            redo();

        }

    }
);

</script>
