<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>War Map Sandbox</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Arial, sans-serif;
}

#map {
  width: 100%;
  height: 100%;
  background: #ddd;
}

/* =========================
   START SCREEN
========================= */

#startScreen {
  position: fixed;
  inset: 0;
  z-index: 10000;
  background: #111;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
}

.startBox {
  width: min(700px, calc(100% - 40px));
  text-align: center;
}

.startBox h1 {
  margin: 0 0 10px;
  font-size: 34px;
}

.startBox p {
  color: #aaa;
  margin-bottom: 30px;
}

.startOptions {
  display: flex;
  gap: 18px;
  justify-content: center;
  flex-wrap: wrap;
}

.startButton {
  width: 280px;
  min-height: 150px;
  border: 1px solid #444;
  border-radius: 12px;
  background: #1d1d1d;
  color: white;
  cursor: pointer;
  padding: 25px;
  transition: .15s;
}

.startButton:hover {
  background: #292929;
  transform: translateY(-2px);
}

.startButton .icon {
  font-size: 38px;
  margin-bottom: 12px;
}

.startButton strong {
  display: block;
  font-size: 18px;
  margin-bottom: 7px;
}

.startButton span {
  color: #aaa;
  font-size: 13px;
}

/* =========================
   TOOLBAR
========================= */

#toolbar {
  position: fixed;
  z-index: 5000;
  top: 15px;
  left: 15px;
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  max-width: calc(100% - 30px);
}

.toolButton {
  border: 0;
  border-radius: 6px;
  background: rgba(255,255,255,.96);
  padding: 9px 12px;
  cursor: pointer;
  box-shadow: 0 2px 7px rgba(0,0,0,.25);
  font-size: 13px;
}

.toolButton:hover {
  background: white;
}

.toolButton.active {
  background: #1976d2;
  color: white;
}

/* =========================
   DRAWING BAR
========================= */

#drawingBar {
  position: fixed;
  z-index: 5001;
  top: 65px;
  left: 50%;
  transform: translateX(-50%);
  display: none;
  align-items: center;
  gap: 8px;
  background: rgba(30,30,30,.94);
  color: white;
  border-radius: 8px;
  padding: 8px 12px;
  box-shadow: 0 3px 12px rgba(0,0,0,.35);
}

#drawingBar button {
  border: 0;
  border-radius: 5px;
  padding: 7px 12px;
  cursor: pointer;
}

#finishButton {
  background: #2e7d32;
  color: white;
}

#cancelButton {
  background: #c62828;
  color: white;
}

#pointCounter {
  font-size: 12px;
  color: #ddd;
}

/* =========================
   RIGHT PANEL
========================= */

#sidePanel {
  position: fixed;
  z-index: 5000;
  top: 15px;
  right: 15px;
  width: 270px;
  max-height: calc(100vh - 30px);
  overflow-y: auto;
  display: none;
  background: rgba(255,255,255,.97);
  border-radius: 9px;
  box-shadow: 0 3px 15px rgba(0,0,0,.3);
  padding: 14px;
}

#sidePanel h3 {
  margin: 0 0 12px;
}

.panelSection {
  border-top: 1px solid #ddd;
  padding-top: 12px;
  margin-top: 12px;
}

.panelButton {
  width: 100%;
  padding: 8px;
  margin-top: 6px;
  border: 1px solid #ccc;
  background: white;
  border-radius: 5px;
  cursor: pointer;
}

.panelButton:hover {
  background: #f2f2f2;
}

/* =========================
   HELP
========================= */

#status {
  position: fixed;
  z-index: 5000;
  left: 15px;
  bottom: 15px;
  background: rgba(0,0,0,.75);
  color: white;
  padding: 7px 10px;
  border-radius: 5px;
  font-size: 12px;
  pointer-events: none;
}

/* =========================
   IMAGE UPLOAD
========================= */

#imageInput {
  display: none;
}

/* Vertex handles */

.vertexHandle {
  background: white;
  border: 2px solid #1976d2;
  width: 13px !important;
  height: 13px !important;
  border-radius: 50%;
  box-shadow: 0 1px 4px rgba(0,0,0,.5);
}

.midpointHandle {
  background: rgba(255,255,255,.9);
  border: 2px solid #777;
  width: 9px !important;
  height: 9px !important;
  border-radius: 50%;
  box-shadow: 0 1px 3px rgba(0,0,0,.4);
}

/* Make sure Leaflet edit markers stay above everything */
.leaflet-marker-icon.vertexHandle,
.leaflet-marker-icon.midpointHandle {
  z-index: 10000 !important;
}

/* Mobile */
@media(max-width:700px) {
  #toolbar {
    max-width: calc(100% - 30px);
  }

  .toolButton {
    padding: 8px 9px;
    font-size: 12px;
  }

  #sidePanel {
    width: 230px;
  }
}
</style>
</head>

<body>

<!-- =========================
     START SCREEN
========================= -->

<div id="startScreen">
  <div class="startBox">

    <h1>War Map Sandbox</h1>

    <p>
      Create and edit your own map with polygons, lines and curved front lines.
    </p>

    <div class="startOptions">

      <button class="startButton" id="realMapButton">
        <div class="icon">🌍</div>
        <strong>OpenStreetMap</strong>
        <span>
          Use a real-world interactive map with satellite imagery and OSM labels.
        </span>
      </button>

      <button class="startButton" id="uploadMapButton">
        <div class="icon">🖼️</div>
        <strong>Upload a map image</strong>
        <span>
          Upload your own map and draw directly over it.
        </span>
      </button>

    </div>
  </div>
</div>

<input
  type="file"
  id="imageInput"
  accept="image/*"
/>

<!-- =========================
     TOOLBAR
========================= -->

<div id="toolbar">

  <button class="toolButton active" data-tool="select">
    Select
  </button>

  <button class="toolButton" data-tool="polygon">
    Polygon
  </button>

  <button class="toolButton" data-tool="line">
    Line
  </button>

  <button class="toolButton" data-tool="curve">
    Curved line
  </button>

  <button class="toolButton" data-tool="marker">
    Marker
  </button>

  <button class="toolButton" data-tool="delete">
    Delete
  </button>

  <button class="toolButton" id="undoButton">
    ↶ Undo
  </button>

  <button class="toolButton" id="redoButton">
    ↷ Redo
  </button>

  <button class="toolButton" id="layersButton">
    Layers
  </button>

  <button class="toolButton" id="newMapButton">
    New
  </button>

</div>

<!-- =========================
     DRAWING BAR
========================= -->

<div id="drawingBar">

  <button id="finishButton">
    Finish
  </button>

  <button id="cancelButton">
    Cancel
  </button>

  <span id="pointCounter">
    0 points
  </span>

</div>

<!-- =========================
     SIDE PANEL
========================= -->

<div id="sidePanel">

  <h3>Layers</h3>

  <div class="panelSection">

    <label>
      <input type="checkbox" id="showObjects" checked>
      Show drawings
    </label>

  </div>

  <div class="panelSection">

    <b>Drawing instructions</b>

    <p style="font-size:12px;color:#666;line-height:1.5">
      Choose Polygon, Line or Curved line and click points on the map.
      When finished, press <b>Finish</b>.
      Finished objects remain editable.
    </p>

  </div>

</div>

<div id="status">
  Ready.
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* =========================================================
   GLOBAL STATE
========================================================= */

let map = null;

let currentTool = "select";

let drawing = false;
let currentPoints = [];

let previewLayer = null;

let objects = [];
let selectedObject = null;

let editHandles = [];

let history = [];
let redoHistory = [];

let historyTimer = null;

let uploadedImageLayer = null;


/* =========================================================
   BASEMAPS
========================================================= */

let satellite;
let osm;
let hybrid;


/* =========================================================
   START SCREEN
========================================================= */

document.getElementById("realMapButton").onclick = function() {
  document.getElementById("startScreen").style.display = "none";
  initializeRealMap();
};

document.getElementById("uploadMapButton").onclick = function() {
  document.getElementById("imageInput").click();
};

document.getElementById("imageInput").addEventListener("change", function(e) {

  const file = e.target.files[0];

  if (!file) return;

  const reader = new FileReader();

  reader.onload = function(event) {

    const img = new Image();

    img.onload = function() {
      initializeImageMap(img);
    };

    img.src = event.target.result;
  };

  reader.readAsDataURL(file);
});


/* =========================================================
   REAL MAP
========================================================= */

function initializeRealMap() {

  map = L.map("map", {
    center: [48.3, 37.5],
    zoom: 7,
    zoomControl: true,
    preferCanvas: false
  });

  osm = L.tileLayer(
    "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap contributors"
    }
  );

  satellite = L.tileLayer(
    "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
    {
      maxZoom: 19,
      attribution:
        "Tiles &copy; Esri"
    }
  );

  const esriLabels = L.tileLayer(
    "https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}",
    {
      maxZoom: 19,
      attribution: "Labels &copy; Esri"
    }
  );

  hybrid = L.layerGroup([
    satellite,
    esriLabels
  ]);

  hybrid.addTo(map);

  L.control.layers(
    {
      "Satellite + Esri Labels": hybrid,
      "Satellite (Esri)": satellite,
      "OpenStreetMap": osm
    },
    null,
    {
      position: "topright"
    }
  ).addTo(map);

  finishMapInitialization();
}


/* =========================================================
   IMAGE MAP
========================================================= */

function initializeImageMap(img) {

  document.getElementById("startScreen").style.display = "none";

  /*
     Use CRS.Simple so that the uploaded image behaves like
     a large flat map.

     The important part is that width and height are taken
     directly from the image, preserving its aspect ratio.
  */

  map = L.map("map", {
    crs: L.CRS.Simple,
    minZoom: -5,
    maxZoom: 8,
    zoomControl: true
  });

  const originalWidth = img.naturalWidth;
  const originalHeight = img.naturalHeight;

  /*
     Browser canvas enlargement.

     This does NOT change the aspect ratio.
  */

  const scale = Math.max(
    1,
    Math.min(2, 4096 / Math.max(originalWidth, originalHeight))
  );

  const canvas = document.createElement("canvas");

  canvas.width = Math.round(originalWidth * scale);
  canvas.height = Math.round(originalHeight * scale);

  const ctx = canvas.getContext("2d");

  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = "high";

  ctx.drawImage(
    img,
    0,
    0,
    canvas.width,
    canvas.height
  );

  const imageWidth = canvas.width;
  const imageHeight = canvas.height;

  const imageUrl = canvas.toDataURL("image/png");

  const bounds = [
    [0, 0],
    [imageHeight, imageWidth]
  ];

  uploadedImageLayer = L.imageOverlay(
    imageUrl,
    bounds,
    {
      interactive: false
    }
  ).addTo(map);

  map.fitBounds(bounds);

  finishMapInitialization();
}


/* =========================================================
   COMMON MAP INITIALIZATION
========================================================= */

function finishMapInitialization() {

  document.getElementById("toolbar").style.display = "flex";
  document.getElementById("status").innerText =
    "Ready. Choose a drawing tool.";

  map.on("click", handleMapClick);

  /*
     Clicking empty map deselects the current object,
     unless we are currently drawing.
  */

  map.on("click", function() {

    if (!drawing && currentTool === "select") {
      clearSelection();
    }

  });

  updateToolbar();
}


/* =========================================================
   TOOL SELECTION
========================================================= */

document.querySelectorAll(".toolButton[data-tool]").forEach(button => {

  button.addEventListener("click", function() {

    const tool = this.dataset.tool;

    if (drawing) {
      cancelDrawing();
    }

    setTool(tool);

  });

});


function setTool(tool) {

  currentTool = tool;

  updateToolbar();

  if (tool === "polygon" ||
      tool === "line" ||
      tool === "curve") {

    startDrawing(tool);
    return;
  }

  if (tool === "delete") {

    document.getElementById("status").innerText =
      "Click an object to delete it.";

    return;
  }

  document.getElementById("status").innerText =
    "Select an object or choose a drawing tool.";

}


/* =========================================================
   TOOLBAR VISUAL STATE
========================================================= */

function updateToolbar() {

  document.querySelectorAll(".toolButton[data-tool]")
    .forEach(button => {

      button.classList.toggle(
        "active",
        button.dataset.tool === currentTool
      );

    });

}


/* =========================================================
   DRAWING
========================================================= */

function startDrawing(type) {

  drawing = true;

  currentPoints = [];

  removePreview();

  document.getElementById("drawingBar").style.display = "flex";

  updatePointCounter();

  document.getElementById("status").innerText =
    type === "polygon"
      ? "Click points to draw a polygon."
      : type === "curve"
        ? "Click control points for the curved line."
        : "Click points to draw a line.";

}


function handleMapClick(e) {

  if (!map) return;

  if (!drawing) {

    if (currentTool === "marker") {

      createMarker(e.latlng);
      return;
    }

    return;
  }

  /*
     While drawing, each click adds exactly one point.
  */

  currentPoints.push(e.latlng);

  updatePointCounter();

  updatePreview();

}


function updatePointCounter() {

  document.getElementById("pointCounter").innerText =
    currentPoints.length +
    (currentPoints.length === 1 ? " point" : " points");

}


/* =========================================================
   PREVIEW
========================================================= */

function updatePreview() {

  removePreview();

  if (currentPoints.length === 0) {
    return;
  }

  if (currentTool === "polygon") {

    previewLayer = L.polygon(
      currentPoints,
      {
        color: "#1976d2",
        weight: 3,
        dashArray: "8 6",
        fillColor: "#1976d2",
        fillOpacity: .12,
        interactive: false
      }
    ).addTo(map);

    return;
  }

  if (currentTool === "line") {

    previewLayer = L.polyline(
      currentPoints,
      {
        color: "#1976d2",
        weight: 3,
        dashArray: "8 6",
        interactive: false
      }
    ).addTo(map);

    return;
  }

  if (currentTool === "curve") {

    if (currentPoints.length === 1) {

      previewLayer = L.circleMarker(
        currentPoints[0],
        {
          radius: 4,
          color: "#1976d2",
          fillColor: "#1976d2",
          fillOpacity: 1,
          interactive: false
        }
      ).addTo(map);

      return;
    }

    previewLayer = L.polyline(
      makeCurve(currentPoints),
      {
        color: "#1976d2",
        weight: 3,
        dashArray: "8 6",
        interactive: false
      }
    ).addTo(map);
  }

}


/* =========================================================
   FINISH DRAWING
========================================================= */

document.getElementById("finishButton").onclick =
  finishDrawing;


function finishDrawing() {

  if (!drawing) return;

  if (currentPoints.length < 2) {

    document.getElementById("status").innerText =
      "Add at least two points first.";

    return;
  }

  const points = currentPoints.map(p =>
    L.latLng(p.lat, p.lng)
  );

  let object = null;

  const style = {
    color: "#ff0000",
    weight: 4,
    opacity: 1,
    fillColor: "#ff0000",
    fillOpacity: .25
  };


  /* -------------------------
     POLYGON
  ------------------------- */

  if (currentTool === "polygon") {

    object = L.polygon(
      points,
      style
    ).addTo(map);

    object._sandboxType = "polygon";
    object._controlPoints = points.slice();
    object._style = {
      color: style.color,
      weight: style.weight,
      opacity: style.opacity,
      fillColor: style.fillColor,
      fillOpacity: style.fillOpacity
    };

  }


  /* -------------------------
     STRAIGHT LINE
  ------------------------- */

  if (currentTool === "line") {

    object = L.polyline(
      points,
      {
        color: "#ff0000",
        weight: 4,
        opacity: 1
      }
    ).addTo(map);

    object._sandboxType = "line";
    object._controlPoints = points.slice();

    object._style = {
      color: "#ff0000",
      weight: 4,
      opacity: 1
    };

  }


  /* -------------------------
     CURVED LINE
  ------------------------- */

  if (currentTool === "curve") {

    object = L.polyline(
      makeCurve(points),
      {
        color: "#ff0000",
        weight: 4,
        opacity: 1
      }
    ).addTo(map);

    object._sandboxType = "curve";
    object._controlPoints = points.slice();

    object._style = {
      color: "#ff0000",
      weight: 4,
      opacity: 1
    };

  }


  if (!object) return;

  objects.push(object);

  /*
     THIS IS THE IMPORTANT PART:
     create a wide invisible hit target.
  */

  createHitLayer(object);

  setupObject(object);

  saveHistory();

  removePreview();

  drawing = false;
  currentPoints = [];

  document.getElementById("drawingBar").style.display = "none";

  currentTool = "select";

  updateToolbar();

  selectObject(object);

  document.getElementById("status").innerText =
    "Object finished. Click it again anytime to edit it.";

}


/* =========================================================
   CANCEL DRAWING
========================================================= */

document.getElementById("cancelButton").onclick =
  cancelDrawing;


function cancelDrawing() {

  /*
     CRITICAL:
     Cancel ONLY removes the unfinished preview.

     It NEVER touches objects[].
  */

  removePreview();

  currentPoints = [];

  drawing = false;

  document.getElementById("drawingBar").style.display =
    "none";

  currentTool = "select";

  updateToolbar();

  document.getElementById("status").innerText =
    "Drawing cancelled. Existing objects were kept.";

}


/* =========================================================
   REMOVE PREVIEW
========================================================= */

function removePreview() {

  if (previewLayer) {

    map.removeLayer(previewLayer);

    previewLayer = null;
  }

}


/* =========================================================
   CURVE GENERATION
   Catmull-Rom interpolation
========================================================= */

function makeCurve(points) {

  if (points.length < 2) {
    return points.slice();
  }

  if (points.length === 2) {

    const result = [];

    for (let i = 0; i <= 20; i++) {

      const t = i / 20;

      result.push(
        L.latLng(
          points[0].lat +
            (points[1].lat - points[0].lat) * t,

          points[0].lng +
            (points[1].lng - points[0].lng) * t
        )
      );

    }

    return result;
  }


  const result = [];

  for (let i = 0; i < points.length - 1; i++) {

    const p0 = points[i - 1] || points[i];
    const p1 = points[i];
    const p2 = points[i + 1];
    const p3 =
      points[i + 2] ||
      points[i + 1];

    for (let j = 0; j < 12; j++) {

      const t = j / 12;
      const t2 = t * t;
      const t3 = t2 * t;

      const lat =
        0.5 *
        (
          (2 * p1.lat) +
          (-p0.lat + p2.lat) * t +
          (2*p0.lat - 5*p1.lat + 4*p2.lat - p3.lat) * t2 +
          (-p0.lat + 3*p1.lat - 3*p2.lat + p3.lat) * t3
        );

      const lng =
        0.5 *
        (
          (2 * p1.lng) +
          (-p0.lng + p2.lng) * t +
          (2*p0.lng - 5*p1.lng + 4*p2.lng - p3.lng) * t2 +
          (-p0.lng + 3*p1.lng - 3*p2.lng + p3.lng) * t3
        );

      result.push(
        L.latLng(lat, lng)
      );
    }
  }

  result.push(
    points[points.length - 1]
  );

  return result;
}


/* =========================================================
   OBJECT SETUP
========================================================= */

function setupObject(object) {

  object.on("click", function(e) {

    L.DomEvent.stopPropagation(e);

    if (currentTool === "delete") {

      deleteObject(object);

      return;
    }

    selectObject(object);

  });

}


/* =========================================================
   GOOGLE MY MAPS STYLE HIT TARGET
========================================================= */

function createHitLayer(object) {

  /*
     Remove an old hit layer first.
  */

  if (object._hitLayer) {

    map.removeLayer(object._hitLayer);

    object._hitLayer = null;
  }


  const type = object._sandboxType;


  /* -------------------------
     LINE / CURVE
  ------------------------- */

  if (type === "line" ||
      type === "curve") {

    const geometry =
      type === "curve"
        ? makeCurve(object._controlPoints)
        : object._controlPoints;

    /*
       Invisible wide line.

       18px minimum makes clicking much easier,
       similar to Google My Maps.
    */

    const hitWeight =
      Math.max(
        18,
        (object._style?.weight || 4) + 14
      );

    const hit = L.polyline(
      geometry,
      {
        color: "#000000",
        opacity: 0.001,
        weight: hitWeight,
        interactive: true,
        bubblingMouseEvents: false
      }
    ).addTo(map);

    hit._owner = object;

    hit.on("click", function(e) {

      L.DomEvent.stopPropagation(e);

      const owner = hit._owner;

      if (!owner) return;

      if (currentTool === "delete") {

        deleteObject(owner);

      } else {

        selectObject(owner);

      }

    });

    object._hitLayer = hit;

    return;
  }


  /* -------------------------
     POLYGON
  ------------------------- */

  if (type === "polygon") {

    const hit = L.polygon(
      object._controlPoints,
      {
        color: "#000000",
        opacity: 0.001,
        weight: Math.max(
          10,
          (object._style?.weight || 3) + 8
        ),
        fillColor: "#000000",
        fillOpacity: 0.001,
        interactive: true,
        bubblingMouseEvents: false
      }
    ).addTo(map);

    hit._owner = object;

    hit.on("click", function(e) {

      L.DomEvent.stopPropagation(e);

      const owner = hit._owner;

      if (!owner) return;

      if (currentTool === "delete") {

        deleteObject(owner);

      } else {

        selectObject(owner);

      }

    });

    object._hitLayer = hit;
  }

}


/* =========================================================
   SELECTION
========================================================= */

function selectObject(object) {

  if (!object) return;

  clearSelection();

  selectedObject = object;

  /*
     Put the visible object above its hit target.
  */

  if (object.bringToFront) {
    object.bringToFront();
  }

  if (object.setStyle) {

    object.setStyle({
      dashArray: "8 5"
    });

  }

  createEditHandles(object);

  document.getElementById("status").innerText =
    "Object selected. Drag the points to edit it.";

}


/* =========================================================
   CLEAR SELECTION
========================================================= */

function clearSelection() {

  removeEditHandles();

  if (selectedObject) {

    if (selectedObject.setStyle) {

      selectedObject.setStyle(
        Object.assign(
          {},
          selectedObject._style || {},
          {
            dashArray: null
          }
        )
      );

    }

  }

  selectedObject = null;

}


/* =========================================================
   EDIT HANDLES
========================================================= */

function createEditHandles(object) {

  removeEditHandles();

  if (!object._controlPoints) return;

  const points = object._controlPoints;


  /*
     REAL VERTEX / CONTROL POINTS
  */

  points.forEach((point, index) => {

    const marker = L.marker(
      point,
      {
        draggable: true,
        icon: L.divIcon({
          className: "vertexHandle",
          iconSize: [13,13],
          iconAnchor: [6,6]
        }),
        zIndexOffset: 10000,
        keyboard: false
      }
    ).addTo(map);

    marker._vertexIndex = index;
    marker._owner = object;

    marker.on("drag", function(e) {

      const latlng = e.target.getLatLng();

      object._controlPoints[index] =
        L.latLng(
          latlng.lat,
          latlng.lng
        );

      updateObjectGeometry(object);

    });

    marker.on("dragend", function() {

      saveHistory();

    });

    editHandles.push(marker);

  });


  /*
     MIDPOINT HANDLES

     These allow new control points to be inserted,
     similar to Google My Maps.
  */

  if (object._controlPoints.length >= 2) {

    for (
      let i = 0;
      i < object._controlPoints.length - 1;
      i++
    ) {

      const a = object._controlPoints[i];
      const b = object._controlPoints[i + 1];

      const midpoint =
        L.latLng(
          (a.lat + b.lat) / 2,
          (a.lng + b.lng) / 2
        );

      const marker = L.marker(
        midpoint,
        {
          draggable: false,
          icon: L.divIcon({
            className: "midpointHandle",
            iconSize: [9,9],
            iconAnchor: [4,4]
          }),
          zIndexOffset: 9000,
          keyboard: false
        }
      ).addTo(map);

      marker._insertIndex = i + 1;
      marker._owner = object;

      marker.on("click", function(e) {

        L.DomEvent.stopPropagation(e);

        const owner = marker._owner;

        if (!owner) return;

        const index = marker._insertIndex;

        /*
           Insert the midpoint as a real control point.
        */

        owner._controlPoints.splice(
          index,
          0,
          midpoint
        );

        updateObjectGeometry(owner);

        createEditHandles(owner);

        saveHistory();

      });

      editHandles.push(marker);

    }

  }

}


/* =========================================================
   REMOVE EDIT HANDLES
========================================================= */

function removeEditHandles() {

  editHandles.forEach(marker => {

    if (map &&
        map.hasLayer(marker)) {

      map.removeLayer(marker);

    }

  });

  editHandles = [];

}


/* =========================================================
   UPDATE GEOMETRY
========================================================= */

function updateObjectGeometry(object) {

  if (!object) return;

  const points =
    object._controlPoints || [];


  if (object._sandboxType === "curve") {

    const curve =
      makeCurve(points);

    object.setLatLngs(curve);

    if (object._hitLayer) {

      object._hitLayer.setLatLngs(curve);

    }

  } else {

    object.setLatLngs(points);

    if (object._hitLayer) {

      object._hitLayer.setLatLngs(points);

    }

  }

  /*
     Move vertex handles to their new locations.
  */

  editHandles.forEach(marker => {

    if (
      marker._owner === object &&
      marker._vertexIndex !== undefined
    ) {

      const p =
        object._controlPoints[
          marker._vertexIndex
        ];

      if (p) {
        marker.setLatLng(p);
      }

    }

  });

}


/* =========================================================
   MARKER
========================================================= */

function createMarker(latlng) {

  const marker = L.marker(
    latlng,
    {
      draggable: false
    }
  ).addTo(map);

  marker._sandboxType = "marker";
  marker._controlPoints = [
    L.latLng(latlng.lat, latlng.lng)
  ];

  marker.on("click", function(e) {

    L.DomEvent.stopPropagation(e);

    if (currentTool === "delete") {

      deleteObject(marker);

    } else {

      selectObject(marker);

    }

  });

  objects.push(marker);

  saveHistory();

}


/* =========================================================
   DELETE
========================================================= */

function deleteObject(object) {

  if (!object) return;

  removeEditHandles();

  if (object._hitLayer &&
      map.hasLayer(object._hitLayer)) {

    map.removeLayer(
      object._hitLayer
    );

  }

  if (map.hasLayer(object)) {

    map.removeLayer(object);

  }

  const index =
    objects.indexOf(object);

  if (index !== -1) {

    objects.splice(index, 1);

  }

  if (selectedObject === object) {

    selectedObject = null;

  }

  saveHistory();

  document.getElementById("status").innerText =
    "Object deleted.";

}


/* =========================================================
   DELETE KEY
========================================================= */

document.addEventListener("keydown", function(e) {

  if (
    e.key === "Delete" &&
    selectedObject &&
    !drawing
  ) {

    e.preventDefault();

    deleteObject(selectedObject);

  }


  if (e.key === "Escape") {

    if (drawing) {

      cancelDrawing();

    } else {

      clearSelection();

    }

  }


  if (
    (e.ctrlKey || e.metaKey) &&
    e.key.toLowerCase() === "z"
  ) {

    e.preventDefault();

    if (e.shiftKey) {
      redo();
    } else {
      undo();
    }

  }


  if (
    (e.ctrlKey || e.metaKey) &&
    e.key.toLowerCase() === "y"
  ) {

    e.preventDefault();

    redo();

  }

});


/* =========================================================
   SERIALIZATION
========================================================= */

function serializeObjects() {

  return objects.map(object => {

    const data = {
      type: object._sandboxType
    };


    if (object._sandboxType === "polygon") {

      data.points =
        object._controlPoints.map(p => [
          p.lat,
          p.lng
        ]);

      data.style =
        Object.assign({}, object._style);

    }


    if (
      object._sandboxType === "line" ||
      object._sandboxType === "curve"
    ) {

      data.points =
        object._controlPoints.map(p => [
          p.lat,
          p.lng
        ]);

      data.style =
        Object.assign({}, object._style);

    }


    if (object._sandboxType === "marker") {

      const p =
        object.getLatLng();

      data.points = [
        [p.lat, p.lng]
      ];

    }


    return data;

  });

}


/* =========================================================
   HISTORY
========================================================= */

function saveHistory() {

  clearTimeout(historyTimer);

  historyTimer = setTimeout(function() {

    const state =
      JSON.stringify(
        serializeObjects()
      );

    const last =
      history.length
        ? history[history.length - 1]
        : null;

    if (last === state) return;

    history.push(state);

    if (history.length > 100) {
      history.shift();
    }

    redoHistory = [];

  }, 100);

}


/* =========================================================
   UNDO
========================================================= */

document.getElementById("undoButton").onclick =
  undo;


function undo() {

  clearTimeout(historyTimer);

  if (history.length <= 1) {

    document.getElementById("status").innerText =
      "Nothing to undo.";

    return;
  }

  const current =
    history.pop();

  redoHistory.push(current);

  const previous =
    history[history.length - 1];

  restoreState(previous);

  document.getElementById("status").innerText =
    "Undo.";

}


/* =========================================================
   REDO
========================================================= */

document.getElementById("redoButton").onclick =
  redo;


function redo() {

  clearTimeout(historyTimer);

  if (!redoHistory.length) {

    document.getElementById("status").innerText =
      "Nothing to redo.";

    return;
  }

  const state =
    redoHistory.pop();

  history.push(state);

  restoreState(state);

  document.getElementById("status").innerText =
    "Redo.";

}


/* =========================================================
   RESTORE STATE
========================================================= */

function restoreState(state) {

  clearSelection();

  objects.forEach(object => {

    if (
      object._hitLayer &&
      map.hasLayer(object._hitLayer)
    ) {

      map.removeLayer(
        object._hitLayer
      );

    }

    if (map.hasLayer(object)) {

      map.removeLayer(object);

    }

  });

  objects = [];

  let data = [];

  try {

    data = JSON.parse(state);

  } catch(e) {

    return;

  }


  data.forEach(item => {

    let object = null;

    const points =
      (item.points || []).map(p =>
        L.latLng(p[0], p[1])
      );


    /* POLYGON */

    if (item.type === "polygon") {

      object = L.polygon(
        points,
        item.style || {
          color: "#ff0000",
          weight: 4,
          fillColor: "#ff0000",
          fillOpacity: .25
        }
      ).addTo(map);

    }


    /* LINE */

    if (item.type === "line") {

      object = L.polyline(
        points,
        item.style || {
          color: "#ff0000",
          weight: 4
        }
      ).addTo(map);

    }


    /* CURVE */

    if (item.type === "curve") {

      object = L.polyline(
        makeCurve(points),
        item.style || {
          color: "#ff0000",
          weight: 4
        }
      ).addTo(map);

    }


    /* MARKER */

    if (item.type === "marker") {

      if (!points.length) return;

      object = L.marker(
        points[0]
      ).addTo(map);

    }


    if (!object) return;


    object._sandboxType =
      item.type;

    object._controlPoints =
      points.slice();

    object._style =
      Object.assign(
        {},
        item.style || {}
      );


    objects.push(object);

    /*
       Recreate the invisible hit target
       when undo/redo restores the object.
    */

    if (
      item.type === "polygon" ||
      item.type === "line" ||
      item.type === "curve"
    ) {

      createHitLayer(object);

    }

    setupObject(object);


    if (item.type === "marker") {

      object.on("click", function(e) {

        L.DomEvent.stopPropagation(e);

        if (currentTool === "delete") {

          deleteObject(object);

        } else {

          selectObject(object);

        }

      });

    }

  });

}


/* =========================================================
   LAYERS PANEL
========================================================= */

document.getElementById("layersButton").onclick =
  function() {

    const panel =
      document.getElementById("sidePanel");

    panel.style.display =
      panel.style.display === "block"
        ? "none"
        : "block";

  };


document.getElementById("showObjects").onchange =
  function() {

    const show = this.checked;

    objects.forEach(object => {

      if (show) {

        if (!map.hasLayer(object)) {

          object.addTo(map);

        }

        if (
          object._hitLayer &&
          !map.hasLayer(object._hitLayer)
        ) {

          object._hitLayer.addTo(map);

        }

      } else {

        if (map.hasLayer(object)) {

          map.removeLayer(object);

        }

        if (
          object._hitLayer &&
          map.hasLayer(object._hitLayer)
        ) {

          map.removeLayer(
            object._hitLayer
          );

        }

      }

    });

  };


/* =========================================================
   NEW MAP
========================================================= */

document.getElementById("newMapButton").onclick =
  function() {

    if (
      objects.length &&
      !confirm(
        "Start a new map? Your current drawings will be cleared."
      )
    ) {

      return;

    }

    location.reload();

  };


/* =========================================================
   INITIAL HISTORY
========================================================= */

function initializeHistory() {

  history = [
    JSON.stringify([])
  ];

  redoHistory = [];

}


/* =========================================================
   PATCH HISTORY AFTER MAP START
========================================================= */

const originalFinishMapInitialization =
  finishMapInitialization;


/*
   Initialize an empty history once the map exists.
*/

const historyInitObserver =
  new MutationObserver(function() {

    if (map) {

      if (!history.length) {

        initializeHistory();

      }

      historyInitObserver.disconnect();

    }

  });

historyInitObserver.observe(
  document.body,
  {
    childList: true,
    subtree: true
  }
);


/* =========================================================
   IMPORTANT:
   INITIAL HISTORY FALLBACK
========================================================= */

setTimeout(function() {

  if (map && !history.length) {

    initializeHistory();

  }

}, 1000);

</script>
