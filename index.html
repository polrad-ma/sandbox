<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Map Sandbox</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Arial, Helvetica, sans-serif;
}

#map {
  width: 100%;
  height: 100%;
  background: #ddd;
}

/* TOOLBAR */

#toolbar {
  position: absolute;
  top: 10px;
  left: 10px;
  z-index: 3000;

  display: flex;
  flex-wrap: wrap;
  gap: 5px;

  padding: 7px;

  background: rgba(255,255,255,.96);
  border-radius: 8px;

  box-shadow: 0 2px 10px rgba(0,0,0,.25);
}

#toolbar button {
  border: 1px solid #bbb;
  background: white;
  padding: 7px 11px;
  border-radius: 5px;
  cursor: pointer;
  font-size: 13px;
}

#toolbar button:hover {
  background: #eee;
}

#toolbar button.active {
  background: #333;
  color: white;
  border-color: #333;
}

/* DRAWING BAR */

#drawingBar {
  display: none;

  position: absolute;
  top: 65px;
  left: 50%;
  transform: translateX(-50%);

  z-index: 3000;

  background: rgba(255,255,255,.97);

  padding: 8px 12px;
  border-radius: 7px;

  box-shadow: 0 2px 10px rgba(0,0,0,.25);

  align-items: center;
  gap: 8px;
}

#drawingBar button {
  border: 1px solid #aaa;
  background: white;
  padding: 7px 13px;
  border-radius: 5px;
  cursor: pointer;
}

#drawingBar button:hover {
  background: #eee;
}

#pointCounter {
  font-size: 13px;
  color: #555;
}

/* SETTINGS */

#panel {
  display: none;

  position: absolute;
  top: 10px;
  right: 10px;

  z-index: 3000;

  width: 250px;

  background: rgba(255,255,255,.97);

  padding: 12px;
  border-radius: 8px;

  box-shadow: 0 2px 12px rgba(0,0,0,.3);
}

#panel h3 {
  margin-top: 0;
}

#panel button {
  width: 100%;
  margin-top: 6px;
  padding: 8px;
  cursor: pointer;
}

/* START SCREEN */

#startScreen {
  position: absolute;
  inset: 0;

  z-index: 5000;

  background: #f5f5f5;

  display: flex;
  align-items: center;
  justify-content: center;
}

.startBox {
  width: min(650px, 90%);

  background: white;

  padding: 35px;

  border-radius: 14px;

  box-shadow: 0 5px 30px rgba(0,0,0,.2);

  text-align: center;
}

.startBox h1 {
  margin-top: 0;
  font-size: 30px;
}

.startBox p {
  color: #666;
}

.startButtons {
  display: flex;
  justify-content: center;
  gap: 15px;
  margin-top: 25px;
  flex-wrap: wrap;
}

.startButtons button {
  min-width: 210px;

  padding: 15px;

  border: none;
  border-radius: 8px;

  background: #333;
  color: white;

  cursor: pointer;

  font-size: 15px;
}

.startButtons button:hover {
  background: #111;
}

#imageInput {
  display: none;
}

/* VERTEX HANDLES */

.vertex-handle,
.midpoint-handle {
  pointer-events: auto !important;
}

.leaflet-marker-icon {
  z-index: 5000 !important;
}

.leaflet-container {
  -webkit-user-select: none;
  user-select: none;
}
</style>
</head>

<body>

<!-- START SCREEN -->

<div id="startScreen">

  <div class="startBox">

    <h1>Map Sandbox</h1>

    <p>
      Start with OpenStreetMap or upload your own map image.
    </p>

    <div class="startButtons">

      <button id="osmButton">
        OpenStreetMap
      </button>

      <button id="uploadButton">
        Upload Map Image
      </button>

    </div>

    <input
      type="file"
      id="imageInput"
      accept="image/png,image/jpeg,image/webp"
    >

  </div>

</div>


<!-- MAP -->

<div id="map"></div>


<!-- TOOLBAR -->

<div id="toolbar">

  <button id="selectBtn">Select</button>

  <button id="polygonBtn">Polygon</button>

  <button id="curveBtn">Curved Line</button>

  <button id="lineBtn">Line</button>

  <button id="markerBtn">Marker</button>

  <button id="textBtn">Text</button>

  <button id="deleteBtn">Delete</button>

  <button id="undoBtn">Undo</button>

  <button id="redoBtn">Redo</button>

  <button id="layersBtn">Layers</button>

  <button id="settingsBtn">Settings</button>

  <button id="newBtn">New</button>

</div>


<!-- DRAWING CONTROLS -->

<div id="drawingBar">

  <button id="finishBtn">
    Finish
  </button>

  <button id="cancelBtn">
    Cancel
  </button>

  <span id="pointCounter">
    Points: 0
  </span>

</div>


<!-- SETTINGS PANEL -->

<div id="panel">

  <h3>Settings</h3>

  <button id="clearBtn">
    Clear All Objects
  </button>

  <button id="closePanelBtn">
    Close
  </button>

</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* =========================================================
   VARIABLES
========================================================= */

let map = null;

let osm = null;
let satellite = null;
let hybrid = null;

let objects = [];

let selectedObject = null;

let currentTool = "select";

let drawing = false;
let drawingType = null;

let drawingPoints = [];

let previewObject = null;

let editHandles = [];
let midpointHandles = [];

let history = [];
let historyIndex = -1;

let historyTimer = null;


/* =========================================================
   INITIALIZE REAL WORLD MAP
========================================================= */

function initializeRealWorldMap() {

  osm = L.tileLayer(
    "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap contributors"
    }
  );

  satellite = L.tileLayer(
    "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
    {
      maxZoom: 19,
      attribution: "Tiles &copy; Esri"
    }
  );

  const labels = L.tileLayer(
    "https://services.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}",
    {
      maxZoom: 19,
      attribution: "Labels &copy; Esri"
    }
  );

  hybrid = L.layerGroup([
    satellite,
    labels
  ]);


  /*
     OSM IS THE DEFAULT.
  */

  map = L.map("map", {

    center: [48.5, 37.5],

    zoom: 7,

    layers: [
      osm
    ],

    zoomControl: false

  });


  L.control.zoom({
    position: "bottomright"
  }).addTo(map);


  L.control.layers(
    {
      "OpenStreetMap": osm,
      "Satellite + Labels": hybrid,
      "Satellite (Esri)": satellite
    },
    null,
    {
      collapsed: true,
      position: "topright"
    }
  ).addTo(map);


  installContextProtection();

  map.on(
    "click",
    handleMapClick
  );

  map.on(
    "contextmenu",
    function(e) {

      if (e.originalEvent) {
        e.originalEvent.preventDefault();
      }

      L.DomEvent.stopPropagation(e);

    }
  );


  saveHistory();

}


/* =========================================================
   CONTEXT MENU PROTECTION
========================================================= */

function installContextProtection() {

  map.getContainer().addEventListener(
    "contextmenu",
    function(e) {

      e.preventDefault();
      e.stopPropagation();

      return false;

    },
    true
  );

}


/* =========================================================
   START SCREEN
========================================================= */

document.getElementById(
  "osmButton"
).onclick = function() {

  document.getElementById(
    "startScreen"
  ).style.display = "none";

  if (!map) {
    initializeRealWorldMap();
  }

};


document.getElementById(
  "uploadButton"
).onclick = function() {

  document.getElementById(
    "imageInput"
  ).click();

};


document.getElementById(
  "imageInput"
).addEventListener(
  "change",
  function(e) {

    const file = e.target.files[0];

    if (!file) return;

    const reader = new FileReader();

    reader.onload = function(event) {

      const img = new Image();

      img.onload = function() {

        createImageMap(img);

      };

      img.src = event.target.result;

    };

    reader.readAsDataURL(file);

  }
);


/* =========================================================
   IMAGE MAP
========================================================= */

function createImageMap(img) {

  document.getElementById(
    "startScreen"
  ).style.display = "none";


  if (map) {
    map.remove();
  }


  /*
    Preserve the image's aspect ratio.
  */

  const maxDimension = 6000;

  const scale = Math.min(
    1,
    maxDimension /
    Math.max(
      img.naturalWidth,
      img.naturalHeight
    )
  );

  const width =
    Math.round(
      img.naturalWidth * scale
    );

  const height =
    Math.round(
      img.naturalHeight * scale
    );


  const canvas =
    document.createElement("canvas");

  canvas.width = width;
  canvas.height = height;


  const ctx =
    canvas.getContext("2d");

  ctx.imageSmoothingEnabled = true;

  ctx.drawImage(
    img,
    0,
    0,
    width,
    height
  );


  const imageUrl =
    canvas.toDataURL("image/png");


  map = L.map(
    "map",
    {
      crs: L.CRS.Simple,

      minZoom: -5,

      maxZoom: 5,

      zoomControl: false
    }
  );


  L.control.zoom({
    position: "bottomright"
  }).addTo(map);


  const bounds = [
    [0, 0],
    [height, width]
  ];


  L.imageOverlay(
    imageUrl,
    bounds,
    {
      interactive: false
    }
  ).addTo(map);


  map.fitBounds(bounds);


  installContextProtection();

  map.on(
    "click",
    handleMapClick
  );

}


/* =========================================================
   TOOLBAR
========================================================= */

document.getElementById(
  "selectBtn"
).onclick =
  () => setTool("select");

document.getElementById(
  "polygonBtn"
).onclick =
  () => setTool("polygon");

document.getElementById(
  "curveBtn"
).onclick =
  () => setTool("curve");

document.getElementById(
  "lineBtn"
).onclick =
  () => setTool("line");

document.getElementById(
  "markerBtn"
).onclick =
  () => setTool("marker");

document.getElementById(
  "textBtn"
).onclick =
  () => setTool("text");


function setTool(tool) {

  if (!map) return;


  if (drawing) {
    cancelDrawing();
  }


  currentTool = tool;


  document
    .querySelectorAll("#toolbar button")
    .forEach(
      button =>
        button.classList.remove("active")
    );


  const ids = {

    select: "selectBtn",
    polygon: "polygonBtn",
    curve: "curveBtn",
    line: "lineBtn",
    marker: "markerBtn",
    text: "textBtn",
    delete: "deleteBtn"

  };


  if (ids[tool]) {

    document
      .getElementById(ids[tool])
      .classList.add("active");

  }


  clearSelection();

}


/* =========================================================
   MAP CLICK
========================================================= */

function handleMapClick(e) {

  if (!map) return;


  if (
    currentTool === "polygon" ||
    currentTool === "line" ||
    currentTool === "curve"
  ) {

    if (!drawing) {

      beginDrawing(
        currentTool
      );

    }

    drawingPoints.push(
      e.latlng
    );

    updatePointCounter();

    updatePreview();

    return;

  }


  if (
    currentTool === "marker"
  ) {

    createMarker(
      e.latlng
    );

    return;

  }


  if (
    currentTool === "text"
  ) {

    const text =
      prompt("Enter text:");

    if (
      text !== null &&
      text.trim() !== ""
    ) {

      createText(
        e.latlng,
        text.trim()
      );

    }

    return;

  }


  if (
    currentTool === "select"
  ) {

    clearSelection();

  }

}


/* =========================================================
   DRAWING
========================================================= */

function beginDrawing(type) {

  drawing = true;

  drawingType = type;

  drawingPoints = [];

  previewObject = null;


  document.getElementById(
    "drawingBar"
  ).style.display = "flex";


  updatePointCounter();

}


function updatePreview() {

  if (previewObject) {

    map.removeLayer(
      previewObject
    );

    previewObject = null;

  }


  if (
    drawingPoints.length === 0
  ) {
    return;
  }


  if (
    drawingType === "polygon"
  ) {

    previewObject =
      L.polygon(
        drawingPoints,
        {
          color: "#3388ff",
          weight: 3,
          fillOpacity: .15,
          dashArray: "6 5",
          interactive: false
        }
      ).addTo(map);

  }


  else if (
    drawingType === "line"
  ) {

    previewObject =
      L.polyline(
        drawingPoints,
        {
          color: "#3388ff",
          weight: 4,
          dashArray: "6 5",
          interactive: false
        }
      ).addTo(map);

  }


  else if (
    drawingType === "curve"
  ) {

    if (
      drawingPoints.length >= 2
    ) {

      previewObject =
        L.polyline(
          makeCurve(
            drawingPoints
          ),
          {
            color: "#3388ff",
            weight: 4,
            dashArray: "6 5",
            interactive: false
          }
        ).addTo(map);

    }

  }

}


function finishDrawing() {

  if (!drawing) return;


  if (
    drawingType === "polygon" &&
    drawingPoints.length < 3
  ) {

    alert(
      "A polygon needs at least 3 points."
    );

    return;

  }


  if (
    (
      drawingType === "line" ||
      drawingType === "curve"
    ) &&
    drawingPoints.length < 2
  ) {

    alert(
      "A line needs at least 2 points."
    );

    return;

  }


  if (previewObject) {

    map.removeLayer(
      previewObject
    );

    previewObject = null;

  }


  const points =
    drawingPoints.map(
      p => L.latLng(
        p.lat,
        p.lng
      )
    );


  let object;


  if (
    drawingType === "polygon"
  ) {

    object =
      L.polygon(
        points,
        {
          color: "#3388ff",
          weight: 3,
          fillOpacity: .25
        }
      ).addTo(map);

  }


  else if (
    drawingType === "line"
  ) {

    object =
      L.polyline(
        points,
        {
          color: "#3388ff",
          weight: 4
        }
      ).addTo(map);

  }


  else {

    object =
      L.polyline(
        makeCurve(points),
        {
          color: "#3388ff",
          weight: 4
        }
      ).addTo(map);

  }


  object._sandboxType =
    drawingType;

  object._controlPoints =
    points;

  object._style = {

    color: "#3388ff",

    weight:
      drawingType === "polygon"
        ? 3
        : 4,

    fillOpacity:
      drawingType === "polygon"
        ? .25
        : 0

  };


  objects.push(object);


  setupObject(object);

  createHitLayer(object);


  drawing = false;

  drawingType = null;

  drawingPoints = [];


  document.getElementById(
    "drawingBar"
  ).style.display = "none";


  updatePointCounter();


  saveHistory();


  selectObject(object);

}


function cancelDrawing() {

  /*
    ONLY the unfinished preview is removed.
    Finished objects stay exactly where they are.
  */

  if (previewObject) {

    map.removeLayer(
      previewObject
    );

    previewObject = null;

  }


  drawing = false;

  drawingType = null;

  drawingPoints = [];


  document.getElementById(
    "drawingBar"
  ).style.display = "none";


  updatePointCounter();

}


function updatePointCounter() {

  document.getElementById(
    "pointCounter"
  ).textContent =
    "Points: " +
    drawingPoints.length;

}


document.getElementById(
  "finishBtn"
).onclick =
  finishDrawing;


document.getElementById(
  "cancelBtn"
).onclick =
  cancelDrawing;


/* =========================================================
   CURVE
========================================================= */

function makeCurve(points) {

  if (
    points.length < 3
  ) {

    return points.slice();

  }


  const result = [];


  for (
    let i = 0;
    i < points.length - 1;
    i++
  ) {

    const p0 =
      points[i - 1] ||
      points[i];

    const p1 =
      points[i];

    const p2 =
      points[i + 1];

    const p3 =
      points[i + 2] ||
      p2;


    for (
      let t = 0;
      t < 1;
      t += .08
    ) {

      const t2 = t * t;

      const t3 = t2 * t;


      const lat =
        .5 * (

          2 * p1.lat +

          (-p0.lat + p2.lat) * t +

          (
            2*p0.lat -
            5*p1.lat +
            4*p2.lat -
            p3.lat
          ) * t2 +

          (
            -p0.lat +
            3*p1.lat -
            3*p2.lat +
            p3.lat
          ) * t3

        );


      const lng =
        .5 * (

          2 * p1.lng +

          (-p0.lng + p2.lng) * t +

          (
            2*p0.lng -
            5*p1.lng +
            4*p2.lng -
            p3.lng
          ) * t2 +

          (
            -p0.lng +
            3*p1.lng -
            3*p2.lng +
            p3.lng
          ) * t3

        );


      result.push(
        L.latLng(
          lat,
          lng
        )
      );

    }

  }


  result.push(
    points[points.length - 1]
  );


  return result;

}


/* =========================================================
   HIT LAYERS
========================================================= */

function createHitLayer(object) {

  if (
    object._sandboxType === "line" ||
    object._sandboxType === "curve"
  ) {

    const hit =
      L.polyline(
        object.getLatLngs(),
        {
          color: "#000",
          opacity: .001,

          weight:
            Math.max(
              18,
              object._style.weight
            ) + 12,

          interactive: true,

          bubblingMouseEvents: false
        }
      ).addTo(map);


    hit._owner = object;


    hit.on(
      "click",
      function(e) {

        L.DomEvent.stopPropagation(e);

        if (
          currentTool === "delete"
        ) {

          deleteObject(object);

        }
        else {

          selectObject(object);

        }

      }
    );


    hit.on(
      "contextmenu",
      function(e) {

        if (e.originalEvent) {
          e.originalEvent.preventDefault();
        }

        L.DomEvent.stopPropagation(e);

      }
    );


    object._hitLayer = hit;

  }


  if (
    object._sandboxType === "polygon"
  ) {

    const hit =
      L.polygon(
        object.getLatLngs(),
        {
          stroke: false,

          fill: true,

          fillColor: "#000",

          fillOpacity: .001,

          interactive: true,

          bubblingMouseEvents: false
        }
      ).addTo(map);


    hit._owner = object;


    hit.on(
      "click",
      function(e) {

        L.DomEvent.stopPropagation(e);

        if (
          currentTool === "delete"
        ) {

          deleteObject(object);

        }
        else {

          selectObject(object);

        }

      }
    );


    hit.on(
      "contextmenu",
      function(e) {

        if (e.originalEvent) {
          e.originalEvent.preventDefault();
        }

        L.DomEvent.stopPropagation(e);

      }
    );


    object._hitLayer = hit;

  }

}


/* =========================================================
   OBJECT SETUP
========================================================= */

function setupObject(object) {

  object.on(
    "click",
    function(e) {

      L.DomEvent.stopPropagation(e);

      if (
        currentTool === "delete"
      ) {

        deleteObject(object);

      }
      else {

        selectObject(object);

      }

    }
  );


  object.on(
    "contextmenu",
    function(e) {

      if (e.originalEvent) {

        e.originalEvent.preventDefault();

      }

      L.DomEvent.stopPropagation(e);

    }
  );

}


/* =========================================================
   SELECTION
========================================================= */

function selectObject(object) {

  if (!object) return;


  if (
    selectedObject === object
  ) {

    return;

  }


  clearSelection();


  selectedObject = object;


  if (object.setStyle) {

    object.setStyle({
      dashArray: "8 6"
    });

  }


  createEditHandles(object);

}


function clearSelection() {

  if (!selectedObject) {

    removeEditHandles();

    return;

  }


  if (
    selectedObject.setStyle
  ) {

    selectedObject.setStyle({
      dashArray: null
    });

  }


  removeEditHandles();

  selectedObject = null;

}


/* =========================================================
   HANDLE ICONS
========================================================= */

function createVertexIcon() {

  return L.divIcon({

    className:
      "vertex-handle",

    html:
      '<div style="' +
      'width:14px;' +
      'height:14px;' +
      'background:white;' +
      'border:2px solid #3388ff;' +
      'border-radius:50%;' +
      'box-sizing:border-box;' +
      '"></div>',

    iconSize: [18,18],

    iconAnchor: [9,9]

  });

}


function createMidpointIcon() {

  return L.divIcon({

    className:
      "midpoint-handle",

    html:
      '<div style="' +
      'width:10px;' +
      'height:10px;' +
      'background:white;' +
      'border:2px solid #777;' +
      'border-radius:50%;' +
      'box-sizing:border-box;' +
      '"></div>',

    iconSize: [14,14],

    iconAnchor: [7,7]

  });

}


/* =========================================================
   REMOVE HANDLES
========================================================= */

function removeEditHandles() {

  editHandles.forEach(
    handle => {

      if (
        map &&
        map.hasLayer(handle)
      ) {

        map.removeLayer(handle);

      }

    }
  );


  midpointHandles.forEach(
    handle => {

      if (
        map &&
        map.hasLayer(handle)
      ) {

        map.removeLayer(handle);

      }

    }
  );


  editHandles = [];

  midpointHandles = [];

}


/* =========================================================
   CREATE EDIT HANDLES
========================================================= */

function createEditHandles(object) {

  removeEditHandles();


  if (
    !object._controlPoints
  ) {

    return;

  }


  object._controlPoints.forEach(
    (point, index) => {

      const handle =
        L.marker(
          point,
          {
            draggable: true,

            zIndexOffset: 10000,

            icon:
              createVertexIcon()
          }
        ).addTo(map);


      /*
        LEFT CLICK / DRAG = normal editing.

        RIGHT CLICK = DELETE THIS POINT.
      */

      handle.on(
        "contextmenu",
        function(e) {

          if (e.originalEvent) {

            e.originalEvent.preventDefault();

          }

          L.DomEvent.stopPropagation(e);


          deleteControlPoint(
            object,
            index
          );

        }
      );


      handle.on(
        "mousedown",
        function(e) {

          /*
            Only allow left mouse button
            to start dragging.
          */

          if (
            e.originalEvent &&
            e.originalEvent.button !== 0
          ) {

            L.DomEvent.stopPropagation(e);

          }

        }
      );


      handle.on(
        "drag",
        function(e) {

          const newPoint =
            e.target.getLatLng();


          object._controlPoints[index] =
            newPoint;


          updateObjectGeometry(
            object
          );

        }
      );


      handle.on(
        "dragend",
        function() {

          createEditHandles(
            object
          );

          saveHistory();

        }
      );


      editHandles.push(handle);

    }
  );


  createMidpointHandles(
    object
  );

}


/* =========================================================
   DELETE INDIVIDUAL CONTROL POINT
========================================================= */

function deleteControlPoint(
  object,
  index
) {

  if (!object) return;


  const points =
    object._controlPoints;


  /*
    Minimum point counts.

    Polygon: 3
    Line: 2
    Curve: 2
  */

  const minimum =
    object._sandboxType === "polygon"
      ? 3
      : 2;


  if (
    points.length <= minimum
  ) {

    /*
      Don't allow an object to become invalid.
    */

    return;

  }


  points.splice(
    index,
    1
  );


  updateObjectGeometry(
    object
  );


  /*
    Rebuild the visible vertex handles
    and midpoint handles.
  */

  createEditHandles(
    object
  );


  saveHistory();

}


/* =========================================================
   MIDPOINT HANDLES
========================================================= */

function createMidpointHandles(object) {

  const points =
    object._controlPoints;


  if (
    !points ||
    points.length < 2
  ) {

    return;

  }


  /*
    For polygons, also create a midpoint
    between the final and first point.
  */

  const segmentCount =
    object._sandboxType === "polygon"
      ? points.length
      : points.length - 1;


  for (
    let i = 0;
    i < segmentCount;
    i++
  ) {

    const next =
      (i + 1) % points.length;


    const a =
      points[i];

    const b =
      points[next];


    const midpoint =
      L.latLng(
        (a.lat + b.lat) / 2,
        (a.lng + b.lng) / 2
      );


    const handle =
      L.marker(
        midpoint,
        {
          draggable: false,

          zIndexOffset: 9000,

          icon:
            createMidpointIcon()
        }
      ).addTo(map);


    /*
      Right-clicking a midpoint does nothing.
      It isn't a real vertex yet.
    */

    handle.on(
      "contextmenu",
      function(e) {

        if (e.originalEvent) {

          e.originalEvent.preventDefault();

        }

        L.DomEvent.stopPropagation(e);

      }
    );


    handle.on(
      "click",
      function(e) {

        L.DomEvent.stopPropagation(e);


        object._controlPoints.splice(
          i + 1,
          0,
          midpoint
        );


        updateObjectGeometry(
          object
        );


        createEditHandles(
          object
        );


        saveHistory();

      }
    );


    midpointHandles.push(
      handle
    );

  }

}


/* =========================================================
   UPDATE GEOMETRY
========================================================= */

function updateObjectGeometry(object) {

  if (!object) return;


  const points =
    object._controlPoints;


  if (
    object._sandboxType === "curve"
  ) {

    object.setLatLngs(
      makeCurve(points)
    );

  }
  else {

    object.setLatLngs(
      points
    );

  }


  /*
    Keep invisible hit area synchronized.
  */

  if (
    object._hitLayer
  ) {

    object._hitLayer.setLatLngs(
      object.getLatLngs()
    );

  }

}


/* =========================================================
   MARKER
========================================================= */

function createMarker(latlng) {

  const marker =
    L.marker(
      latlng
    ).addTo(map);


  marker._sandboxType =
    "marker";


  marker._controlPoints = [
    latlng
  ];


  objects.push(
    marker
  );


  marker.on(
    "click",
    function(e) {

      L.DomEvent.stopPropagation(e);

      if (
        currentTool === "delete"
      ) {

        deleteObject(marker);

      }
      else {

        selectObject(marker);

      }

    }
  );


  marker.on(
    "contextmenu",
    function(e) {

      if (e.originalEvent) {

        e.originalEvent.preventDefault();

      }

      L.DomEvent.stopPropagation(e);

    }
  );


  saveHistory();

  selectObject(marker);

}


/* =========================================================
   TEXT
========================================================= */

function createText(
  latlng,
  text
) {

  const icon =
    L.divIcon({

      className:
        "sandbox-text",

      html:
        '<div style="' +
        'background:rgba(255,255,255,.85);' +
        'padding:3px 6px;' +
        'border-radius:4px;' +
        'border:1px solid #555;' +
        'font-size:14px;' +
        'white-space:nowrap;' +
        '">' +
        escapeHtml(text) +
        '</div>',

      iconSize: null,

      iconAnchor: [0,0]

    });


  const marker =
    L.marker(
      latlng,
      {
        icon: icon
      }
    ).addTo(map);


  marker._sandboxType =
    "text";

  marker._controlPoints = [
    latlng
  ];

  marker._text =
    text;


  objects.push(
    marker
  );


  marker.on(
    "click",
    function(e) {

      L.DomEvent.stopPropagation(e);

      if (
        currentTool === "delete"
      ) {

        deleteObject(marker);

      }
      else {

        selectObject(marker);

      }

    }
  );


  marker.on(
    "contextmenu",
    function(e) {

      if (e.originalEvent) {

        e.originalEvent.preventDefault();

      }

      L.DomEvent.stopPropagation(e);

    }
  );


  saveHistory();

  selectObject(marker);

}


function escapeHtml(text) {

  return text
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =========================================================
   DELETE OBJECT
========================================================= */

function deleteObject(object) {

  if (!object) return;


  removeEditHandles();


  if (
    object._hitLayer &&
    map.hasLayer(object._hitLayer)
  ) {

    map.removeLayer(
      object._hitLayer
    );

  }


  if (
    map.hasLayer(object)
  ) {

    map.removeLayer(
      object
    );

  }


  const index =
    objects.indexOf(object);


  if (index !== -1) {

    objects.splice(
      index,
      1
    );

  }


  selectedObject = null;


  saveHistory();

}


/* =========================================================
   DELETE TOOL
========================================================= */

document.getElementById(
  "deleteBtn"
).onclick =
  function() {

    setTool("delete");

  };


/* =========================================================
   HISTORY
========================================================= */

function saveHistory() {

  clearTimeout(
    historyTimer
  );


  historyTimer =
    setTimeout(
      saveHistoryNow,
      100
    );

}


function saveHistoryNow() {

  if (!map) return;


  const state =
    serializeState();


  if (
    historyIndex <
    history.length - 1
  ) {

    history =
      history.slice(
        0,
        historyIndex + 1
      );

  }


  history.push(
    state
  );


  if (
    history.length > 100
  ) {

    history.shift();

  }


  historyIndex =
    history.length - 1;


  updateHistoryButtons();

}


/* =========================================================
   SERIALIZE
========================================================= */

function serializeState() {

  return objects.map(
    object => {

      const type =
        object._sandboxType;


      if (
        type === "polygon" ||
        type === "line" ||
        type === "curve"
      ) {

        return {

          type: type,

          points:
            object._controlPoints.map(
              p => [
                p.lat,
                p.lng
              ]
            ),

          style: {

            color:
              object._style.color,

            weight:
              object._style.weight,

            fillOpacity:
              object._style.fillOpacity

          }

        };

      }


      if (
        type === "marker"
      ) {

        const p =
          object.getLatLng();


        return {

          type: "marker",

          points: [
            [
              p.lat,
              p.lng
            ]
          ]

        };

      }


      if (
        type === "text"
      ) {

        const p =
          object.getLatLng();


        return {

          type: "text",

          points: [
            [
              p.lat,
              p.lng
            ]
          ],

          text:
            object._text || ""

        };

      }


      return null;

    }
  ).filter(Boolean);

}


/* =========================================================
   RESTORE
========================================================= */

function restoreState(state) {

  clearSelection();


  objects.forEach(
    object => {

      if (
        object._hitLayer &&
        map.hasLayer(
          object._hitLayer
        )
      ) {

        map.removeLayer(
          object._hitLayer
        );

      }


      if (
        map.hasLayer(object)
      ) {

        map.removeLayer(
          object
        );

      }

    }
  );


  objects = [];


  state.forEach(
    data => {

      const points =
        data.points.map(
          p =>
            L.latLng(
              p[0],
              p[1]
            )
        );


      if (
        data.type === "polygon"
      ) {

        const object =
          L.polygon(
            points,
            {
              color:
                data.style.color,

              weight:
                data.style.weight,

              fillOpacity:
                data.style.fillOpacity
            }
          ).addTo(map);


        object._sandboxType =
          "polygon";

        object._controlPoints =
          points;

        object._style =
          data.style;


        objects.push(
          object
        );


        setupObject(
          object
        );

        createHitLayer(
          object
        );

      }


      else if (
        data.type === "line"
      ) {

        const object =
          L.polyline(
            points,
            {
              color:
                data.style.color,

              weight:
                data.style.weight
            }
          ).addTo(map);


        object._sandboxType =
          "line";

        object._controlPoints =
          points;

        object._style =
          data.style;


        objects.push(
          object
        );


        setupObject(
          object
        );

        createHitLayer(
          object
        );

      }


      else if (
        data.type === "curve"
      ) {

        const object =
          L.polyline(
            makeCurve(points),
            {
              color:
                data.style.color,

              weight:
                data.style.weight
            }
          ).addTo(map);


        object._sandboxType =
          "curve";

        object._controlPoints =
          points;

        object._style =
          data.style;


        objects.push(
          object
        );


        setupObject(
          object
        );

        createHitLayer(
          object
        );

      }


      else if (
        data.type === "marker"
      ) {

        const object =
          L.marker(
            points[0]
          ).addTo(map);


        object._sandboxType =
          "marker";

        object._controlPoints =
          points;


        objects.push(
          object
        );


        setupRestoredMarker(
          object
        );

      }


      else if (
        data.type === "text"
      ) {

        const object =
          L.marker(
            points[0],
            {
              icon:
                L.divIcon({

                  className:
                    "sandbox-text",

                  html:
                    '<div style="' +
                    'background:rgba(255,255,255,.85);' +
                    'padding:3px 6px;' +
                    'border-radius:4px;' +
                    'border:1px solid #555;' +
                    'font-size:14px;' +
                    'white-space:nowrap;' +
                    '">' +
                    escapeHtml(
                      data.text
                    ) +
                    '</div>'

                })
            }
          ).addTo(map);


        object._sandboxType =
          "text";

        object._controlPoints =
          points;

        object._text =
          data.text;


        objects.push(
          object
        );


        setupRestoredMarker(
          object
        );

      }

    }
  );

}


/* =========================================================
   RESTORED MARKER SETUP
========================================================= */

function setupRestoredMarker(object) {

  object.on(
    "click",
    function(e) {

      L.DomEvent.stopPropagation(e);

      if (
        currentTool === "delete"
      ) {

        deleteObject(object);

      }
      else {

        selectObject(object);

      }

    }
  );


  object.on(
    "contextmenu",
    function(e) {

      if (e.originalEvent) {

        e.originalEvent.preventDefault();

      }

      L.DomEvent.stopPropagation(e);

    }
  );

}


/* =========================================================
   UNDO / REDO
========================================================= */

function undo() {

  if (
    historyIndex <= 0
  ) {

    return;

  }


  historyIndex--;


  restoreState(
    history[
      historyIndex
    ]
  );


  updateHistoryButtons();

}


function redo() {

  if (
    historyIndex >=
    history.length - 1
  ) {

    return;

  }


  historyIndex++;


  restoreState(
    history[
      historyIndex
    ]
  );


  updateHistoryButtons();

}


function updateHistoryButtons() {

  document.getElementById(
    "undoBtn"
  ).disabled =
    historyIndex <= 0;


  document.getElementById(
    "redoBtn"
  ).disabled =
    historyIndex >=
    history.length - 1;

}


document.getElementById(
  "undoBtn"
).onclick =
  undo;


document.getElementById(
  "redoBtn"
).onclick =
  redo;


/* =========================================================
   SETTINGS
========================================================= */

document.getElementById(
  "layersBtn"
).onclick =
  function() {

    const control =
      document.querySelector(
        ".leaflet-control-layers"
      );


    if (!control) return;


    control.classList.toggle(
      "leaflet-control-layers-expanded"
    );

  };


document.getElementById(
  "settingsBtn"
).onclick =
  function() {

    document.getElementById(
      "panel"
    ).style.display =
      "block";

  };


document.getElementById(
  "closePanelBtn"
).onclick =
  function() {

    document.getElementById(
      "panel"
    ).style.display =
      "none";

  };


document.getElementById(
  "clearBtn"
).onclick =
  function() {

    if (
      !confirm(
        "Delete all objects?"
      )
    ) {

      return;

    }


    objects
      .slice()
      .forEach(
        deleteObject
      );


    saveHistory();

  };


/* =========================================================
   NEW
========================================================= */

document.getElementById(
  "newBtn"
).onclick =
  function() {

    if (
      !confirm(
        "Start a new sandbox? All current objects will be removed."
      )
    ) {

      return;

    }


    objects
      .slice()
      .forEach(
        object => {

          if (
            object._hitLayer &&
            map.hasLayer(
              object._hitLayer
            )
          ) {

            map.removeLayer(
              object._hitLayer
            );

          }


          if (
            map.hasLayer(object)
          ) {

            map.removeLayer(
              object
            );

          }

        }
      );


    objects = [];


    clearSelection();


    history = [];

    historyIndex = -1;


    saveHistory();

  };


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
  "keydown",
  function(e) {

    if (
      e.key === "Escape"
    ) {

      if (drawing) {

        cancelDrawing();

      }
      else {

        clearSelection();

      }

      return;

    }


    if (
      e.key === "Delete" ||
      e.key === "Backspace"
    ) {

      if (
        e.target.tagName === "INPUT" ||
        e.target.tagName === "TEXTAREA"
      ) {

        return;

      }


      if (selectedObject) {

        e.preventDefault();

        deleteObject(
          selectedObject
        );

      }

      return;

    }


    if (
      (e.ctrlKey || e.metaKey) &&
      e.key.toLowerCase() === "z"
    ) {

      e.preventDefault();

      if (e.shiftKey) {

        redo();

      }
      else {

        undo();

      }

      return;

    }


    if (
      (e.ctrlKey || e.metaKey) &&
      e.key.toLowerCase() === "y"
    ) {

      e.preventDefault();

      redo();

    }

  }
);


/* =========================================================
   GLOBAL RIGHT CLICK PROTECTION
========================================================= */

document.addEventListener(
  "contextmenu",
  function(e) {

    if (
      e.target.closest("#map")
    ) {

      e.preventDefault();

    }

  },
  true
);


/* =========================================================
   DEFAULT TOOL
========================================================= */

document.getElementById(
  "selectBtn"
).classList.add("active");

</script>

</body>
</html>
