<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>War Map Sandbox</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

/* =========================================================
   PAGE
========================================================= */

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    font-family: Arial, sans-serif;
}


/* =========================================================
   MAP

   IMPORTANT:
   The map is ALWAYS present and has a real size.
   The start screen sits above it.
========================================================= */

#map {
    position: fixed;

    left: 0;
    top: 0;
    right: 0;
    bottom: 0;

    width: 100%;
    height: 100%;

    z-index: 1;

    background: #ddd;
}

.leaflet-container {
    width: 100%;
    height: 100%;
}


/* =========================================================
   START SCREEN
========================================================= */

#startScreen {
    position: fixed;

    left: 0;
    top: 0;
    right: 0;
    bottom: 0;

    z-index: 10000;

    background: #111;

    color: white;

    display: flex;

    align-items: center;
    justify-content: center;
}

.startBox {
    width: 620px;
    max-width: 90%;

    text-align: center;
}

.startBox h1 {
    font-size: 38px;

    margin: 0 0 10px 0;
}

.startBox p {
    color: #aaa;

    margin: 0 0 35px 0;
}

.startButtons {
    display: flex;

    justify-content: center;

    gap: 20px;

    flex-wrap: wrap;
}

.startButton {
    width: 260px;
    height: 130px;

    background: #1c1c1c;

    color: white;

    border: 1px solid #444;

    border-radius: 12px;

    cursor: pointer;

    font-size: 18px;

    transition: 0.15s;
}

.startButton:hover {
    background: #292929;

    transform: translateY(-2px);
}

.startButton small {
    display: block;

    color: #999;

    margin-top: 10px;

    font-size: 13px;
}


/* =========================================================
   TOOLBAR
========================================================= */

#toolbar {
    position: fixed;

    top: 10px;
    left: 10px;

    z-index: 6000;

    display: none;

    background: rgba(25,25,25,.95);

    color: white;

    padding: 7px;

    border-radius: 8px;

    box-shadow:
        0 2px 12px rgba(0,0,0,.45);
}

#toolbar button {
    background: #333;

    border: 1px solid #555;

    color: white;

    padding: 8px 11px;

    margin: 2px;

    border-radius: 5px;

    cursor: pointer;
}

#toolbar button:hover {
    background: #444;
}

#toolbar button.active {
    background: #1677ff;

    border-color: #4d9aff;
}


/* =========================================================
   IMAGE INFO
========================================================= */

#imageInfo {
    position: fixed;

    top: 65px;
    right: 12px;

    z-index: 6000;

    display: none;

    background: rgba(25,25,25,.9);

    color: white;

    padding: 7px 11px;

    border-radius: 6px;

    font-size: 13px;
}


/* =========================================================
   EDIT VERTICES
========================================================= */

.vertex-icon {
    width: 12px;
    height: 12px;

    border-radius: 50%;

    background: white;

    border: 2px solid #1677ff;

    box-sizing: border-box;
}

.midpoint-icon {
    width: 10px;
    height: 10px;

    border-radius: 50%;

    background: rgba(255,255,255,.8);

    border: 2px solid #777;

    box-sizing: border-box;
}


/* =========================================================
   LEAFLET
========================================================= */

.leaflet-control-attribution {
    font-size: 10px;
}

</style>
</head>


<body>


<!-- =======================================================
     MAP

     This exists BEFORE the start screen and is NEVER
     display:none.
======================================================= -->

<div id="map"></div>


<!-- =======================================================
     START SCREEN
======================================================= -->

<div id="startScreen">

    <div class="startBox">

        <h1>War Map Sandbox</h1>

        <p>
            Choose a map type to begin
        </p>


        <div class="startButtons">

            <button
                class="startButton"
                onclick="startOSM()"
            >

                🌍 OpenStreetMap

                <small>
                    Use a real-world interactive map
                </small>

            </button>


            <button
                class="startButton"
                onclick="document.getElementById('imageUpload').click()"
            >

                🖼️ Upload Map Image

                <small>
                    Use your own map image
                </small>

            </button>

        </div>

    </div>

</div>


<input
    id="imageUpload"
    type="file"
    accept="image/*"
>


<!-- =======================================================
     TOOLBAR
======================================================= -->

<div id="toolbar">

    <button
        id="toolSelect"
        onclick="setTool('select')"
    >
        Select
    </button>

    <button
        id="toolPolygon"
        onclick="setTool('polygon')"
    >
        Polygon
    </button>

    <button
        id="toolLine"
        onclick="setTool('line')"
    >
        Line
    </button>

    <button
        id="toolCurve"
        onclick="setTool('curve')"
    >
        Curved Line
    </button>

    <button
        id="toolMarker"
        onclick="setTool('marker')"
    >
        Marker
    </button>

    <button
        id="toolText"
        onclick="setTool('text')"
    >
        Text
    </button>

    <button onclick="finishDrawing()">
        Finish
    </button>

    <button onclick="cancelDrawing()">
        Cancel
    </button>

    <button onclick="undo()">
        Undo
    </button>

    <button onclick="redo()">
        Redo
    </button>

    <button onclick="deleteSelected()">
        Delete
    </button>

    <button
        id="satButton"
        onclick="toggleSatellite()"
    >
        Satellite
    </button>

</div>


<div id="imageInfo"></div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script>

/* =========================================================
   GLOBAL STATE
========================================================= */

let map = null;

let objects = [];

let selectedObject = null;

let currentTool = "select";

let drawingPoints = [];

let drawingPreview = null;

let undoStack = [];

let redoStack = [];

let isImageMap = false;

let imageLayer = null;

let osmLayer = null;

let satelliteLayer = null;


/* =========================================================
   INITIALIZE REAL WORLD MAP IMMEDIATELY

   THIS IS THE IMPORTANT FIX.

   Leaflet gets initialized while #map is already:
   width:100%
   height:100%
   position:fixed

   The start screen is simply above it.
========================================================= */

function initializeRealWorldMap() {

    isImageMap = false;


    map = L.map("map", {

        zoomControl: true,

        doubleClickZoom: false,

        preferCanvas: false

    }).setView(

        [48.5, 37.5],

        7

    );


    /* =====================================================
       OPENSTREETMAP — DEFAULT
    ===================================================== */

    osmLayer = L.tileLayer(

        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

        {

            maxZoom: 20,

            crossOrigin: true,

            attribution:
                '&copy; OpenStreetMap contributors'

        }

    ).addTo(map);


    /* =====================================================
       ESRI SATELLITE — OPTIONAL
    ===================================================== */

    satelliteLayer = L.tileLayer(

        "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",

        {

            maxZoom: 19,

            crossOrigin: true,

            attribution:
                "Tiles &copy; Esri"

        }

    );


    setupMapEvents();


    /*
       Make absolutely sure Leaflet knows the dimensions.
    */

    setTimeout(function() {

        map.invalidateSize(true);

    }, 50);


    setTimeout(function() {

        map.invalidateSize(true);

    }, 500);

}


/* =========================================================
   START OSM
========================================================= */

function startOSM() {

    isImageMap = false;


    document
        .getElementById("startScreen")
        .style.display = "none";


    document
        .getElementById("toolbar")
        .style.display = "block";


    document
        .getElementById("imageInfo")
        .style.display = "none";


    /*
       One more size refresh after the overlay disappears.
    */

    setTimeout(function() {

        if (map) {

            map.invalidateSize(true);

        }

    }, 50);


    setTool("select");

}


/* =========================================================
   IMAGE MAP

   For an uploaded image we replace the normal Web Mercator
   map with CRS.Simple.
========================================================= */

function initializeImageMap(img) {


    /*
       Remove the old map.
    */

    if (map) {

        map.remove();

        map = null;

    }


    objects = [];

    selectedObject = null;

    drawingPoints = [];

    drawingPreview = null;

    undoStack = [];

    redoStack = [];


    isImageMap = true;


    map = L.map("map", {

        crs: L.CRS.Simple,

        minZoom: -5,

        maxZoom: 10,

        zoomControl: true,

        doubleClickZoom: false

    });


    const width =
        img.naturalWidth;

    const height =
        img.naturalHeight;


    /*
       Use the exact natural image dimensions.

       This preserves the image aspect ratio.
    */

    const bounds = [

        [0, 0],

        [height, width]

    ];


    imageLayer =
        L.imageOverlay(

            img.src,

            bounds,

            {

                interactive: false

            }

        ).addTo(map);


    map.fitBounds(bounds);


    document
        .getElementById("startScreen")
        .style.display = "none";


    document
        .getElementById("toolbar")
        .style.display = "block";


    document
        .getElementById("imageInfo")
        .style.display = "block";


    document
        .getElementById("imageInfo")
        .textContent =
            width +
            " × " +
            height +
            " px";


    setupMapEvents();


    setTimeout(function() {

        map.invalidateSize(true);

        map.fitBounds(bounds);

    }, 50);


    setTimeout(function() {

        map.invalidateSize(true);

    }, 500);


    setTool("select");

}


/* =========================================================
   FILE UPLOAD
========================================================= */

document
    .getElementById("imageUpload")
    .addEventListener(
        "change",
        function(e) {

            const file =
                e.target.files[0];


            if (!file) {

                return;

            }


            const reader =
                new FileReader();


            reader.onload =
                function(event) {

                    const img =
                        new Image();


                    img.onload =
                        function() {

                            initializeImageMap(img);

                        };


                    img.src =
                        event.target.result;

                };


            reader.readAsDataURL(file);

        }
    );


/* =========================================================
   MAP EVENTS
========================================================= */

function setupMapEvents() {


    map.on(
        "click",
        function(e) {


            /* ---------------------------------------------
               DRAWING
            --------------------------------------------- */

            if (

                currentTool === "polygon" ||

                currentTool === "line" ||

                currentTool === "curve"

            ) {

                addDrawingPoint(
                    e.latlng
                );

                return;

            }


            /* ---------------------------------------------
               MARKER
            --------------------------------------------- */

            if (
                currentTool === "marker"
            ) {

                createMarker(
                    e.latlng
                );

                return;

            }


            /* ---------------------------------------------
               TEXT
            --------------------------------------------- */

            if (
                currentTool === "text"
            ) {

                createText(
                    e.latlng
                );

                return;

            }


            /* ---------------------------------------------
               SELECT / EMPTY MAP
            --------------------------------------------- */

            if (
                currentTool === "select"
            ) {

                clearSelection();

            }

        }
    );


    /*
       Prevent the browser's right-click menu.

       IMPORTANT:
       This is NOT a capture-phase document listener.

       Vertex markers handle their own contextmenu event.
    */

    map.on(
        "contextmenu",
        function(e) {

            if (
                e.originalEvent
            ) {

                e.originalEvent.preventDefault();

            }

        }
    );

}


/* =========================================================
   TOOL SELECTION
========================================================= */

function setTool(tool) {


    cancelDrawing();


    currentTool =
        tool;


    document
        .querySelectorAll(
            "#toolbar button"
        )
        .forEach(
            function(button) {

                button.classList.remove(
                    "active"
                );

            }
        );


    const button =
        document.getElementById(

            "tool" +

            tool
                .charAt(0)
                .toUpperCase() +

            tool.slice(1)

        );


    if (button) {

        button.classList.add(
            "active"
        );

    }


    if (map) {

        map.getContainer().style.cursor =

            tool === "select"

                ? ""

                : "crosshair";

    }

}


/* =========================================================
   ADD DRAWING POINT
========================================================= */

function addDrawingPoint(latlng) {


    drawingPoints.push([

        latlng.lat,

        latlng.lng

    ]);


    updateDrawingPreview();

}


/* =========================================================
   DRAWING PREVIEW
========================================================= */

function updateDrawingPreview() {


    if (drawingPreview) {

        map.removeLayer(
            drawingPreview
        );

        drawingPreview = null;

    }


    if (
        drawingPoints.length === 0
    ) {

        return;

    }


    /* -----------------------------------------------------
       POLYGON
    ----------------------------------------------------- */

    if (
        currentTool === "polygon"
    ) {

        drawingPreview =
            L.polygon(

                drawingPoints,

                {

                    color: "#1677ff",

                    weight: 3,

                    fillOpacity: 0.15,

                    dashArray: "6 5",

                    interactive: false

                }

            ).addTo(map);

    }


    /* -----------------------------------------------------
       LINE
    ----------------------------------------------------- */

    else if (
        currentTool === "line"
    ) {

        drawingPreview =
            L.polyline(

                drawingPoints,

                {

                    color: "#1677ff",

                    weight: 4,

                    dashArray: "6 5",

                    interactive: false

                }

            ).addTo(map);

    }


    /* -----------------------------------------------------
       CURVE
    ----------------------------------------------------- */

    else if (
        currentTool === "curve"
    ) {


        if (
            drawingPoints.length >= 2
        ) {

            drawingPreview =
                L.polyline(

                    makeCurve(
                        drawingPoints
                    ),

                    {

                        color: "#1677ff",

                        weight: 4,

                        dashArray: "6 5",

                        interactive: false

                    }

                ).addTo(map);

        }

        else {

            drawingPreview =
                L.circleMarker(

                    drawingPoints[0],

                    {

                        radius: 5,

                        color: "#1677ff",

                        fillOpacity: 1,

                        interactive: false

                    }

                ).addTo(map);

        }

    }

}


/* =========================================================
   FINISH DRAWING
========================================================= */

function finishDrawing() {


    if (
        drawingPoints.length === 0
    ) {

        return;

    }


    if (

        currentTool === "polygon" &&

        drawingPoints.length < 3

    ) {

        alert(
            "A polygon needs at least 3 points."
        );

        return;

    }


    if (

        (
            currentTool === "line" ||
            currentTool === "curve"
        ) &&

        drawingPoints.length < 2

    ) {

        alert(
            "A line needs at least 2 points."
        );

        return;

    }


    saveHistory();


    let object = null;


    /* -----------------------------------------------------
       POLYGON
    ----------------------------------------------------- */

    if (
        currentTool === "polygon"
    ) {

        object =
            L.polygon(

                drawingPoints,

                {

                    color: "#1677ff",

                    weight: 3,

                    fillColor: "#1677ff",

                    fillOpacity: 0.18

                }

            ).addTo(map);

    }


    /* -----------------------------------------------------
       LINE
    ----------------------------------------------------- */

    else if (
        currentTool === "line"
    ) {

        object =
            L.polyline(

                drawingPoints,

                {

                    color: "#1677ff",

                    weight: 4

                }

            ).addTo(map);

    }


    /* -----------------------------------------------------
       CURVE
    ----------------------------------------------------- */

    else if (
        currentTool === "curve"
    ) {

        object =
            L.polyline(

                makeCurve(
                    drawingPoints
                ),

                {

                    color: "#1677ff",

                    weight: 4

                }

            ).addTo(map);

    }


    if (!object) {

        return;

    }


    object._sandboxType =
        currentTool;


    object._controlPoints =
        drawingPoints.map(
            function(p) {

                return [
                    p[0],
                    p[1]
                ];

            }
        );


    object._style = {

        color: "#1677ff",

        weight: 4,

        fillColor: "#1677ff",

        fillOpacity: 0.18

    };


    objects.push(
        object
    );


    setupObject(
        object
    );


    createHitLayer(
        object
    );


    drawingPoints = [];


    if (drawingPreview) {

        map.removeLayer(
            drawingPreview
        );

        drawingPreview = null;

    }


    setTool("select");

}


/* =========================================================
   CANCEL
========================================================= */

function cancelDrawing() {


    /*
       IMPORTANT:

       Cancel only removes the unfinished drawing.

       It NEVER removes finished objects.
    */

    drawingPoints = [];


    if (drawingPreview) {

        map.removeLayer(
            drawingPreview
        );

        drawingPreview = null;

    }

}


/* =========================================================
   CATMULL-ROM CURVE
========================================================= */

function makeCurve(points) {


    if (
        points.length < 2
    ) {

        return points;

    }


    if (
        points.length === 2
    ) {

        return points;

    }


    const result = [];


    for (
        let i = 0;
        i < points.length - 1;
        i++
    ) {


        const p0 =
            points[i - 1] ||
            points[i];


        const p1 =
            points[i];


        const p2 =
            points[i + 1];


        const p3 =
            points[i + 2] ||
            p2;


        const steps = 20;


        for (
            let j = 0;
            j < steps;
            j++
        ) {


            const t =
                j / steps;


            const t2 =
                t * t;


            const t3 =
                t2 * t;


            const lat =
                0.5 *
                (

                    (2 * p1[0]) +

                    (-p0[0] + p2[0]) * t +

                    (
                        2 * p0[0] -
                        5 * p1[0] +
                        4 * p2[0] -
                        p3[0]
                    ) * t2 +

                    (
                        -p0[0] +
                        3 * p1[0] -
                        3 * p2[0] +
                        p3[0]
                    ) * t3

                );


            const lng =
                0.5 *
                (

                    (2 * p1[1]) +

                    (-p0[1] + p2[1]) * t +

                    (
                        2 * p0[1] -
                        5 * p1[1] +
                        4 * p2[1] -
                        p3[1]
                    ) * t2 +

                    (
                        -p0[1] +
                        3 * p1[1] -
                        3 * p2[1] +
                        p3[1]
                    ) * t3

                );


            result.push([
                lat,
                lng
            ]);

        }

    }


    result.push(
        points[points.length - 1]
    );


    return result;

}


/* =========================================================
   OBJECT CLICK
========================================================= */

function setupObject(object) {


    object.on(
        "click",
        function(e) {


            L.DomEvent.stopPropagation(e);


            if (
                currentTool === "delete"
            ) {

                deleteObject(
                    object
                );

                return;

            }


            selectObject(
                object
            );

        }
    );

}


/* =========================================================
   HIT LAYER

   Lines get a wide invisible clickable line.

   This makes selecting a thin line much easier.
========================================================= */

function createHitLayer(object) {


    /* -----------------------------------------------------
       POLYGON
    ----------------------------------------------------- */

    if (
        object._sandboxType === "polygon"
    ) {


        const hit =
            L.polygon(

                object.getLatLngs(),

                {

                    color: "#000",

                    opacity: 0.001,

                    weight: 18,

                    fillColor: "#000",

                    fillOpacity: 0.001,

                    interactive: true,

                    bubblingMouseEvents: false

                }

            ).addTo(map);


        hit._owner =
            object;


        hit.on(
            "click",
            function(e) {


                L.DomEvent.stopPropagation(
                    e
                );


                if (
                    currentTool === "delete"
                ) {

                    deleteObject(
                        object
                    );

                }

                else {

                    selectObject(
                        object
                    );

                }

            }
        );


        object._hitLayer =
            hit;


        return;

    }


    /* -----------------------------------------------------
       LINE / CURVE
    ----------------------------------------------------- */

    const hit =
        L.polyline(

            object.getLatLngs(),

            {

                color: "#000",

                opacity: 0.001,

                weight:
                    Math.max(
                        18,
                        object._style?.weight || 4
                    ) + 12,

                interactive: true,

                bubblingMouseEvents: false

            }

        ).addTo(map);


    hit._owner =
        object;


    hit.on(
        "click",
        function(e) {


            L.DomEvent.stopPropagation(
                e
            );


            if (
                currentTool === "delete"
            ) {

                deleteObject(
                    object
                );

            }

            else {

                selectObject(
                    object
                );

            }

        }
    );


    object._hitLayer =
        hit;

}


/* =========================================================
   SELECT OBJECT
========================================================= */

function selectObject(object) {


    clearSelection();


    selectedObject =
        object;


    if (
        object.setStyle
    ) {


        object._originalStyle = {

            color:
                object.options.color,

            weight:
                object.options.weight,

            fillColor:
                object.options.fillColor,

            fillOpacity:
                object.options.fillOpacity

        };


        object.setStyle({

            color: "#1677ff",

            weight:
                Math.max(
                    object.options.weight || 3,
                    4
                ),

            dashArray: "8 6"

        });

    }


    createEditHandles(
        object
    );

}


/* =========================================================
   CLEAR SELECTION
========================================================= */

function clearSelection() {


    if (
        selectedObject
    ) {


        const object =
            selectedObject;


        if (

            object._originalStyle &&

            object.setStyle

        ) {


            object.setStyle({

                color:
                    object._originalStyle.color,

                weight:
                    object._originalStyle.weight,

                fillColor:
                    object._originalStyle.fillColor,

                fillOpacity:
                    object._originalStyle.fillOpacity,

                dashArray: null

            });

        }


        removeEditHandles(
            object
        );

    }


    selectedObject =
        null;

}


/* =========================================================
   VERTEX ICON
========================================================= */

function createVertexIcon() {

    return L.divIcon({

        className: "",

        html:
            '<div class="vertex-icon"></div>',

        iconSize: [
            12,
            12
        ],

        iconAnchor: [
            6,
            6
        ]

    });

}


/* =========================================================
   MIDPOINT ICON
========================================================= */

function createMidpointIcon() {

    return L.divIcon({

        className: "",

        html:
            '<div class="midpoint-icon"></div>',

        iconSize: [
            10,
            10
        ],

        iconAnchor: [
            5,
            5
        ]

    });

}


/* =========================================================
   CREATE EDIT HANDLES
========================================================= */

function createEditHandles(object) {


    removeEditHandles(
        object
    );


    object._editHandles = [];

    object._midpointHandles = [];


    const points =
        object._controlPoints;


    if (!points) {

        return;

    }


    /* =====================================================
       VERTICES
    ===================================================== */

    points.forEach(
        function(point, index) {


            const handle =
                L.marker(

                    point,

                    {

                        draggable: true,

                        zIndexOffset: 10000,

                        icon:
                            createVertexIcon(),

                        bubblingMouseEvents:
                            false

                    }

                ).addTo(map);


            /* ---------------------------------------------
               DRAG START
            --------------------------------------------- */

            handle.on(
                "dragstart",
                function() {

                    saveHistory();

                }
            );


            /* ---------------------------------------------
               LIVE DRAG
            --------------------------------------------- */

            handle.on(
                "drag",
                function(e) {


                    const pos =
                        e.target.getLatLng();


                    object._controlPoints[index] = [

                        pos.lat,

                        pos.lng

                    ];


                    updateObjectGeometry(
                        object
                    );

                }
            );


            /* ---------------------------------------------
               DRAG END
            --------------------------------------------- */

            handle.on(
                "dragend",
                function(e) {


                    const pos =
                        e.target.getLatLng();


                    object._controlPoints[index] = [

                        pos.lat,

                        pos.lng

                    ];


                    updateObjectGeometry(
                        object
                    );

                }
            );


            /* =================================================
               RIGHT CLICK = DELETE VERTEX

               We attach directly to the actual DOM element.
            ================================================= */

            const icon =
                handle.getElement();


            if (icon) {


                L.DomEvent.on(

                    icon,

                    "contextmenu",

                    function(ev) {


                        ev.preventDefault();

                        ev.stopPropagation();


                        deleteControlPoint(

                            object,

                            index

                        );

                    }

                );

            }


            object._editHandles.push(
                handle
            );

        }
    );


    /* =====================================================
       MIDPOINTS
    ===================================================== */

    for (
        let i = 0;
        i < points.length - 1;
        i++
    ) {


        const a =
            points[i];


        const b =
            points[i + 1];


        const midpoint = [

            (a[0] + b[0]) / 2,

            (a[1] + b[1]) / 2

        ];


        const handle =
            L.marker(

                midpoint,

                {

                    draggable: false,

                    zIndexOffset: 9000,

                    icon:
                        createMidpointIcon(),

                    bubblingMouseEvents:
                        false

                }

            ).addTo(map);


        handle.on(
            "click",
            function(e) {


                L.DomEvent.stopPropagation(
                    e
                );


                saveHistory();


                object._controlPoints.splice(

                    i + 1,

                    0,

                    [
                        midpoint[0],
                        midpoint[1]
                    ]

                );


                updateObjectGeometry(
                    object
                );


                createEditHandles(
                    object
                );

            }
        );


        object._midpointHandles.push(
            handle
        );

    }

}


/* =========================================================
   DELETE CONTROL POINT
========================================================= */

function deleteControlPoint(
    object,
    index
) {


    if (
        !object._controlPoints
    ) {

        return;

    }


    const minimum =

        object._sandboxType === "polygon"

            ? 3

            : 2;


    if (
        object._controlPoints.length <= minimum
    ) {


        alert(

            object._sandboxType === "polygon"

                ? "A polygon needs at least 3 points."

                : "A line needs at least 2 points."

        );


        return;

    }


    saveHistory();


    object._controlPoints.splice(
        index,
        1
    );


    updateObjectGeometry(
        object
    );


    createEditHandles(
        object
    );

}


/* =========================================================
   UPDATE GEOMETRY
========================================================= */

function updateObjectGeometry(object) {


    if (

        !object ||

        !object._controlPoints

    ) {

        return;

    }


    const points =
        object._controlPoints;


    /* -----------------------------------------------------
       POLYGON
    ----------------------------------------------------- */

    if (
        object._sandboxType === "polygon"
    ) {

        object.setLatLngs(
            points
        );

    }


    /* -----------------------------------------------------
       LINE
    ----------------------------------------------------- */

    else if (
        object._sandboxType === "line"
    ) {

        object.setLatLngs(
            points
        );

    }


    /* -----------------------------------------------------
       CURVE
    ----------------------------------------------------- */

    else if (
        object._sandboxType === "curve"
    ) {

        object.setLatLngs(

            makeCurve(
                points
            )

        );

    }


    /* -----------------------------------------------------
       UPDATE HIT LINE
    ----------------------------------------------------- */

    if (
        object._hitLayer
    ) {


        if (
            object._sandboxType === "polygon"
        ) {

            object._hitLayer.setLatLngs(
                points
            );

        }

        else {


            const hitPoints =

                object._sandboxType === "curve"

                    ? makeCurve(points)

                    : points;


            object._hitLayer.setLatLngs(
                hitPoints
            );

        }

    }

}


/* =========================================================
   REMOVE EDIT HANDLES
========================================================= */

function removeEditHandles(object) {


    if (
        object._editHandles
    ) {


        object._editHandles.forEach(
            function(handle) {


                if (

                    map &&

                    map.hasLayer(handle)

                ) {

                    map.removeLayer(
                        handle
                    );

                }

            }
        );

    }


    if (
        object._midpointHandles
    ) {


        object._midpointHandles.forEach(
            function(handle) {


                if (

                    map &&

                    map.hasLayer(handle)

                ) {

                    map.removeLayer(
                        handle
                    );

                }

            }
        );

    }


    object._editHandles = [];

    object._midpointHandles = [];

}


/* =========================================================
   DELETE SELECTED
========================================================= */

function deleteSelected() {


    if (
        !selectedObject
    ) {

        return;

    }


    deleteObject(
        selectedObject
    );

}


/* =========================================================
   DELETE OBJECT
========================================================= */

function deleteObject(object) {


    if (!object) {

        return;

    }


    saveHistory();


    removeEditHandles(
        object
    );


    if (

        object._hitLayer &&

        map.hasLayer(
            object._hitLayer
        )

    ) {

        map.removeLayer(
            object._hitLayer
        );

    }


    if (
        map.hasLayer(object)
    ) {

        map.removeLayer(
            object
        );

    }


    const index =
        objects.indexOf(
            object
        );


    if (
        index !== -1
    ) {

        objects.splice(
            index,
            1
        );

    }


    if (
        selectedObject === object
    ) {

        selectedObject =
            null;

    }

}


/* =========================================================
   MARKER
========================================================= */

function createMarker(latlng) {


    saveHistory();


    const marker =
        L.marker(

            latlng,

            {

                draggable: true

            }

        ).addTo(map);


    marker._sandboxType =
        "marker";


    marker._controlPoints = [

        [
            latlng.lat,
            latlng.lng
        ]

    ];


    marker.on(
        "click",
        function(e) {

            L.DomEvent.stopPropagation(
                e
            );

            selectObject(
                marker
            );

        }
    );


    marker.on(
        "dragend",
        function() {


            const pos =
                marker.getLatLng();


            marker._controlPoints = [

                [
                    pos.lat,
                    pos.lng
                ]

            ];

        }
    );


    objects.push(
        marker
    );

}


/* =========================================================
   TEXT
========================================================= */

function createText(latlng) {


    const text =
        prompt(
            "Enter text:"
        );


    if (!text) {

        return;

    }


    saveHistory();


    const marker =
        L.marker(

            latlng,

            {

                icon:
                    L.divIcon({

                        className: "",

                        html:
                            '<div style="' +

                            'color:white;' +

                            'font-weight:bold;' +

                            'font-size:16px;' +

                            'text-shadow:0 1px 3px black;' +

                            'white-space:nowrap;' +

                            '">' +

                            escapeHtml(
                                text
                            ) +

                            '</div>',

                        iconAnchor: [
                            0,
                            0
                        ]

                    })

            }

        ).addTo(map);


    marker._sandboxType =
        "text";


    marker._text =
        text;


    marker.on(
        "click",
        function(e) {

            L.DomEvent.stopPropagation(
                e
            );

            selectObject(
                marker
            );

        }
    );


    objects.push(
        marker
    );

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(text) {

    return text

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    function(e) {


        if (

            e.key === "Delete" ||

            e.key === "Backspace"

        ) {


            if (

                document.activeElement &&

                (

                    document.activeElement.tagName ===
                    "INPUT" ||

                    document.activeElement.tagName ===
                    "TEXTAREA"

                )

            ) {

                return;

            }


            deleteSelected();

        }


        if (
            e.key === "Escape"
        ) {

            cancelDrawing();

        }

    }
);


/* =========================================================
   SERIALIZE STATE
========================================================= */

function serializeState() {


    return objects.map(
        function(object) {


            const data = {

                type:
                    object._sandboxType

            };


            if (

                object._sandboxType === "polygon" ||

                object._sandboxType === "line" ||

                object._sandboxType === "curve"

            ) {


                data.controlPoints =

                    object._controlPoints.map(
                        function(p) {

                            return [
                                p[0],
                                p[1]
                            ];

                        }
                    );


                data.style = {

                    color:
                        object.options.color,

                    weight:
                        object.options.weight,

                    fillColor:
                        object.options.fillColor,

                    fillOpacity:
                        object.options.fillOpacity

                };

            }


            if (
                object._sandboxType === "marker"
            ) {


                const pos =
                    object.getLatLng();


                data.lat =
                    pos.lat;


                data.lng =
                    pos.lng;

            }


            if (
                object._sandboxType === "text"
            ) {


                const pos =
                    object.getLatLng();


                data.lat =
                    pos.lat;


                data.lng =
                    pos.lng;


                data.text =
                    object._text;

            }


            return data;

        }
    );

}


/* =========================================================
   HISTORY
========================================================= */

function saveHistory() {


    undoStack.push(

        JSON.stringify(
            serializeState()
        )

    );


    if (
        undoStack.length > 50
    ) {

        undoStack.shift();

    }


    redoStack = [];

}


/* =========================================================
   UNDO
========================================================= */

function undo() {


    if (
        undoStack.length === 0
    ) {

        return;

    }


    redoStack.push(

        JSON.stringify(
            serializeState()
        )

    );


    const state =
        JSON.parse(

            undoStack.pop()

        );


    restoreState(
        state
    );

}


/* =========================================================
   REDO
========================================================= */

function redo() {


    if (
        redoStack.length === 0
    ) {

        return;

    }


    undoStack.push(

        JSON.stringify(
            serializeState()
        )

    );


    const state =
        JSON.parse(

            redoStack.pop()

        );


    restoreState(
        state
    );

}


/* =========================================================
   RESTORE
========================================================= */

function restoreState(state) {


    clearSelection();


    objects.forEach(
        function(object) {


            removeEditHandles(
                object
            );


            if (

                object._hitLayer &&

                map.hasLayer(
                    object._hitLayer
                )

            ) {

                map.removeLayer(
                    object._hitLayer
                );

            }


            if (
                map.hasLayer(object)
            ) {

                map.removeLayer(
                    object
                );

            }

        }
    );


    objects = [];


    state.forEach(
        function(data) {


            let object = null;


            /* ------------------------------------------------
               POLYGON
            ------------------------------------------------ */

            if (
                data.type === "polygon"
            ) {


                object =
                    L.polygon(

                        data.controlPoints,

                        data.style

                    ).addTo(map);


                object._controlPoints =

                    data.controlPoints.map(
                        function(p) {

                            return [
                                p[0],
                                p[1]
                            ];

                        }
                    );

            }


            /* ------------------------------------------------
               LINE
            ------------------------------------------------ */

            else if (
                data.type === "line"
            ) {


                object =
                    L.polyline(

                        data.controlPoints,

                        data.style

                    ).addTo(map);


                object._controlPoints =

                    data.controlPoints.map(
                        function(p) {

                            return [
                                p[0],
                                p[1]
                            ];

                        }
                    );

            }


            /* ------------------------------------------------
               CURVE
            ------------------------------------------------ */

            else if (
                data.type === "curve"
            ) {


                object =
                    L.polyline(

                        makeCurve(
                            data.controlPoints
                        ),

                        data.style

                    ).addTo(map);


                object._controlPoints =

                    data.controlPoints.map(
                        function(p) {

                            return [
                                p[0],
                                p[1]
                            ];

                        }
                    );

            }


            /* ------------------------------------------------
               MARKER
            ------------------------------------------------ */

            else if (
                data.type === "marker"
            ) {


                object =
                    L.marker(

                        [
                            data.lat,
                            data.lng
                        ],

                        {
                            draggable: true
                        }

                    ).addTo(map);


                object._controlPoints = [

                    [
                        data.lat,
                        data.lng
                    ]

                ];

            }


            /* ------------------------------------------------
               TEXT
            ------------------------------------------------ */

            else if (
                data.type === "text"
            ) {


                object =
                    L.marker(

                        [
                            data.lat,
                            data.lng
                        ],

                        {

                            icon:
                                L.divIcon({

                                    className: "",

                                    html:
                                        '<div style="' +

                                        'color:white;' +

                                        'font-weight:bold;' +

                                        'font-size:16px;' +

                                        'text-shadow:0 1px 3px black;' +

                                        'white-space:nowrap;' +

                                        '">' +

                                        escapeHtml(
                                            data.text
                                        ) +

                                        '</div>',

                                    iconAnchor: [
                                        0,
                                        0
                                    ]

                                })

                        }

                    ).addTo(map);


                object._text =
                    data.text;

            }


            if (!object) {

                return;

            }


            object._sandboxType =
                data.type;


            objects.push(
                object
            );


            setupObject(
                object
            );


            if (

                data.type === "polygon" ||

                data.type === "line" ||

                data.type === "curve"

            ) {

                createHitLayer(
                    object
                );

            }

        }
    );

}


/* =========================================================
   SATELLITE
========================================================= */

function toggleSatellite() {


    if (
        isImageMap
    ) {

        return;

    }


    if (
        map.hasLayer(
            satelliteLayer
        )
    ) {


        map.removeLayer(
            satelliteLayer
        );


        osmLayer.addTo(
            map
        );


        document
            .getElementById(
                "satButton"
            )
            .textContent =
                "Satellite";

    }


    else {


        if (
            map.hasLayer(
                osmLayer
            )
        ) {

            map.removeLayer(
                osmLayer
            );

        }


        satelliteLayer.addTo(
            map
        );


        document
            .getElementById(
                "satButton"
            )
            .textContent =
                "OpenStreetMap";

    }

}


/* =========================================================
   START THE REAL-WORLD MAP IMMEDIATELY

   The start screen is above it, so the user still sees
   the selection screen first.
========================================================= */

initializeRealWorldMap();

</script>
