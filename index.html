<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>War Map Sandbox</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
}

/* =========================================================
   START SCREEN
========================================================= */

#startScreen {
    position: fixed;
    inset: 0;
    background: #111;
    color: white;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 10000;
}

#startScreen h1 {
    margin: 0 0 8px;
    font-size: 42px;
}

#startScreen p {
    margin: 0 0 35px;
    color: #aaa;
}

.startButtons {
    display: flex;
    gap: 20px;
}

.startButton {
    width: 260px;
    height: 155px;
    background: #1d1d1d;
    color: white;
    border: 1px solid #444;
    border-radius: 12px;
    cursor: pointer;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    transition: .15s;
}

.startButton:hover {
    background: #292929;
    border-color: #777;
    transform: translateY(-2px);
}

.startButton .icon {
    font-size: 42px;
    margin-bottom: 14px;
}

.startButton strong {
    font-size: 18px;
}

.startButton small {
    color: #aaa;
    margin-top: 5px;
}


/* =========================================================
   MAP
========================================================= */

#map {
    position: fixed;
    inset: 0;
}


/* =========================================================
   TOP TOOLBAR
========================================================= */

#topBar {
    position: fixed;
    z-index: 2000;

    top: 12px;
    left: 50%;
    transform: translateX(-50%);

    display: none;

    padding: 7px;

    background: rgba(20,20,20,.95);
    border: 1px solid #444;
    border-radius: 10px;

    box-shadow: 0 5px 20px rgba(0,0,0,.4);

    gap: 5px;
}

.toolButton {
    background: #2a2a2a;
    border: none;
    color: white;

    padding: 9px 12px;

    border-radius: 6px;

    cursor: pointer;
    font-size: 13px;
}

.toolButton:hover {
    background: #3a3a3a;
}

.toolButton.active {
    background: #555;
}


/* =========================================================
   DRAWING BAR
========================================================= */

#drawBar {
    position: fixed;

    z-index: 3000;

    bottom: 20px;
    left: 50%;

    transform: translateX(-50%);

    display: none;

    background: rgba(20,20,20,.96);

    border: 1px solid #555;

    border-radius: 10px;

    padding: 8px;

    box-shadow: 0 5px 20px rgba(0,0,0,.4);
}

.finishButton {
    background: #16833c;
}

.finishButton:hover {
    background: #1b9d49;
}

.cancelButton {
    background: #8b2525;
}

.cancelButton:hover {
    background: #a82d2d;
}


/* =========================================================
   LAYERS
========================================================= */

#layersPanel {
    position: fixed;

    top: 12px;
    left: 12px;

    width: 220px;

    z-index: 2000;

    display: none;

    background: rgba(20,20,20,.96);
    color: white;

    border: 1px solid #444;
    border-radius: 10px;

    padding: 14px;

    box-shadow: 0 5px 20px rgba(0,0,0,.4);
}

#layersPanel h3 {
    margin: 0 0 10px;
    font-size: 15px;
}

.layerRow {
    padding: 8px 0;
    border-bottom: 1px solid #333;

    display: flex;
    gap: 8px;
    align-items: center;
}


/* =========================================================
   SETTINGS
========================================================= */

#settingsPanel {
    position: fixed;

    top: 12px;
    right: 12px;

    width: 250px;

    z-index: 2000;

    display: none;

    background: rgba(20,20,20,.96);
    color: white;

    border: 1px solid #444;
    border-radius: 10px;

    padding: 15px;

    box-shadow: 0 5px 20px rgba(0,0,0,.4);
}

#settingsPanel h3 {
    margin: 0 0 15px;
}

.setting {
    margin-bottom: 14px;
}

.setting label {
    display: block;
    font-size: 13px;
    color: #aaa;
    margin-bottom: 5px;
}

.setting input {
    width: 100%;
}


/* =========================================================
   UPLOAD PANEL
========================================================= */

#uploadPanel {
    position: fixed;
    inset: 0;

    z-index: 11000;

    display: none;

    background: rgba(0,0,0,.78);

    align-items: center;
    justify-content: center;
}

.uploadBox {
    width: 450px;

    background: #1c1c1c;

    color: white;

    border: 1px solid #444;

    border-radius: 12px;

    padding: 25px;
}

.uploadBox h2 {
    margin-top: 0;
}

.uploadBox p {
    color: #aaa;
    line-height: 1.5;
}

.uploadBox input {
    width: 100%;
    margin: 12px 0;
}

.uploadBox label {
    display: block;
    color: #aaa;
    font-size: 13px;
    margin-top: 12px;
}

.uploadBox select {
    width: 100%;
    padding: 8px;
    margin-top: 5px;

    background: #292929;
    color: white;

    border: 1px solid #444;
}

.uploadActions {
    margin-top: 18px;
    display: flex;
    gap: 8px;
}


/* =========================================================
   TEXT MARKERS
========================================================= */

.mapText {
    color: white;

    font-weight: bold;

    font-size: 16px;

    white-space: nowrap;

    text-shadow:
        1px 1px 2px black,
        -1px -1px 2px black,
        1px -1px 2px black,
        -1px 1px 2px black;

    pointer-events: auto;
}


/* =========================================================
   SELECTED OBJECT
========================================================= */

.object-selected {
    filter: drop-shadow(0 0 5px white);
}


/* =========================================================
   IMAGE MODE
========================================================= */

.image-mode .leaflet-control-attribution {
    display: none;
}

</style>
</head>

<body>


<!-- =======================================================
     START SCREEN
======================================================= -->

<div id="startScreen">

    <h1>War Map Sandbox</h1>

    <p>Choose the map you want to work with</p>

    <div class="startButtons">

        <button
            class="startButton"
            onclick="startOpenStreetMap()"
        >
            <div class="icon">🌍</div>
            <strong>OpenStreetMap</strong>
            <small>Real-world map</small>
        </button>


        <button
            class="startButton"
            onclick="openUploadPanel()"
        >
            <div class="icon">🖼️</div>
            <strong>Upload Map</strong>
            <small>Use your own map image</small>
        </button>

    </div>

</div>


<!-- =======================================================
     UPLOAD PANEL
======================================================= -->

<div id="uploadPanel">

    <div class="uploadBox">

        <h2>Upload Map</h2>

        <p>
            Upload a PNG, JPG or WebP map. The image will keep
            its original proportions and become the background
            of the sandbox.
        </p>

        <input
            id="imageInput"
            type="file"
            accept="image/png,image/jpeg,image/webp"
        >

        <label>Image quality</label>

        <select id="qualitySelect">

            <option value="1">
                Original
            </option>

            <option value="2">
                Enhanced ×2
            </option>

            <option value="3">
                High resolution ×3
            </option>

            <option value="4">
                High resolution ×4
            </option>

        </select>

        <div class="uploadActions">

            <button
                class="toolButton"
                onclick="loadUploadedMap()"
            >
                Open Map
            </button>

            <button
                class="toolButton"
                onclick="closeUploadPanel()"
            >
                Cancel
            </button>

        </div>

    </div>

</div>


<!-- =======================================================
     MAP
======================================================= -->

<div id="map"></div>


<!-- =======================================================
     TOOLBAR
======================================================= -->

<div id="topBar">

    <button
        class="toolButton"
        onclick="setTool('select')"
    >
        Select
    </button>

    <button
        class="toolButton"
        onclick="setTool('polygon')"
    >
        🔺 Polygon
    </button>

    <button
        class="toolButton"
        onclick="setTool('curve')"
    >
        〰 Curved Line
    </button>

    <button
        class="toolButton"
        onclick="setTool('line')"
    >
        ━ Line
    </button>

    <button
        class="toolButton"
        onclick="setTool('marker')"
    >
        📍 Marker
    </button>

    <button
        class="toolButton"
        onclick="setTool('text')"
    >
        T Text
    </button>

    <button
        class="toolButton"
        onclick="setTool('delete')"
    >
        🗑 Delete
    </button>

    <button
        class="toolButton"
        onclick="undo()"
    >
        ↶
    </button>

    <button
        class="toolButton"
        onclick="redo()"
    >
        ↷
    </button>

    <button
        class="toolButton"
        onclick="toggleLayers()"
    >
        Layers
    </button>

    <button
        class="toolButton"
        onclick="toggleSettings()"
    >
        ⚙
    </button>

    <button
        class="toolButton"
        onclick="newMap()"
    >
        New
    </button>

</div>


<!-- =======================================================
     DRAW BAR
======================================================= -->

<div id="drawBar">

    <button
        class="toolButton finishButton"
        onclick="finishDrawing()"
    >
        ✓ Finish
    </button>

    <button
        class="toolButton cancelButton"
        onclick="cancelDrawing()"
    >
        ✕ Cancel
    </button>

    <span
        id="pointCounter"
        style="
            color:#bbb;
            padding:9px 10px;
            font-size:13px;
        "
    >
        0 points
    </span>

</div>


<!-- =======================================================
     LAYERS
======================================================= -->

<div id="layersPanel">

    <h3>Layers</h3>

    <div class="layerRow">
        <input type="checkbox" checked>
        <span>Background</span>
    </div>

    <div class="layerRow">
        <input type="checkbox" checked>
        <span>Territories</span>
    </div>

    <div class="layerRow">
        <input type="checkbox" checked>
        <span>Frontlines</span>
    </div>

    <div class="layerRow">
        <input type="checkbox" checked>
        <span>Markers</span>
    </div>

    <div class="layerRow">
        <input type="checkbox" checked>
        <span>Text</span>
    </div>

</div>


<!-- =======================================================
     SETTINGS
======================================================= -->

<div id="settingsPanel">

    <h3>Object Settings</h3>

    <div class="setting">

        <label>Color</label>

        <input
            id="colorPicker"
            type="color"
            value="#ff0000"
        >

    </div>


    <div class="setting">

        <label>Opacity</label>

        <input
            id="opacitySlider"
            type="range"
            min="0"
            max="1"
            step="0.05"
            value="0.45"
        >

    </div>


    <div class="setting">

        <label>Line Width</label>

        <input
            id="widthSlider"
            type="range"
            min="1"
            max="15"
            value="3"
        >

    </div>


    <button
        class="toolButton"
        onclick="applySettings()"
    >
        Apply
    </button>

</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script>

/* =========================================================
   GLOBAL STATE
========================================================= */

let map = null;

let mapMode = null;

let osmLayer = null;
let satelliteLayer = null;
let imageLayer = null;

let objects = [];

let currentTool = "select";

let drawing = false;

let currentPoints = [];

let previewLayer = null;

let selectedObject = null;

let undoHistory = [];
let redoHistory = [];


/* =========================================================
   START REAL WORLD MAP
========================================================= */

function startOpenStreetMap() {

    document.getElementById("startScreen").style.display =
        "none";

    document.body.classList.remove("image-mode");

    mapMode = "osm";

    initializeRealMap();

}


/* =========================================================
   REAL MAP
========================================================= */

function initializeRealMap() {

    if (map) {
        map.remove();
    }

    map = L.map("map", {
        zoomControl: true
    }).setView([48.5, 37.5], 6);


    osmLayer = L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            maxZoom: 19,
            attribution:
                "&copy; OpenStreetMap contributors"
        }
    );


    satelliteLayer = L.tileLayer(
        "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
        {
            maxZoom: 19,
            attribution: "Esri"
        }
    );


    osmLayer.addTo(map);


    L.control.layers({

        "OpenStreetMap": osmLayer,

        "Satellite": satelliteLayer

    }).addTo(map);


    finishMapInitialization();

}


/* =========================================================
   COMMON MAP INITIALIZATION
========================================================= */

function finishMapInitialization() {

    document.getElementById("topBar").style.display =
        "flex";

    map.on("click", mapClick);

}


/* =========================================================
   UPLOAD PANEL
========================================================= */

function openUploadPanel() {

    document.getElementById("uploadPanel").style.display =
        "flex";

}


function closeUploadPanel() {

    document.getElementById("uploadPanel").style.display =
        "none";

}


/* =========================================================
   LOAD IMAGE MAP
========================================================= */

function loadUploadedMap() {

    const input =
        document.getElementById("imageInput");

    if (!input.files.length) {

        alert("Please select an image first.");

        return;
    }


    const file = input.files[0];

    const reader = new FileReader();


    reader.onload = function(event) {

        const img = new Image();


        img.onload = function() {

            createImageMap(img);

        };


        img.src = event.target.result;

    };


    reader.readAsDataURL(file);

}


/* =========================================================
   CREATE IMAGE MAP
========================================================= */

function createImageMap(img) {

    if (map) {
        map.remove();
    }


    mapMode = "image";

    document.body.classList.add("image-mode");


    /*
     * Upscale the image while preserving its
     * exact aspect ratio.
     */

    const scale =
        Number(
            document.getElementById("qualitySelect").value
        );


    const width =
        Math.round(img.naturalWidth * scale);

    const height =
        Math.round(img.naturalHeight * scale);


    const canvas =
        document.createElement("canvas");

    canvas.width = width;
    canvas.height = height;


    const ctx =
        canvas.getContext("2d");


    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = "high";


    ctx.drawImage(
        img,
        0,
        0,
        width,
        height
    );


    const imageData =
        canvas.toDataURL(
            "image/jpeg",
            .95
        );


    /*
     * IMPORTANT:
     *
     * The bounds use the NEW image dimensions.
     *
     * This is what prevents the image from being
     * stretched into a thin strip.
     */

    const bounds = [
        [0, 0],
        [height, width]
    ];


    map = L.map("map", {

        crs: L.CRS.Simple,

        minZoom: -5,

        maxZoom: 8,

        zoomControl: true

    });


    imageLayer =
        L.imageOverlay(
            imageData,
            bounds,
            {
                interactive: false
            }
        ).addTo(map);


    map.fitBounds(bounds);


    finishMapInitialization();


    closeUploadPanel();

}


/* =========================================================
   MAP CLICK
========================================================= */

function mapClick(e) {

    /*
     * DELETE
     */

    if (currentTool === "delete") {

        deleteObject(e);

        return;
    }


    /*
     * MARKER
     */

    if (currentTool === "marker") {

        createMarker(e.latlng);

        return;
    }


    /*
     * TEXT
     */

    if (currentTool === "text") {

        createText(e.latlng);

        return;
    }


    /*
     * POLYGON
     */

    if (currentTool === "polygon") {

        addDrawingPoint(e.latlng);

        return;
    }


    /*
     * CURVED LINE
     */

    if (currentTool === "curve") {

        addDrawingPoint(e.latlng);

        return;
    }


    /*
     * STRAIGHT LINE
     */

    if (currentTool === "line") {

        addDrawingPoint(e.latlng);

        return;
    }


    /*
     * SELECT
     */

    if (currentTool === "select") {

        clearSelection();

    }

}


/* =========================================================
   SET TOOL
========================================================= */

function setTool(tool) {

    /*
     * If already drawing, don't silently
     * throw away the unfinished object.
     */

    if (drawing) {

        if (
            !confirm(
                "Finish the current drawing first?"
            )
        ) {
            return;
        }

        finishDrawing();
    }


    currentTool = tool;

    currentPoints = [];

    drawing = false;

    updateDrawBar();


    document
        .querySelectorAll(".toolButton")
        .forEach(button => {
            button.classList.remove("active");
        });


    if (
        tool === "polygon" ||
        tool === "curve" ||
        tool === "line"
    ) {

        drawing = true;

        currentPoints = [];

        updateDrawBar();

    }

}


/* =========================================================
   ADD DRAWING POINT
========================================================= */

function addDrawingPoint(latlng) {

    if (!drawing) {
        return;
    }


    currentPoints.push([
        latlng.lat,
        latlng.lng
    ]);


    updatePointCounter();

    updatePreview();

}


/* =========================================================
   PREVIEW
========================================================= */

function updatePreview() {

    if (previewLayer) {

        map.removeLayer(previewLayer);

        previewLayer = null;

    }


    if (currentPoints.length === 0) {
        return;
    }


    const color =
        document.getElementById("colorPicker").value;

    const opacity =
        Number(
            document.getElementById("opacitySlider").value
        );

    const width =
        Number(
            document.getElementById("widthSlider").value
        );


    /*
     * POLYGON
     */

    if (currentTool === "polygon") {

        previewLayer =
            L.polygon(
                currentPoints,
                {
                    color: color,
                    fillColor: color,
                    fillOpacity: opacity,
                    weight: width,
                    dashArray: "6 5"
                }
            ).addTo(map);

        return;
    }


    /*
     * STRAIGHT LINE
     */

    if (currentTool === "line") {

        previewLayer =
            L.polyline(
                currentPoints,
                {
                    color: color,
                    weight: width,
                    dashArray: "6 5"
                }
            ).addTo(map);

        return;
    }


    /*
     * CURVED LINE
     */

    if (currentTool === "curve") {

        const curve =
            makeSmoothCurve(
                currentPoints
            );

        previewLayer =
            L.polyline(
                curve,
                {
                    color: color,
                    weight: width,
                    dashArray: "6 5"
                }
            ).addTo(map);

    }

}


/* =========================================================
   SMOOTH CURVE
========================================================= */

function makeSmoothCurve(points) {

    if (points.length < 2) {
        return points;
    }


    if (points.length === 2) {
        return points;
    }


    const result = [];


    for (
        let i = 0;
        i < points.length - 1;
        i++
    ) {

        const p0 =
            points[Math.max(0, i - 1)];

        const p1 =
            points[i];

        const p2 =
            points[i + 1];

        const p3 =
            points[
                Math.min(
                    points.length - 1,
                    i + 2
                )
            ];


        for (
            let t = 0;
            t < 1;
            t += 0.08
        ) {

            const t2 = t * t;
            const t3 = t2 * t;


            const lat =
                0.5 *
                (
                    (2 * p1[0]) +
                    (-p0[0] + p2[0]) * t +
                    (2*p0[0] - 5*p1[0] + 4*p2[0] - p3[0]) * t2 +
                    (-p0[0] + 3*p1[0] - 3*p2[0] + p3[0]) * t3
                );


            const lng =
                0.5 *
                (
                    (2 * p1[1]) +
                    (-p0[1] + p2[1]) * t +
                    (2*p0[1] - 5*p1[1] + 4*p2[1] - p3[1]) * t2 +
                    (-p0[1] + 3*p1[1] - 3*p2[1] + p3[1]) * t3
                );


            result.push([
                lat,
                lng
            ]);

        }

    }


    result.push(
        points[points.length - 1]
    );


    return result;

}


/* =========================================================
   FINISH DRAWING
========================================================= */

function finishDrawing() {

    if (!drawing) {
        return;
    }


    /*
     * Remove preview
     */

    if (previewLayer) {

        map.removeLayer(previewLayer);

        previewLayer = null;

    }


    /*
     * Need enough points
     */

    if (
        currentTool === "polygon" &&
        currentPoints.length < 3
    ) {

        alert(
            "A polygon needs at least 3 points."
        );

        updatePreview();

        return;
    }


    if (
        currentTool === "curve" &&
        currentPoints.length < 2
    ) {

        alert(
            "A curved line needs at least 2 points."
        );

        updatePreview();

        return;
    }


    if (
        currentTool === "line" &&
        currentPoints.length < 2
    ) {

        alert(
            "A line needs at least 2 points."
        );

        updatePreview();

        return;
    }


    const color =
        document.getElementById("colorPicker").value;

    const opacity =
        Number(
            document.getElementById("opacitySlider").value
        );

    const width =
        Number(
            document.getElementById("widthSlider").value
        );


    let object = null;


    /*
     * POLYGON
     */

    if (currentTool === "polygon") {

        object =
            L.polygon(
                currentPoints,
                {
                    color: color,
                    fillColor: color,
                    fillOpacity: opacity,
                    weight: width
                }
            ).addTo(map);

    }


    /*
     * LINE
     */

    else if (currentTool === "line") {

        object =
            L.polyline(
                currentPoints,
                {
                    color: color,
                    weight: width
                }
            ).addTo(map);

    }


    /*
     * CURVE
     */

    else if (currentTool === "curve") {

        object =
            L.polyline(
                makeSmoothCurve(
                    currentPoints
                ),
                {
                    color: color,
                    weight: width
                }
            ).addTo(map);

    }


    if (object) {

        setupObject(object);

        objects.push(object);

        saveHistory();

    }


    currentPoints = [];

    drawing = false;

    currentTool = "select";

    updateDrawBar();

}


/* =========================================================
   CANCEL DRAWING
========================================================= */

function cancelDrawing() {

    if (previewLayer) {

        map.removeLayer(previewLayer);

        previewLayer = null;

    }


    currentPoints = [];

    drawing = false;

    currentTool = "select";

    updateDrawBar();

}


/* =========================================================
   DRAW BAR UI
========================================================= */

function updateDrawBar() {

    const bar =
        document.getElementById("drawBar");


    if (drawing) {

        bar.style.display = "flex";

    } else {

        bar.style.display = "none";

    }


    updatePointCounter();

}


/* =========================================================
   POINT COUNTER
========================================================= */

function updatePointCounter() {

    document.getElementById("pointCounter")
        .textContent =
        currentPoints.length +
        (
            currentPoints.length === 1
                ? " point"
                : " points"
        );

}


/* =========================================================
   OBJECT SETUP
========================================================= */

function setupObject(object) {


    /*
     * Clicking an object selects it.
     */

    object.on(
        "click",
        function(event) {

            L.DomEvent.stopPropagation();

            if (
                currentTool === "delete"
            ) {

                deleteSpecificObject(
                    object
                );

                return;

            }


            selectObject(object);

        }
    );


    /*
     * Double click allows editing.
     */

    object.on(
        "dblclick",
        function(event) {

            L.DomEvent.stopPropagation();

            editObject(object);

        }
    );

}


/* =========================================================
   SELECT OBJECT
========================================================= */

function selectObject(object) {

    clearSelection();


    selectedObject = object;


    if (object.setStyle) {

        object.setStyle({
            dashArray: "8 5"
        });

    }


    /*
     * For polygons and lines:
     *
     * create draggable vertex handles.
     */

    enableVertexEditing(object);

}


/* =========================================================
   CLEAR SELECTION
========================================================= */

function clearSelection() {

    if (selectedObject) {

        if (selectedObject.setStyle) {

            selectedObject.setStyle({
                dashArray: null
            });

        }

        removeVertexEditing(
            selectedObject
        );

    }


    selectedObject = null;

}


/* =========================================================
   VERTEX EDITING
========================================================= */

let editMarkers = [];


function enableVertexEditing(object) {

    removeVertexEditing(object);


    if (
        !object.getLatLngs
    ) {
        return;
    }


    let latlngs =
        object.getLatLngs();


    /*
     * Polygon returns nested arrays.
     */

    if (
        latlngs.length &&
        Array.isArray(latlngs[0])
    ) {

        latlngs = latlngs[0];

    }


    latlngs.forEach(
        function(latlng, index) {

            const handle =
                L.marker(
                    latlng,
                    {
                        draggable: true,
                        icon: L.divIcon({
                            className:
                                "vertex-handle",
                            html:
                                '<div style="' +
                                'width:12px;' +
                                'height:12px;' +
                                'background:white;' +
                                'border:2px solid #333;' +
                                'border-radius:50%;' +
                                '"></div>',
                            iconSize: [12,12],
                            iconAnchor: [6,6]
                        }),
                        zIndexOffset: 5000
                    }
                ).addTo(map);


            handle.on(
                "drag",
                function(e) {

                    const position =
                        e.target.getLatLng();


                    if (
                        object instanceof
                        L.Polygon
                    ) {

                        const current =
                            object.getLatLngs()[0];

                        current[index] =
                            position;

                        object.setLatLngs([
                            current
                        ]);

                    } else {

                        const current =
                            object.getLatLngs();

                        current[index] =
                            position;

                        object.setLatLngs(
                            current
                        );

                    }

                }
            );


            handle.on(
                "dragend",
                function() {

                    saveHistory();

                }
            );


            editMarkers.push(handle);

        }
    );

}


function removeVertexEditing() {

    editMarkers.forEach(
        function(marker) {

            if (map.hasLayer(marker)) {
                map.removeLayer(marker);
            }

        }
    );


    editMarkers = [];

}


/* =========================================================
   EDIT OBJECT
========================================================= */

function editObject(object) {

    selectObject(object);

}


/* =========================================================
   MARKER
========================================================= */

function createMarker(latlng) {

    const marker =
        L.circleMarker(
            latlng,
            {
                radius: 8,
                color: "white",
                weight: 2,
                fillColor:
                    document.getElementById(
                        "colorPicker"
                    ).value,
                fillOpacity: 1
            }
        ).addTo(map);


    setupObject(marker);

    objects.push(marker);

    saveHistory();

}


/* =========================================================
   TEXT
========================================================= */

function createText(latlng) {

    const text =
        prompt("Enter text:");


    if (!text) {
        return;
    }


    const marker =
        L.marker(
            latlng,
            {
                icon: L.divIcon({
                    className: "mapText",
                    html:
                        escapeHtml(text),
                    iconSize: null
                })
            }
        ).addTo(map);


    setupObject(marker);

    objects.push(marker);

    saveHistory();

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}


/* =========================================================
   DELETE
========================================================= */

function deleteObject(e) {

    /*
     * Clicking empty map doesn't delete anything.
     *
     * Actual objects handle their own clicks.
     */

}


/* =========================================================
   DELETE SPECIFIC
========================================================= */

function deleteSpecificObject(object) {

    if (!objects.includes(object)) {
        return;
    }


    if (selectedObject === object) {
        clearSelection();
    }


    map.removeLayer(object);


    objects =
        objects.filter(
            o => o !== object
        );


    saveHistory();

}


/* =========================================================
   SETTINGS
========================================================= */

function toggleSettings() {

    const panel =
        document.getElementById(
            "settingsPanel"
        );


    panel.style.display =
        panel.style.display === "block"
            ? "none"
            : "block";

}


function applySettings() {

    if (!selectedObject) {

        alert(
            "Select an object first."
        );

        return;
    }


    const color =
        document.getElementById(
            "colorPicker"
        ).value;


    const opacity =
        Number(
            document.getElementById(
                "opacitySlider"
            ).value
        );


    const width =
        Number(
            document.getElementById(
                "widthSlider"
            ).value
        );


    if (
        selectedObject.setStyle
    ) {

        selectedObject.setStyle({

            color: color,

            fillColor: color,

            fillOpacity: opacity,

            weight: width

        });

    }


    saveHistory();

}


/* =========================================================
   LAYERS
========================================================= */

function toggleLayers() {

    const panel =
        document.getElementById(
            "layersPanel"
        );


    panel.style.display =
        panel.style.display === "block"
            ? "none"
            : "block";

}


/* =========================================================
   HISTORY
========================================================= */

function serializeObjects() {

    return objects.map(
        function(object) {

            let type = "unknown";

            let coordinates = null;


            if (
                object instanceof L.Polygon
            ) {

                type = "polygon";

                coordinates =
                    object
                        .getLatLngs()[0]
                        .map(
                            p => [
                                p.lat,
                                p.lng
                            ]
                        );

            }


            else if (
                object instanceof L.Polyline
            ) {

                type = "line";

                coordinates =
                    object
                        .getLatLngs()
                        .map(
                            p => [
                                p.lat,
                                p.lng
                            ]
                        );

            }


            else if (
                object instanceof
                L.CircleMarker
            ) {

                type = "marker";

                const p =
                    object.getLatLng();

                coordinates =
                    [
                        p.lat,
                        p.lng
                    ];

            }


            else if (
                object instanceof
                L.Marker
            ) {

                type = "marker";

                const p =
                    object.getLatLng();

                coordinates =
                    [
                        p.lat,
                        p.lng
                    ];

            }


            let style = {};


            if (object.options) {

                style = {

                    color:
                        object.options.color,

                    fillColor:
                        object.options.fillColor,

                    fillOpacity:
                        object.options.fillOpacity,

                    weight:
                        object.options.weight,

                    radius:
                        object.options.radius

                };

            }


            return {
                type,
                coordinates,
                style
            };

        }
    );

}


/* =========================================================
   SAVE HISTORY
========================================================= */

function saveHistory() {

    undoHistory.push(
        JSON.stringify(
            serializeObjects()
        )
    );


    /*
     * Keep memory reasonable.
     */

    if (undoHistory.length > 50) {

        undoHistory.shift();

    }


    redoHistory = [];

}


/* =========================================================
   RESTORE HISTORY
========================================================= */

function restoreState(serialized) {

    /*
     * Remove current objects.
     */

    objects.forEach(
        object => {

            if (map.hasLayer(object)) {
                map.removeLayer(object);
            }

        }
    );


    objects = [];


    const data =
        JSON.parse(serialized);


    data.forEach(
        function(item) {

            let object = null;


            if (
                item.type === "polygon"
            ) {

                object =
                    L.polygon(
                        item.coordinates,
                        item.style
                    ).addTo(map);

            }


            else if (
                item.type === "line"
            ) {

                object =
                    L.polyline(
                        item.coordinates,
                        item.style
                    ).addTo(map);

            }


            else if (
                item.type === "marker"
            ) {

                object =
                    L.circleMarker(
                        item.coordinates,
                        item.style
                    ).addTo(map);

            }


            if (object) {

                setupObject(object);

                objects.push(object);

            }

        }
    );

}


/* =========================================================
   UNDO
========================================================= */

function undo() {

    if (undoHistory.length <= 1) {
        return;
    }


    const current =
        undoHistory.pop();


    redoHistory.push(
        current
    );


    const previous =
        undoHistory[
            undoHistory.length - 1
        ];


    restoreState(previous);

}


/* =========================================================
   REDO
========================================================= */

function redo() {

    if (!redoHistory.length) {
        return;
    }


    const state =
        redoHistory.pop();


    undoHistory.push(
        state
    );


    restoreState(state);

}


/* =========================================================
   NEW MAP
========================================================= */

function newMap() {

    if (
        !confirm(
            "Start a new map?"
        )
    ) {
        return;
    }


    if (map) {
        map.remove();
    }


    map = null;

    objects = [];

    currentPoints = [];

    undoHistory = [];

    redoHistory = [];

    selectedObject = null;

    imageLayer = null;

    document.getElementById(
        "topBar"
    ).style.display = "none";


    document.getElementById(
        "layersPanel"
    ).style.display = "none";


    document.getElementById(
        "settingsPanel"
    ).style.display = "none";


    cancelDrawing();


    document.getElementById(
        "startScreen"
    ).style.display = "flex";

}


/* =========================================================
   KEYBOARD SHORTCUTS
========================================================= */

document.addEventListener(
    "keydown",
    function(e) {

        /*
         * ESC = cancel drawing
         */

        if (e.key === "Escape") {

            if (drawing) {
                cancelDrawing();
            }

        }


        /*
         * CTRL + Z
         */

        if (
            (e.ctrlKey || e.metaKey) &&
            e.key.toLowerCase() === "z"
        ) {

            e.preventDefault();

            undo();

        }


        /*
         * CTRL + Y
         */

        if (
            (e.ctrlKey || e.metaKey) &&
            e.key.toLowerCase() === "y"
        ) {

            e.preventDefault();

            redo();

        }


        /*
         * DELETE key
         */

        if (
            e.key === "Delete" &&
            selectedObject
        ) {

            deleteSpecificObject(
                selectedObject
            );

        }

    }
);

</script>
